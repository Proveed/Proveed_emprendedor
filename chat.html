<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>PROVEED — Chat</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
:root{--acc:#A8E63D;--acc2:#7BC234;--gris:#F5F6F2;--naranja:#FF8C00;--rojo:#FF4D4D;}
body{background:var(--gris);font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;}
#vista-lista{display:block;}
#vista-chat{display:none;}
.header-lista{background:white;padding:48px 16px 12px;border-bottom:2.5px solid var(--acc);position:sticky;top:0;z-index:50;}
.hl-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
.hl-logo{display:flex;align-items:center;gap:8px;}
.hl-title{font-size:1rem;font-weight:900;color:#111;}
.hl-title span{color:var(--acc2);}
.hl-badge{background:var(--acc);color:#111;font-size:0.62rem;font-weight:800;padding:3px 9px;border-radius:20px;display:none;}
.search-wrap{display:flex;align-items:center;gap:8px;background:var(--gris);border-radius:24px;padding:10px 14px;border:1.5px solid #eee;}
.search-wrap svg{width:15px;height:15px;stroke:#bbb;fill:none;stroke-width:2.5;flex-shrink:0;}
.search-wrap input{flex:1;background:transparent;border:none;outline:none;font-family:'Inter',sans-serif;font-size:0.86rem;color:#111;}
.search-wrap input::placeholder{color:#ccc;}
.chats-scroll{overflow-y:auto;padding-bottom:90px;}
.chat-item{display:flex;align-items:center;gap:12px;padding:14px 16px;cursor:pointer;border-bottom:1px solid #f5f5f5;background:white;}
.chat-item:active{background:var(--gris);}
.chat-item.noleido{background:rgba(168,230,61,0.04);border-left:3px solid var(--acc);}
.ci-av{width:46px;height:46px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:1rem;font-weight:800;color:white;flex-shrink:0;overflow:hidden;position:relative;}
.ci-av img{width:100%;height:100%;object-fit:cover;}
.ci-dot{position:absolute;bottom:1px;right:1px;width:9px;height:9px;background:var(--acc);border-radius:50%;border:2px solid white;}
.ci-info{flex:1;min-width:0;}
.ci-nombre{font-size:0.88rem;font-weight:700;color:#111;margin-bottom:2px;}
.ci-prod{font-size:0.68rem;color:var(--acc2);font-weight:600;margin-bottom:2px;}
.ci-msg{font-size:0.75rem;color:#aaa;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;}
.ci-right{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex-shrink:0;}
.ci-hora{font-size:0.6rem;color:#bbb;}
.ci-unread{width:18px;height:18px;background:var(--acc2);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:0.58rem;font-weight:800;color:#111;}
.ci-neg{font-size:0.58rem;font-weight:800;padding:2px 7px;border-radius:20px;background:rgba(255,140,0,0.1);color:var(--naranja);}
.empty-chats{text-align:center;padding:60px 20px;color:#bbb;}
.empty-chats div{font-size:3rem;margin-bottom:10px;}
.empty-chats p{font-size:0.82rem;line-height:1.6;}
.chat-header{position:fixed;top:0;left:0;right:0;background:white;padding:44px 12px 12px;border-bottom:2.5px solid var(--acc);display:flex;align-items:center;gap:10px;z-index:100;}
.ch-back{width:36px;height:36px;background:rgba(168,230,61,0.12);border-radius:11px;display:flex;align-items:center;justify-content:center;border:none;cursor:pointer;flex-shrink:0;}
.ch-back svg{width:18px;height:18px;stroke:var(--acc2);fill:none;stroke-width:2.5;}
.ch-av{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:0.9rem;font-weight:800;color:white;flex-shrink:0;overflow:hidden;}
.ch-av img{width:100%;height:100%;object-fit:cover;}
.ch-info{flex:1;min-width:0;}
.ch-nombre{font-size:0.9rem;font-weight:800;color:#111;}
.ch-sub{font-size:0.68rem;color:var(--acc2);font-weight:600;margin-top:1px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;}
.ch-btns{display:flex;gap:6px;}
.ch-btn{width:32px;height:32px;border-radius:10px;background:rgba(168,230,61,0.12);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.ch-btn svg{width:15px;height:15px;stroke:var(--acc2);fill:none;stroke-width:2;}
.prod-banner{position:fixed;left:0;right:0;background:white;border-bottom:1px solid #eee;padding:10px 14px;display:flex;align-items:center;gap:10px;z-index:99;}
.pb-img{width:42px;height:42px;border-radius:10px;background:var(--gris);flex-shrink:0;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:1.2rem;}
.pb-img img{width:100%;height:100%;object-fit:cover;}
.pb-info{flex:1;min-width:0;}
.pb-nombre{font-size:0.82rem;font-weight:700;color:#111;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;}
.pb-precio{font-size:0.75rem;color:var(--naranja);font-weight:800;margin-top:1px;}
.btn-neg-banner{padding:7px 14px;background:var(--acc);color:#111;border:none;border-radius:20px;font-family:'Inter',sans-serif;font-size:0.72rem;font-weight:800;cursor:pointer;white-space:nowrap;}
.msgs-wrap{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 14px;background:var(--gris);display:flex;flex-direction:column;gap:6px;}
.input-area{position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid #eee;padding:8px 12px;padding-bottom:max(12px,env(safe-area-inset-bottom));z-index:100;}
.input-extras{display:flex;gap:6px;margin-bottom:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;}
.input-extras::-webkit-scrollbar{display:none;}
.btn-extra{padding:6px 12px;border-radius:20px;border:1.5px solid #eee;background:white;font-family:'Inter',sans-serif;font-size:0.68rem;font-weight:700;color:#555;cursor:pointer;white-space:nowrap;flex-shrink:0;display:flex;align-items:center;gap:4px;}
.btn-extra.verde{border-color:var(--acc);color:var(--acc2);background:rgba(168,230,61,0.06);}
.btn-extra svg{width:11px;height:11px;stroke:currentColor;fill:none;stroke-width:2.5;}
.input-row{display:flex;align-items:flex-end;gap:8px;}
.input-box{flex:1;background:var(--gris);border-radius:22px;padding:10px 14px;display:flex;align-items:flex-end;gap:6px;border:1.5px solid #eee;}
.msg-ta{flex:1;background:transparent;border:none;outline:none;font-family:'Inter',sans-serif;font-size:0.88rem;color:#111;resize:none;line-height:1.4;min-height:22px;max-height:100px;width:100%;}
.msg-ta::placeholder{color:#ccc;}
.btn-send{width:40px;height:40px;background:var(--acc);border-radius:50%;display:flex;align-items:center;justify-content:center;border:none;cursor:pointer;flex-shrink:0;}
.btn-send svg{width:16px;height:16px;stroke:#111;fill:none;stroke-width:2.5;}
.msg{display:flex;flex-direction:column;position:relative;}
.msg.mio{align-items:flex-end;}
.msg.suyo{align-items:flex-start;}
.msg-b{padding:10px 13px;border-radius:18px;font-size:0.86rem;line-height:1.5;max-width:78%;word-break:break-word;cursor:pointer;-webkit-user-select:none;user-select:none;}
.msg.mio .msg-b{background:var(--acc);color:#111;border-bottom-right-radius:4px;}
.msg.suyo .msg-b{background:white;color:#111;border-bottom-left-radius:4px;box-shadow:0 1px 4px rgba(0,0,0,0.07);}
.msg-hora{font-size:0.58rem;color:#bbb;margin-top:3px;padding:0 4px;}
.msg-menu{position:fixed;background:white;border-radius:12px;box-shadow:0 4px 20px rgba(0,0,0,0.15);padding:4px;z-index:600;border:1px solid #eee;display:none;}
.msg-menu.show{display:block;}
.msg-menu button{display:flex;align-items:center;gap:8px;width:100%;padding:9px 14px;background:transparent;border:none;font-family:'Inter',sans-serif;font-size:0.82rem;font-weight:600;color:var(--rojo);cursor:pointer;border-radius:8px;white-space:nowrap;}
.msg-menu button svg{width:14px;height:14px;stroke:var(--rojo);fill:none;stroke-width:2;}
.overlay-cierra{position:fixed;inset:0;z-index:599;display:none;}
.overlay-cierra.show{display:block;}
.msg-especial{display:flex;justify-content:center;width:100%;padding:4px 0;}
.msg-neg-card{background:white;border:2px solid var(--acc);border-radius:18px;padding:14px;width:92%;max-width:340px;box-shadow:0 3px 14px rgba(168,230,61,0.12);}
.mn-head{font-size:0.66rem;font-weight:800;color:var(--acc2);text-transform:uppercase;margin-bottom:8px;}
.mn-item-row{display:flex;justify-content:space-between;font-size:0.76rem;padding:4px 0;border-bottom:1px solid #f5f5f5;}
.mn-item-row:last-child{border:none;}
.mn-nom{color:#555;flex:1;}
.mn-orig{color:#bbb;text-decoration:line-through;margin-right:6px;}
.mn-new{font-weight:800;color:var(--acc2);}
.mn-totales{display:flex;align-items:center;gap:8px;margin:8px 0;}
.mn-tot-orig{font-size:0.8rem;color:#bbb;text-decoration:line-through;}
.mn-tot-new{font-size:1rem;font-weight:900;color:var(--acc2);}
.mn-nota-txt{font-size:0.74rem;color:#666;font-style:italic;margin-bottom:10px;padding:8px;background:var(--gris);border-radius:8px;line-height:1.4;}
.mn-bts{display:flex;gap:6px;}
.mn-bt{flex:1;padding:9px 4px;border:none;border-radius:11px;font-family:'Inter',sans-serif;font-size:0.72rem;font-weight:800;cursor:pointer;}
.mn-bt.ok{background:var(--acc);color:#111;}
.mn-bt.no{background:rgba(255,77,77,0.08);color:var(--rojo);}
.mn-bt.cnt{background:var(--gris);color:#555;}
.mn-status{text-align:center;font-size:0.72rem;font-weight:700;padding:7px;border-radius:10px;margin-top:4px;}
.mn-status.aceptado{background:rgba(168,230,61,0.1);color:var(--acc2);}
.mn-status.rechazado{background:rgba(255,77,77,0.06);color:var(--rojo);}
.mn-status.pendiente{background:rgba(255,140,0,0.08);color:var(--naranja);}
.mn-hora-small{font-size:0.58rem;color:#bbb;text-align:right;margin-top:4px;}
.msg-carrito-card{background:white;border:1.5px solid #eee;border-radius:18px;padding:12px 14px;width:92%;max-width:340px;box-shadow:0 1px 6px rgba(0,0,0,0.05);}
.mc-head{font-size:0.63rem;font-weight:800;color:#aaa;text-transform:uppercase;margin-bottom:8px;}
.mc-row{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid #f8f8f8;}
.mc-row:last-of-type{border:none;}
.mc-img{width:30px;height:30px;border-radius:7px;background:var(--gris);overflow:hidden;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:0.9rem;}
.mc-img img{width:100%;height:100%;object-fit:cover;}
.mc-det{flex:1;}
.mc-nombre{font-size:0.76rem;font-weight:600;color:#111;}
.mc-cant{font-size:0.64rem;color:#aaa;}
.mc-precio{font-size:0.78rem;font-weight:800;color:var(--naranja);}
.mc-total-row{display:flex;justify-content:space-between;margin-top:8px;padding-top:6px;border-top:1px solid #eee;}
.mc-total-lbl{font-size:0.72rem;color:#aaa;}
.mc-total-val{font-size:0.9rem;font-weight:900;color:var(--acc2);}
.mc-btn-pedido{width:100%;margin-top:8px;padding:10px;background:#111;color:white;border:none;border-radius:11px;font-family:'Inter',sans-serif;font-size:0.82rem;font-weight:700;cursor:pointer;}
.modal-ov{position:fixed;inset:0;background:rgba(0,0,0,0.35);display:none;align-items:flex-end;z-index:500;}
.modal-ov.show{display:flex;}
.modal-sh{background:white;width:100%;border-radius:24px 24px 0 0;transform:translateY(100%);transition:0.4s cubic-bezier(0.16,1,0.3,1);max-height:92vh;display:flex;flex-direction:column;overflow:hidden;}
.modal-ov.show .modal-sh{transform:translateY(0);}
.drag{width:36px;height:4px;background:#e0e0e0;border-radius:4px;margin:14px auto 0;flex-shrink:0;}
.modal-hdr{padding:12px 16px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #eee;flex-shrink:0;}
.modal-title{font-size:0.95rem;font-weight:800;color:#111;}
.close-btn{width:28px;height:28px;background:var(--gris);border-radius:8px;display:flex;align-items:center;justify-content:center;cursor:pointer;border:none;}
.close-btn svg{width:13px;height:13px;stroke:#555;fill:none;stroke-width:2.5;}
.modal-body{overflow-y:auto;padding:16px 16px 36px;flex:1;}
.neg-intro{font-size:0.8rem;color:#aaa;line-height:1.6;margin-bottom:14px;}
.neg-item-card{background:var(--gris);border-radius:14px;padding:12px;margin-bottom:10px;}
.nic-top{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
.nic-img{width:38px;height:38px;border-radius:9px;background:white;overflow:hidden;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:1.1rem;}
.nic-img img{width:100%;height:100%;object-fit:cover;}
.nic-info{flex:1;}
.nic-nombre{font-size:0.82rem;font-weight:700;color:#111;}
.nic-cant{font-size:0.68rem;color:#aaa;}
.nic-precios{display:flex;align-items:center;gap:10px;}
.nic-orig{font-size:0.76rem;color:#bbb;text-decoration:line-through;white-space:nowrap;}
.nic-input{flex:1;padding:9px 12px;background:white;border:2px solid var(--acc);border-radius:10px;font-family:'Inter',sans-serif;font-size:0.9rem;font-weight:800;color:#111;text-align:center;outline:none;}
.nic-unit{font-size:0.68rem;color:#aaa;white-space:nowrap;}
.neg-resumen{background:rgba(168,230,61,0.07);border:1px solid rgba(123,194,52,0.2);border-radius:14px;padding:14px;margin-bottom:14px;}
.nr-row{display:flex;justify-content:space-between;font-size:0.78rem;margin-bottom:5px;}
.nr-lbl{color:#aaa;}
.nr-val{font-weight:700;color:#111;}
.nr-final{display:flex;justify-content:space-between;padding-top:8px;border-top:1px solid rgba(123,194,52,0.2);}
.nr-final-lbl{font-size:0.88rem;font-weight:800;color:#111;}
.nr-final-val{font-size:1rem;font-weight:900;color:var(--acc2);}
.neg-nota-field{margin-bottom:14px;}
.neg-nota-field label{display:block;font-size:0.65rem;font-weight:700;color:#aaa;text-transform:uppercase;margin-bottom:5px;}
.neg-nota-field textarea{width:100%;padding:12px;background:var(--gris);border:1.5px solid #eee;border-radius:12px;font-family:'Inter',sans-serif;font-size:0.86rem;color:#111;resize:none;height:70px;outline:none;}
.neg-nota-field textarea:focus{border-color:var(--acc);}
.btn-env-neg{width:100%;padding:14px;background:var(--acc);color:#111;border:none;border-radius:14px;font-family:'Inter',sans-serif;font-size:0.92rem;font-weight:800;cursor:pointer;margin-bottom:8px;}
.btn-solo-car{width:100%;padding:12px;background:#111;color:white;border:none;border-radius:14px;font-family:'Inter',sans-serif;font-size:0.86rem;font-weight:700;cursor:pointer;}
.cat-search-m{display:flex;align-items:center;gap:8px;background:var(--gris);border-radius:20px;padding:10px 14px;border:1.5px solid #eee;margin-bottom:12px;}
.cat-search-m svg{width:14px;height:14px;stroke:#bbb;fill:none;stroke-width:2.5;flex-shrink:0;}
.cat-search-m input{flex:1;background:transparent;border:none;outline:none;font-family:'Inter',sans-serif;font-size:0.86rem;color:#111;}
.cat-search-m input::placeholder{color:#ccc;}
.prods-cat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.pcc{background:white;border-radius:14px;overflow:hidden;border:1px solid #eee;cursor:pointer;}
.pcc-img{width:100%;height:90px;background:var(--gris);display:flex;align-items:center;justify-content:center;font-size:2rem;overflow:hidden;position:relative;}
.pcc-img img{width:100%;height:100%;object-fit:cover;}
.pcc-badge{position:absolute;top:5px;left:5px;font-size:0.55rem;font-weight:800;padding:2px 6px;border-radius:20px;color:white;text-transform:uppercase;}
.pcc-body{padding:8px;}
.pcc-nombre{font-size:0.76rem;font-weight:700;color:#111;margin-bottom:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.pcc-precio{font-size:0.86rem;font-weight:900;color:var(--naranja);}
.pcc-min{font-size:0.6rem;color:#bbb;margin-bottom:6px;}
.pcc-add-btn{width:100%;padding:7px;background:#111;color:white;border:none;border-radius:8px;font-family:'Inter',sans-serif;font-size:0.72rem;font-weight:700;cursor:pointer;}
.tab-bar{position:fixed;bottom:0;width:100%;background:white;border-top:1px solid #eee;display:flex;padding:8px 0;padding-bottom:max(8px,env(safe-area-inset-bottom));z-index:200;box-shadow:0 -2px 12px rgba(0,0,0,0.05);}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;border:none;background:transparent;cursor:pointer;text-decoration:none;font-family:'Inter',sans-serif;padding:4px 0;}
.tab svg{width:22px;height:22px;stroke:#ccc;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.tab span{font-size:0.55rem;font-weight:700;color:#ccc;text-transform:uppercase;}
.tab.active svg{stroke:var(--acc2);}
.tab.active span{color:var(--acc2);}
.tab-rel{position:relative;}
.tab-badge{position:absolute;top:-2px;right:6px;background:var(--rojo);color:white;font-size:0.5rem;font-weight:800;width:14px;height:14px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:1.5px solid white;}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%) translateY(20px);background:#111;color:white;padding:10px 20px;border-radius:24px;font-size:0.8rem;font-weight:600;opacity:0;transition:0.3s;pointer-events:none;z-index:2000;white-space:nowrap;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>

<div id="vista-lista">
  <div class="header-lista">
    <div class="hl-top">
      <div class="hl-logo">
        <svg width="26" height="26" viewBox="0 0 28 28" fill="none"><polygon points="14,1.5 25,7.5 25,20.5 14,26.5 3,20.5 3,7.5" fill="#A8E63D"/><polyline points="8,14 12,18 20,10" stroke="#111" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span class="hl-title">PRO<span>VEED</span> · Chats</span>
      </div>
      <span class="hl-badge" id="badge-nl">0</span>
    </div>
    <div class="search-wrap">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      <input type="text" placeholder="Buscar conversación..." oninput="filtrarChats(this.value)">
    </div>
  </div>
  <div class="chats-scroll" id="chats-scroll">
    <div style="text-align:center;padding:30px;color:#bbb;font-size:0.82rem;">Cargando...</div>
  </div>
</div>

<div id="vista-chat">
  <div class="chat-header" id="chat-header">
    <button class="ch-back" onclick="volverLista()"><svg viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg></button>
    <div class="ch-av" id="ch-av">P</div>
    <div class="ch-info">
      <div class="ch-nombre" id="ch-nombre">—</div>
      <div class="ch-sub" id="ch-sub">—</div>
    </div>
    <div class="ch-btns">
      <button class="ch-btn" onclick="abrirCatalogo()"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg></button>
      <button class="ch-btn" onclick="window.location.href='dashboard-emp.html'"><svg viewBox="0 0 24 24"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg></button>
    </div>
  </div>
  <div class="prod-banner" id="prod-banner" style="display:none;">
    <div class="pb-img" id="pb-img">📦</div>
    <div class="pb-info">
      <div class="pb-nombre" id="pb-nombre">—</div>
      <div class="pb-precio" id="pb-precio">$0.00</div>
    </div>
    <button class="btn-neg-banner" onclick="abrirNeg()">🤝 Negociar</button>
  </div>
  <div class="msgs-wrap" id="msgs-wrap"></div>
  <div class="input-area" id="input-area">
    <div class="input-extras">
      <button class="btn-extra verde" onclick="abrirNeg()"><svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/></svg>🤝 Negociar</button>
      <button class="btn-extra" onclick="compartirCarrito()"><svg viewBox="0 0 24 24"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>📦 Carrito</button>

      <div class="prods-cat-grid" id="prods-cat-grid"><div style="grid-column:1/-1;text-align:center;padding:20px;color:#bbb;font-size:0.8rem;">Cargando...</div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const {createClient}=supabase;
const sb=createClient('https://hfmsyrmkewscnvwynzfq.supabase.co','sb_publishable_d1oLsq70a6ZV33vW3XkRgw_nYcN2Z9v');

let userId='',userData={},chatActivo=null,todosChats=[],msgs=[],prodActivo=null,rtSub=null;
let itemsNeg={},catalogoAll=[],msgMenuId=null;
const QS=new URLSearchParams(location.search);

let carrito=JSON.parse(localStorage.getItem('carrito_proveed')||'[]');
function syncBadge(){const n=carrito.reduce((s,i)=>s+(i.cantidad||1),0);const b=document.getElementById('carrito-badge');if(n>0){b.style.display='flex';b.textContent=n>9?'9+':n;}else b.style.display='none';}
syncBadge();

function ajustarAlturas(){
  if(document.getElementById('vista-chat').style.display==='none')return;
  const hH=document.getElementById('chat-header').offsetHeight;
  const bEl=document.getElementById('prod-banner');
  const bH=bEl.style.display!=='none'?bEl.offsetHeight:0;
  const iH=document.getElementById('input-area').offsetHeight;
  const tH=document.querySelector('.tab-bar').offsetHeight;
  bEl.style.top=hH+'px';
  document.getElementById('input-area').style.bottom=tH+'px';
  const w=document.getElementById('msgs-wrap');
  w.style.marginTop=(hH+bH)+'px';
  w.style.marginBottom=(iH+tH)+'px';
  w.style.minHeight='100px';
  setTimeout(()=>w.scrollTop=w.scrollHeight,50);
}
window.addEventListener('resize',ajustarAlturas);

(async()=>{
  const{data:{session}}=await sb.auth.getSession();
  if(!session){window.location.href='login.html';return;}
  userId=session.user.id;
  const{data:u}=await sb.from('usuarios').select('*').eq('id',userId).single();
  if(u)userData=u;
  await cargarChats();
  const pId=QS.get('proveedor_id');
  const prodId=QS.get('prod_id');
  if(pId){
    const ex=todosChats.find(c=>c.proveedor_id===pId);
    if(ex)await abrirChat(ex,null,false);
    else await crearChat(pId,prodId);
  }
})();

async function cargarChats(){
  const{data}=await sb.from('chats').select('*').eq('emprendedor_id',userId).order('updated_at',{ascending:false});
  todosChats=data||[];
  renderChats(todosChats);
  const nl=todosChats.filter(c=>c.no_leido>0).length;
  const b=document.getElementById('badge-nl');
  if(nl>0){b.textContent=nl;b.style.display='inline-flex';}else b.style.display='none';
}

function renderChats(lista){
  const cont=document.getElementById('chats-scroll');
  if(!lista.length){cont.innerHTML='<div class="empty-chats"><div>💬</div><p>Sin conversaciones aún.<br>Entra a un producto y toca "Chat con proveedor".</p></div>';return;}
  cont.innerHTML='';
  lista.forEach(c=>{
    const nombre=c.proveedor_nombre||'Proveedor';
    const hora=c.updated_at?new Date(c.updated_at).toLocaleTimeString('es-EC',{hour:'2-digit',minute:'2-digit'}):'';
    const div=document.createElement('div');
    div.className='chat-item'+(c.no_leido>0?' noleido':'');
    div.innerHTML=`<div class="ci-av" style="background:${bgCol(nombre)};">${nombre[0].toUpperCase()}<div class="ci-dot"></div></div><div class="ci-info"><div class="ci-nombre">${nombre}</div>${c.producto_nombre?`<div class="ci-prod">📦 ${c.producto_nombre}</div>`:''}<div class="ci-msg">${c.ultimo_mensaje||'Nueva conversación'}</div></div><div class="ci-right"><div class="ci-hora">${hora}</div>${c.no_leido>0?`<div class="ci-unread">${c.no_leido}</div>`:''} ${c.negociacion_activa?`<div class="ci-neg">🤝 Negociando</div>`:''}</div>`;
    div.onclick=()=>abrirChat(c,null,false);
    cont.appendChild(div);
  });
}

window.filtrarChats=q=>{const ql=q.toLowerCase();renderChats(todosChats.filter(c=>(c.proveedor_nombre||'').toLowerCase().includes(ql)||(c.producto_nombre||'').toLowerCase().includes(ql)||(c.ultimo_mensaje||'').toLowerCase().includes(ql)));};

async function crearChat(provId,prodId){
  const{data:prov}=await sb.from('usuarios').select('nombre,empresa').eq('id',provId).single();
  const{data:prod}=prodId?await sb.from('productos').select('*').eq('id',prodId).single():{data:null};
  const{data:chat}=await sb.from('chats').insert({emprendedor_id:userId,emprendedor_nombre:userData.nombre||'Emprendedor',proveedor_id:provId,proveedor_nombre:prov?.empresa||prov?.nombre||'Proveedor',producto_id:prodId||null,producto_nombre:prod?.nombre||null,ultimo_mensaje:'Chat iniciado',no_leido:0,updated_at:new Date().toISOString()}).select().single();
  if(chat){todosChats.unshift(chat);await abrirChat(chat,prod,true);}
}

async function abrirChat(chat,prodData=null,esNuevo=false){
  chatActivo=chat;
  msgs=[];
  // Mostrar vista chat
  document.getElementById('vista-lista').style.display='none';
  document.getElementById('vista-chat').style.display='block';
  document.getElementById('msgs-wrap').innerHTML='<div style="text-align:center;padding:20px;color:#bbb;font-size:0.8rem;">Cargando mensajes...</div>';

  const nombre=chat.proveedor_nombre||'Proveedor';
  document.getElementById('ch-av').textContent=nombre[0].toUpperCase();
  document.getElementById('ch-av').style.background=bgCol(nombre);
  document.getElementById('ch-nombre').textContent=nombre;
  document.getElementById('ch-sub').textContent=chat.producto_nombre||'Conversación general';

  if(chat.producto_id){
    const prod=prodData||(await sb.from('productos').select('*').eq('id',chat.producto_id).single()).data;
    if(prod){
      prodActivo=prod;
      document.getElementById('prod-banner').style.display='flex';
      const img=prod.imagenes?.[0]||prod.imagen||'';
      if(img)document.getElementById('pb-img').innerHTML=`<img src="${img}" alt="">`;
      document.getElementById('pb-nombre').textContent=prod.nombre||'Producto';
      document.getElementById('pb-precio').textContent=`$${Number(prod.precio||0).toFixed(2)} / ${prod.unidad||'und'}`;
    }
  } else {
    prodActivo=null;
    document.getElementById('prod-banner').style.display='none';
  }

  await sb.from('chats').update({no_leido:0}).eq('id',chat.id);

  // CARGAR MENSAJES FRESCOS SIEMPRE
  await cargarMsgs();
  setTimeout(ajustarAlturas,100);

  if(esNuevo&&prodActivo){
    const ta=document.getElementById('msg-ta');
    ta.value=`Hola buenas, soy ${userData.nombre||'un emprendedor'}. ¿Me podría dar información acerca de "${prodActivo.nombre}"? Me interesa saber precio, disponibilidad y condiciones de envío.`;
    resizeTA(ta);ta.focus();
  }
  suscribir();
}

// CARGA SIEMPRE DESDE SUPABASE
async function cargarMsgs(){
  try{
    const{data,error}=await sb.from('mensajes').select('*').eq('chat_id',chatActivo.id).order('created_at',{ascending:true});
    if(error)throw error;
    msgs=data||[];
    renderMsgs();
  }catch(e){
    console.error('Error mensajes:',e);
    document.getElementById('msgs-wrap').innerHTML='<div style="text-align:center;padding:20px;color:#bbb;font-size:0.8rem;">Error cargando mensajes</div>';
  }
}

function renderMsgs(){
  const wrap=document.getElementById('msgs-wrap');
  wrap.innerHTML='';
  if(!msgs.length){
    wrap.innerHTML='<div style="text-align:center;padding:40px 20px;color:#bbb;font-size:0.82rem;">¡Inicia la conversación! 👋</div>';
    return;
  }
  msgs.forEach(m=>wrap.appendChild(crearElMsg(m)));
  setTimeout(()=>wrap.scrollTop=wrap.scrollHeight,80);
}

function crearElMsg(m){
  const mio=m.autor_id===userId;
  const hora=new Date(m.created_at).toLocaleTimeString('es-EC',{hour:'2-digit',minute:'2-digit'});
  if(m.tipo==='negociacion')return crearElNeg(m,mio,hora);
  if(m.tipo==='carrito')return crearElCarrito(m,mio,hora);
  const d=document.createElement('div');d.className=`msg ${mio?'mio':'suyo'}`;
  const b=document.createElement('div');b.className='msg-b';b.textContent=m.texto||'';
  if(mio){
    let pt;
    b.addEventListener('touchstart',e=>{pt=setTimeout(()=>abrirMenu(m.id,e.touches[0].clientX,e.touches[0].clientY),600);},{passive:true});
    b.addEventListener('touchend',()=>clearTimeout(pt),{passive:true});
    b.addEventListener('touchmove',()=>clearTimeout(pt),{passive:true});
    b.addEventListener('contextmenu',e=>{e.preventDefault();abrirMenu(m.id,e.clientX,e.clientY);});
  }
  const h=document.createElement('div');h.className='msg-hora';h.textContent=hora+(mio?' ✓✓':'');
  d.appendChild(b);d.appendChild(h);return d;
}

function abrirMenu(id,x,y){
  msgMenuId=id;
  const m=document.getElementById('msg-menu');
  m.style.left=Math.min(x,window.innerWidth-160)+'px';
  m.style.top=Math.min(y,window.innerHeight-80)+'px';
  m.classList.add('show');
  document.getElementById('overlay-menu').classList.add('show');
}
window.cerrarMenu=()=>{document.getElementById('msg-menu').classList.remove('show');document.getElementById('overlay-menu').classList.remove('show');msgMenuId=null;};
window.borrarMsg=async()=>{
  if(!msgMenuId)return;cerrarMenu();
  await sb.from('mensajes').delete().eq('id',msgMenuId);
  msgs=msgs.filter(m=>m.id!==msgMenuId);renderMsgs();showToast('Mensaje eliminado');
};

function crearElNeg(m,mio,hora){
  const dat=m.data||{};const est=dat.estado||'pendiente';
  const puedeResp=!mio&&est==='pendiente';
  let iH='';(dat.items||[]).forEach(it=>{iH+=`<div class="mn-item-row"><span class="mn-nom">${it.nombre} ×${it.cantidad||1}</span><span class="mn-orig">$${Number(it.precioOriginal||0).toFixed(2)}</span><span class="mn-new">$${Number(it.precioOfertado||0).toFixed(2)}</span></div>`;});
  const w=document.createElement('div');w.className='msg-especial';
  const c=document.createElement('div');c.className='msg-neg-card';
  c.innerHTML=`<div class="mn-head">🤝 ${mio?'Propuesta enviada':'Propuesta del proveedor'}</div>${iH?`<div style="margin-bottom:8px;">${iH}</div>`:''}<div class="mn-totales"><span class="mn-tot-orig">$${Number(dat.totalOriginal||0).toFixed(2)}</span><span style="color:#bbb;margin:0 4px;">→</span><span class="mn-tot-new">$${Number(dat.totalOfertado||0).toFixed(2)}</span></div>${dat.mensaje?`<div class="mn-nota-txt">"${escH(dat.mensaje)}"</div>`:''}${puedeResp?`<div class="mn-bts"><button class="mn-bt ok" onclick="respNeg('${m.id}','aceptado')">✓ Aceptar</button><button class="mn-bt cnt" onclick="abrirNeg()">↔ Contraofertar</button><button class="mn-bt no" onclick="respNeg('${m.id}','rechazado')">✕ Rechazar</button></div>`:`<div class="mn-status ${est}">${est==='aceptado'?'✅ Aceptado — carrito actualizado':est==='rechazado'?'❌ Rechazada':'⏳ Esperando respuesta...'}</div>`}<div class="mn-hora-small">${hora}</div>`;
  w.appendChild(c);return w;
}

function crearElCarrito(m,mio,hora){
  const dat=m.data||{};let iH='';
  (dat.items||[]).forEach(it=>{iH+=`<div class="mc-row"><div class="mc-img">${it.imagen?`<img src="${it.imagen}" alt="">`:it.emoji||'📦'}</div><div class="mc-det"><div class="mc-nombre">${it.nombre}</div><div class="mc-cant">×${it.cantidad||1}</div></div><div class="mc-precio">$${Number(it.precio||0).toFixed(2)}</div></div>`;});
  const w=document.createElement('div');w.className='msg-especial';
  const c=document.createElement('div');c.className='msg-carrito-card';
  c.innerHTML=`<div class="mc-head">📦 Carrito compartido</div>${iH}<div class="mc-total-row"><span class="mc-total-lbl">Total</span><span class="mc-total-val">$${Number(dat.total||0).toFixed(2)}</span></div>${mio?`<button class="mc-btn-pedido" onclick="pedidoDesdeChat(${JSON.stringify(dat).replace(/"/g,'&quot;')})">🛒 Hacer pedido ahora</button>`:''}<div style="font-size:0.58rem;color:#bbb;text-align:right;margin-top:4px;">${hora}</div>`;
  w.appendChild(c);return w;
}

window.enviarMsg=async function(){
  const ta=document.getElementById('msg-ta');
  const txt=ta.value.trim();
  if(!txt||!chatActivo)return;
  ta.value='';resizeTA(ta);
  // Optimista
  const tmp={id:'tmp_'+Date.now(),chat_id:chatActivo.id,autor_id:userId,autor_nombre:userData.nombre||'Emprendedor',texto:txt,tipo:'texto',created_at:new Date().toISOString()};
  msgs.push(tmp);renderMsgs();
  const{data:nm}=await sb.from('mensajes').insert({chat_id:chatActivo.id,autor_id:userId,autor_nombre:userData.nombre||'Emprendedor',texto:txt,tipo:'texto',created_at:new Date().toISOString()}).select().single();
  if(nm){const i=msgs.findIndex(m=>m.id===tmp.id);if(i>=0)msgs[i]=nm;renderMsgs();}
  await sb.from('chats').update({ultimo_mensaje:txt.slice(0,60),updated_at:new Date().toISOString()}).eq('id',chatActivo.id);
};

window.keyMsg=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();enviarMsg();}};
window.resizeTA=function(el){el.style.height='auto';el.style.height=Math.min(el.scrollHeight,120)+'px';setTimeout(ajustarAlturas,50);};

window.abrirNeg=function(){
  const f=carrito.filter(i=>!chatActivo?.proveedor_id||!i.proveedor_id||i.proveedor_id===chatActivo.proveedor_id);
  const u=f.length?f:(prodActivo?[{id:prodActivo.id,nombre:prodActivo.nombre,precio:prodActivo.precio,imagen:prodActivo.imagenes?.[0]||'',cantidad:1,proveedor_id:chatActivo?.proveedor_id}]:[]);
  if(!u.length){showToast('Agrega productos al carrito primero');return;}
  itemsNeg={};u.forEach(i=>{itemsNeg[i.id]={nombre:i.nombre,precio:Number(i.precio||0),oferta:Number(i.precio||0),cantidad:i.cantidad||1,imagen:i.imagen||''};});
  renderNegItems();calcResumen();document.getElementById('neg-nota').value='';
  document.getElementById('modal-neg').classList.add('show');
};
function renderNegItems(){
  const w=document.getElementById('neg-items-wrap');w.innerHTML='';
  Object.entries(itemsNeg).forEach(([id,it])=>{const d=document.createElement('div');d.className='neg-item-card';d.innerHTML=`<div class="nic-top"><div class="nic-img">${it.imagen?`<img src="${it.imagen}" alt="">`:it.emoji||'📦'}</div><div class="nic-info"><div class="nic-nombre">${it.nombre}</div><div class="nic-cant">Cantidad: ${it.cantidad}</div></div></div><div class="nic-precios"><span class="nic-orig">$${it.precio.toFixed(2)}</span><input class="nic-input" type="number" value="${it.oferta}" min="0" step="0.01" oninput="updOf('${id}',this.value)"><span class="nic-unit">c/u</span></div>`;w.appendChild(d);});
}
window.updOf=(id,v)=>{if(itemsNeg[id])itemsNeg[id].oferta=parseFloat(v)||0;calcResumen();};
function calcResumen(){let o=0,f=0;Object.values(itemsNeg).forEach(p=>{o+=p.precio*p.cantidad;f+=p.oferta*p.cantidad;});document.getElementById('nr-orig').textContent='$'+o.toFixed(2);document.getElementById('nr-oferta').textContent='$'+f.toFixed(2);const a=o-f;const e=document.getElementById('nr-ahorro');e.textContent='$'+Math.abs(a).toFixed(2);e.style.color=a>0?'#3a7a00':'#aaa';}

window.enviarNeg=async function(){
  if(!chatActivo)return;
  const items=Object.entries(itemsNeg).map(([id,p])=>({id,nombre:p.nombre,cantidad:p.cantidad,imagen:p.imagen,precioOriginal:p.precio,precioOfertado:p.oferta}));
  const tO=items.reduce((s,i)=>s+i.precioOriginal*i.cantidad,0);
  const tN=items.reduce((s,i)=>s+i.precioOfertado*i.cantidad,0);
  const nota=document.getElementById('neg-nota').value.trim();
  const{data:nm}=await sb.from('mensajes').insert({chat_id:chatActivo.id,autor_id:userId,autor_nombre:userData.nombre||'Emprendedor',texto:`🤝 Propuesta $${tN.toFixed(2)}`,tipo:'negociacion',data:{items,totalOriginal:tO,totalOfertado:tN,mensaje:nota,estado:'pendiente'},created_at:new Date().toISOString()}).select().single();
  if(nm){msgs.push(nm);renderMsgs();}
  await sb.from('chats').update({ultimo_mensaje:`🤝 Propuesta $${tN.toFixed(2)}`,negociacion_activa:true,updated_at:new Date().toISOString()}).eq('id',chatActivo.id);
  document.getElementById('modal-neg').classList.remove('show');showToast('✓ Propuesta enviada');
};

window.respNeg=async function(msgId,estado){
  const m=msgs.find(x=>x.id===msgId);if(!m)return;
  const dat={...m.data,estado};
  await sb.from('mensajes').update({data:dat}).eq('id',msgId);
  if(estado==='aceptado'&&m.data?.items){
    const c=JSON.parse(localStorage.getItem('carrito_proveed')||'[]');
    m.data.items.forEach(it=>{const i=c.findIndex(x=>x.id===it.id);if(i>=0)c[i].precio=it.precioOfertado;else c.push({id:it.id,nombre:it.nombre,precio:it.precioOfertado,imagen:it.imagen,cantidad:it.cantidad,proveedor_id:chatActivo.proveedor_id});});
    localStorage.setItem('carrito_proveed',JSON.stringify(c));carrito=c;syncBadge();
    await sb.from('mensajes').insert({chat_id:chatActivo.id,autor_id:userId,autor_nombre:userData.nombre||'Emprendedor',texto:`✅ Acepté el precio de $${Number(m.data.totalOfertado||0).toFixed(2)}. Carrito actualizado.`,tipo:'texto',created_at:new Date().toISOString()});
    await sb.from('chats').update({negociacion_activa:false,ultimo_mensaje:'✅ Precio acordado',updated_at:new Date().toISOString()}).eq('id',chatActivo.id);
    showToast('✅ Precio aceptado');
  }else{
    await sb.from('mensajes').insert({chat_id:chatActivo.id,autor_id:userId,autor_nombre:userData.nombre||'Emprendedor',texto:'❌ Rechacé la propuesta.',tipo:'texto',created_at:new Date().toISOString()});
    await sb.from('chats').update({negociacion_activa:false,updated_at:new Date().toISOString()}).eq('id',chatActivo.id);
    showToast('Propuesta rechazada');
  }
  const i=msgs.findIndex(x=>x.id===msgId);if(i>=0)msgs[i].data=dat;
  await cargarMsgs();
};

window.compartirCarrito=async function(){
  const items=carrito.filter(i=>!chatActivo?.proveedor_id||!i.proveedor_id||i.proveedor_id===chatActivo.proveedor_id);
  if(!items.length){showToast('Carrito vacío');return;}
  const total=items.reduce((s,i)=>s+(i.precio||0)*(i.cantidad||1),0);
  const{data:nm}=await sb.from('mensajes').insert({chat_id:chatActivo.id,autor_id:userId,autor_nombre:userData.nombre||'Emprendedor',texto:`📦 Carrito $${total.toFixed(2)}`,tipo:'carrito',data:{items,total},created_at:new Date().toISOString()}).select().single();
  if(nm){msgs.push(nm);renderMsgs();}
  await sb.from('chats').update({ultimo_mensaje:`📦 Carrito $${total.toFixed(2)}`,updated_at:new Date().toISOString()}).eq('id',chatActivo.id);
  showToast('✓ Carrito compartido');
};
window.soloCarrito=()=>{document.getElementById('modal-neg').classList.remove('show');compartirCarrito();};

window.pedidoDesdeChat=async function(dat){
  if(!chatActivo||!dat?.items?.length)return;
  const total=dat.items.reduce((s,i)=>s+(i.precio||0)*(i.cantidad||1),0);
  await sb.from('pedidos').insert({emprendedor_id:userId,emprendedor_nombre:userData.nombre||'',proveedor_id:chatActivo.proveedor_id,nombre_proveedor:chatActivo.proveedor_nombre||'',items:dat.items,total,estado:'pendiente',origen:'chat',metodo_pago:'a_coordinar',facturacion:userData.facturacion||{}});
  const rest=carrito.filter(c=>!dat.items.find(i=>i.id===c.id));localStorage.setItem('carrito_proveed',JSON.stringify(rest));carrito=rest;syncBadge();
  await sb.from('mensajes').insert({chat_id:chatActivo.id,autor_id:userId,autor_nombre:userData.nombre||'Emprendedor',texto:`🛒 ¡Pedido realizado! Total: $${total.toFixed(2)}`,tipo:'texto',created_at:new Date().toISOString()});
  await cargarMsgs();showToast('✅ ¡Pedido realizado!');
};

window.abrirCatalogo=async function(){
  if(!chatActivo?.proveedor_id){showToast('Abre un chat primero');return;}
  document.getElementById('modal-cat').classList.add('show');
  document.getElementById('prods-cat-grid').innerHTML='<div style="grid-column:1/-1;text-align:center;padding:20px;color:#bbb;font-size:0.8rem;">Cargando...</div>';
  const{data}=await sb.from('productos').select('*').eq('proveedor_id',chatActivo.proveedor_id).eq('activo',true).order('created_at',{ascending:false});
  catalogoAll=data||[];renderCat(catalogoAll);
};
function renderCat(l){
  const w=document.getElementById('prods-cat-grid');
  if(!l.length){w.innerHTML='<div style="grid-column:1/-1;text-align:center;padding:20px;color:#bbb;font-size:0.8rem;">Sin productos</div>';return;}
  w.innerHTML='';
  const cc=c=>{const m={'Ropa':'#FF8C00','Tecnolog':'#007AFF','Alimento':'#22C55E','Belleza':'#FF69B4','Deporte':'#A855F7','Hogar':'#F59E0B'};for(const k in m){if((c||'').includes(k))return m[k];}return '#888';};
  const ec=c=>{const m={'Ropa':'👗','Tecnolog':'📱','Alimento':'🛒','Belleza':'💄','Deporte':'⚽','Hogar':'🏠'};for(const k in m){if((c||'').includes(k))return m[k];}return '📦';};
  l.forEach(p=>{
    const img=p.imagenes?.[0]||p.imagen||'';const col=cc(p.categoria||'');
    const card=document.createElement('div');card.className='pcc';
    card.innerHTML=`<div class="pcc-img" style="background:${col}15;">${img?`<img src="${img}" alt="" loading="lazy">`:`<span>${ec(p.categoria||'')}</span>`}<div class="pcc-badge" style="background:${col};">${(p.categoria||'').slice(0,8).toUpperCase()}</div></div><div class="pcc-body"><div class="pcc-nombre">${p.nombre||'Producto'}</div><div class="pcc-precio">$${Number(p.precio||0).toFixed(2)}</div><div class="pcc-min">Mín: ${p.minimo||1} ${p.unidad||'und'}</div><button class="pcc-add-btn" onclick="addCat('${p.id}','${(p.nombre||'').replace(/'/g,'')}',${p.precio||0},'${img}','${chatActivo?.proveedor_id||''}')">+ Agregar</button></div>`;
    w.appendChild(card);
  });
}
window.filtrarCat=q=>{const ql=q.toLowerCase();renderCat(catalogoAll.filter(p=>(p.nombre||'').toLowerCase().includes(ql)||(p.categoria||'').toLowerCase().includes(ql)));};
window.addCat=(id,nombre,precio,imagen,provId)=>{const i=carrito.findIndex(c=>c.id===id);if(i>=0)carrito[i].cantidad=(carrito[i].cantidad||1)+1;else carrito.push({id,nombre,precio,imagen,cantidad:1,proveedor_id:provId});localStorage.setItem('carrito_proveed',JSON.stringify(carrito));syncBadge();showToast(`✓ ${nombre.slice(0,20)} agregado`);};

// REALTIME — suscripción correcta
function suscribir(){
  if(rtSub)sb.removeChannel(rtSub);
  rtSub=sb.channel('cemp-'+chatActivo.id+'-'+Date.now())
    .on('postgres_changes',{event:'INSERT',schema:'public',table:'mensajes',filter:`chat_id=eq.${chatActivo.id}`},pld=>{
      const n=pld.new;
      if(n.autor_id===userId){
        // Reemplazar temporal si existe
        const i=msgs.findIndex(m=>m.id&&m.id.startsWith('tmp_')&&m.texto===n.texto&&m.autor_id===n.autor_id);
        if(i>=0)msgs[i]=n;else if(!msgs.find(m=>m.id===n.id))msgs.push(n);
      } else {
        if(!msgs.find(m=>m.id===n.id))msgs.push(n);
      }
      renderMsgs();
    })
    .on('postgres_changes',{event:'DELETE',schema:'public',table:'mensajes',filter:`chat_id=eq.${chatActivo.id}`},pld=>{
      msgs=msgs.filter(m=>m.id!==pld.old.id);renderMsgs();
    })
    .subscribe(s=>console.log('RT emp:',s));
}

function volverLista(){
  if(rtSub)sb.removeChannel(rtSub);
  chatActivo=null;prodActivo=null;msgs=[];
  document.getElementById('vista-chat').style.display='none';
  document.getElementById('vista-lista').style.display='block';
  cargarChats();
}

function bgCol(n){const c=['#FF8C00','#007AFF','#A8E63D','#A855F7','#FF4D4D','#F59E0B'];return c[Math.abs((n||'').charCodeAt(0)||0)%c.length];}
window.cerrarMod=(id,e)=>{if(e.target===document.getElementById(id))document.getElementById(id).classList.remove('show');};
function escH(t){return(t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function showToast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500);}
</script>
