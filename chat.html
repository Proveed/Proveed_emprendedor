<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>PROVEED Chat</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
:root{--G:#A8E63D;--G2:#7BC234;--F:#F5F6F2;--O:#FF8C00;--R:#FF4D4D;}
html,body{height:100%;overflow:hidden;}
body{font-family:'Inter',sans-serif;background:var(--F);}
#pLista{height:100%;display:flex;flex-direction:column;}
#pChat{height:100%;display:none;flex-direction:column;}
.hLista{background:#fff;padding:48px 16px 12px;border-bottom:2.5px solid var(--G);flex-shrink:0;}
.hTop{display:flex;align-items:center;gap:8px;margin-bottom:10px;}
.hTit{font-size:1rem;font-weight:900;color:#111;}
.hTit b{color:var(--G2);}
.sBus{display:flex;align-items:center;gap:8px;background:var(--F);border-radius:24px;padding:10px 14px;border:1.5px solid #eee;}
.sBus svg{width:14px;height:14px;stroke:#ccc;fill:none;stroke-width:2.5;flex-shrink:0;}
.sBus input{flex:1;background:transparent;border:none;outline:none;font-family:'Inter',sans-serif;font-size:0.86rem;color:#111;}
.sBus input::placeholder{color:#ccc;}
.listaScroll{flex:1;overflow-y:auto;padding-bottom:80px;}
.chatItem{display:flex;align-items:center;gap:12px;padding:14px 16px;background:#fff;border-bottom:1px solid #f5f5f5;cursor:pointer;}
.chatItem:active{background:var(--F);}
.chatItem.new{border-left:3px solid var(--G);}
.ciAv{width:46px;height:46px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:1.1rem;font-weight:800;color:#fff;flex-shrink:0;position:relative;overflow:hidden;}
.ciDot{position:absolute;bottom:1px;right:1px;width:9px;height:9px;background:var(--G);border-radius:50%;border:2px solid #fff;}
.ciInf{flex:1;min-width:0;}
.ciNom{font-size:0.88rem;font-weight:700;color:#111;margin-bottom:2px;}
.ciMsg{font-size:0.74rem;color:#aaa;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ciR{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex-shrink:0;}
.ciHora{font-size:0.6rem;color:#bbb;}
.ciUnread{width:18px;height:18px;background:var(--G2);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:0.58rem;font-weight:800;color:#111;}
.vacio{text-align:center;padding:60px 20px;color:#bbb;font-size:0.82rem;line-height:1.7;}
.cHead{background:#fff;padding:44px 12px 12px;border-bottom:2.5px solid var(--G);display:flex;align-items:center;gap:10px;flex-shrink:0;}
.cBack{width:36px;height:36px;background:rgba(168,230,61,.12);border-radius:11px;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.cBack svg{width:18px;height:18px;stroke:var(--G2);fill:none;stroke-width:2.5;}
.cAv{width:40px;height:40px;border-radius:12px;font-size:0.9rem;font-weight:800;color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0;overflow:hidden;}
.cInf{flex:1;min-width:0;}
.cNom{font-size:0.9rem;font-weight:800;color:#111;}
.cSub{font-size:0.68rem;color:var(--G2);font-weight:600;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.cBts{display:flex;gap:6px;}
.cBt{width:32px;height:32px;border-radius:10px;background:rgba(168,230,61,.12);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.cBt svg{width:15px;height:15px;stroke:var(--G2);fill:none;stroke-width:2;}
.banProd{background:#fff;border-bottom:2px solid rgba(168,230,61,0.3);padding:10px 14px;display:flex;align-items:center;gap:10px;flex-shrink:0;}
.bpImg{width:44px;height:44px;border-radius:10px;background:var(--F);flex-shrink:0;overflow:hidden;}
.bpImg img{width:100%;height:100%;object-fit:cover;}
.bpInf{flex:1;min-width:0;}
.bpNom{font-size:0.82rem;font-weight:700;color:#111;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.bpPre{font-size:0.74rem;color:var(--O);font-weight:800;margin-top:1px;}
.msgsArea{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:10px 14px;background:var(--F);display:flex;flex-direction:column;gap:5px;}
.inputArea{background:#fff;border-top:1px solid #eee;padding:8px 12px;padding-bottom:max(10px,env(safe-area-inset-bottom));flex-shrink:0;}
/* Sin botones de negociación para el emprendedor — solo escribe */
.iRow{display:flex;align-items:flex-end;gap:8px;}
.iBox{flex:1;background:var(--F);border-radius:22px;padding:10px 14px;border:1.5px solid #eee;display:flex;align-items:flex-end;}
textarea#ta{flex:1;background:transparent;border:none;outline:none;font-family:'Inter',sans-serif;font-size:0.9rem;color:#111 !important;-webkit-text-fill-color:#111 !important;resize:none;line-height:1.4;min-height:22px;max-height:120px;width:100%;display:block;caret-color:#111;}
textarea#ta::placeholder{color:#bbb;}
.sBtn{width:42px;height:42px;background:var(--G);border-radius:50%;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.sBtn svg{width:17px;height:17px;stroke:#111;fill:none;stroke-width:2.5;}
.msg{display:flex;flex-direction:column;}
.msg.yo{align-items:flex-end;}
.msg.el{align-items:flex-start;}
.bub{padding:10px 14px;border-radius:18px;font-size:0.88rem;line-height:1.5;max-width:80%;word-break:break-word;-webkit-user-select:none;user-select:none;}
.msg.yo .bub{background:var(--G);color:#111;border-bottom-right-radius:4px;font-weight:500;}
.msg.el .bub{background:#fff;color:#111;border-bottom-left-radius:4px;box-shadow:0 1px 4px rgba(0,0,0,.08);}
.mHora{font-size:0.6rem;color:#bbb;margin-top:3px;padding:0 4px;}
.mMenu{position:fixed;background:#fff;border-radius:12px;box-shadow:0 6px 24px rgba(0,0,0,.18);padding:4px;z-index:700;border:1px solid #eee;display:none;}
.mMenu.on{display:block;}
.mMenu button{display:flex;align-items:center;gap:8px;width:100%;padding:10px 16px;background:transparent;border:none;font-family:'Inter',sans-serif;font-size:0.84rem;font-weight:600;color:var(--R);cursor:pointer;border-radius:8px;white-space:nowrap;}
.mMenu button svg{width:14px;height:14px;stroke:var(--R);fill:none;stroke-width:2.2;}
.mOv{position:fixed;inset:0;z-index:699;display:none;}
.mOv.on{display:block;}
.esp{display:flex;justify-content:center;width:100%;padding:4px 0;}

/* CARD DE OFERTA DEL PROVEEDOR */
.ofertaC{background:#fff;border:2px solid var(--G);border-radius:20px;padding:16px;width:94%;max-width:340px;box-shadow:0 4px 16px rgba(168,230,61,.12);}
.ofertaH{font-size:0.62rem;font-weight:800;color:var(--G2);text-transform:uppercase;letter-spacing:.5px;margin-bottom:12px;display:flex;align-items:center;gap:6px;}
.ofertaH svg{width:14px;height:14px;stroke:var(--G2);fill:none;stroke-width:2.5;}
.ofertaItem{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #f5f5f5;}
.ofertaItem:last-of-type{border:none;}
.ofertaImg{width:36px;height:36px;border-radius:9px;background:var(--F);overflow:hidden;flex-shrink:0;}
.ofertaImg img{width:100%;height:100%;object-fit:cover;}
.ofertaNom{flex:1;font-size:0.78rem;font-weight:600;color:#111;}
.ofertaCant{font-size:0.64rem;color:#aaa;}
.ofertaPrecios{text-align:right;}
.ofertaOrig{font-size:0.68rem;color:#bbb;text-decoration:line-through;}
.ofertaNuevo{font-size:0.92rem;font-weight:900;color:var(--G2);}
.ofertaTot{display:flex;justify-content:space-between;align-items:center;margin:10px 0;padding:10px;background:rgba(168,230,61,.07);border-radius:12px;}
.ofertaTotL{font-size:0.8rem;font-weight:700;color:#111;}
.ofertaTotV{font-size:1.1rem;font-weight:900;color:var(--G2);}
.ofertaAhorro{font-size:0.68rem;color:var(--G2);font-weight:600;margin-bottom:10px;text-align:center;}
.ofertaNota{font-size:0.76rem;color:#666;font-style:italic;padding:8px 10px;background:var(--F);border-radius:10px;margin-bottom:12px;line-height:1.5;}
/* BOTONES ACEPTAR / RECHAZAR — grandes y claros */
.ofertaBts{display:flex;gap:8px;}
.ofBt{flex:1;padding:12px 8px;border:none;border-radius:14px;font-family:'Inter',sans-serif;font-size:0.82rem;font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;}
.ofBt svg{width:15px;height:15px;fill:none;stroke-width:2.5;}
.ofBt.aceptar{background:var(--G);color:#111;}
.ofBt.aceptar svg{stroke:#111;}
.ofBt.rechazar{background:rgba(255,77,77,.08);color:var(--R);}
.ofBt.rechazar svg{stroke:var(--R);}
.ofertaSt{text-align:center;font-size:0.74rem;font-weight:700;padding:8px;border-radius:12px;margin-top:4px;}
.ofertaSt.aceptado{background:rgba(168,230,61,.12);color:var(--G2);}
.ofertaSt.rechazado{background:rgba(255,77,77,.06);color:var(--R);}
.ofertaSt.pendiente{background:rgba(255,140,0,.08);color:var(--O);}
.ofertaHr{font-size:0.58rem;color:#bbb;text-align:right;margin-top:8px;}

/* CARD CARRITO COMPARTIDO */
.cartC{background:#fff;border:1.5px solid #eee;border-radius:18px;padding:12px 14px;width:92%;max-width:340px;box-shadow:0 1px 6px rgba(0,0,0,.05);}
.cartH{font-size:0.63rem;font-weight:800;color:#aaa;text-transform:uppercase;margin-bottom:8px;}
.cartRow{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid #f5f5f5;}
.cartRow:last-of-type{border:none;}
.cartImg{width:28px;height:28px;border-radius:7px;background:var(--F);overflow:hidden;flex-shrink:0;}
.cartImg img{width:100%;height:100%;object-fit:cover;}
.cartNom{flex:1;font-size:.76rem;font-weight:600;color:#111;}
.cartCant{font-size:.62rem;color:#aaa;}
.cartPre{font-size:.78rem;font-weight:800;color:var(--O);}
.cartTot{display:flex;justify-content:space-between;margin-top:8px;padding-top:6px;border-top:1px solid #eee;}

.tabBar{background:#fff;border-top:1px solid #eee;display:flex;padding:8px 0;padding-bottom:max(8px,env(safe-area-inset-bottom));flex-shrink:0;}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;text-decoration:none;padding:4px 0;}
.tab svg{width:22px;height:22px;stroke:#ccc;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.tab span{font-size:.55rem;font-weight:700;color:#ccc;text-transform:uppercase;}
.tab.on svg{stroke:var(--G2);}
.tab.on span{color:var(--G2);}
.tabRel{position:relative;}
.tabBadge{position:absolute;top:-2px;right:6px;background:var(--R);color:#fff;font-size:.5rem;font-weight:800;width:14px;height:14px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:1.5px solid #fff;}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%) translateY(20px);background:#111;color:#fff;padding:10px 20px;border-radius:24px;font-size:.8rem;font-weight:600;opacity:0;transition:.3s;pointer-events:none;z-index:2000;white-space:nowrap;}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>

<!-- LISTA -->
<div id="pLista">
  <div class="hLista">
    <div class="hTop">
      <svg width="24" height="24" viewBox="0 0 28 28" fill="none"><polygon points="14,1.5 25,7.5 25,20.5 14,26.5 3,20.5 3,7.5" fill="#A8E63D"/><polyline points="8,14 12,18 20,10" stroke="#111" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span class="hTit">PRO<b>VEED</b> · Chats</span>
    </div>
    <div class="sBus">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      <input type="text" placeholder="Buscar conversación..." oninput="filtrar(this.value)">
    </div>
  </div>
  <div class="listaScroll" id="lista"><div class="vacio">Cargando...</div></div>
  <nav class="tabBar">
    <a class="tab" href="dashboard.html"><svg viewBox="0 0 24 24"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg><span>Inicio</span></a>
    <a class="tab" href="explorar.html"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg><span>Explorar</span></a>
    <a class="tab on"><svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg><span>Chat</span></a>
    <a class="tab tabRel" href="carrito.html"><svg viewBox="0 0 24 24"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg><span>Carrito</span><div class="tabBadge" id="cBadge" style="display:none">0</div></a>
    <a class="tab" href="perfil-emprendedor.html"><svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg><span>Perfil</span></a>
  </nav>
</div>

<!-- CHAT -->
<div id="pChat">
  <div class="cHead">
    <button class="cBack" onclick="volver()"><svg viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg></button>
    <div class="cAv" id="cAv">P</div>
    <div class="cInf"><div class="cNom" id="cNom">—</div><div class="cSub" id="cSub">—</div></div>
    <div class="cBts">
      <button class="cBt" onclick="location.href='dashboard.html'"><svg viewBox="0 0 24 24"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg></button>
    </div>
  </div>

  <!-- BANNER PRODUCTO -->
  <div class="banProd" id="banProd" style="display:none;">
    <div class="bpImg" id="bpImg"></div>
    <div class="bpInf"><div class="bpNom" id="bpNom">—</div><div class="bpPre" id="bpPre">—</div></div>
  </div>

  <div class="msgsArea" id="msgs"></div>

  <!-- INPUT — solo escribir, sin botones de negociación -->
  <div class="inputArea">
    <div class="iRow">
      <div class="iBox">
        <textarea id="ta" placeholder="Escribe un mensaje al proveedor..." rows="1"
          onkeydown="tecla(event)" oninput="crecer(this)"></textarea>
      </div>
      <button class="sBtn" onclick="enviar()">
        <svg viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
      </button>
    </div>
  </div>

  <nav class="tabBar">
    <a class="tab" href="dashboard.html"><svg viewBox="0 0 24 24"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg><span>Inicio</span></a>
    <a class="tab" href="explorar.html"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg><span>Explorar</span></a>
    <a class="tab on"><svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg><span>Chat</span></a>
    <a class="tab tabRel" href="carrito.html"><svg viewBox="0 0 24 24"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg><span>Carrito</span><div class="tabBadge" id="cBadge2" style="display:none">0</div></a>
    <a class="tab" href="perfil-emprendedor.html"><svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg><span>Perfil</span></a>
  </nav>
</div>

<div class="mOv" id="mOv" onclick="cerrarMenu()"></div>
<div class="mMenu" id="mMenu"><button onclick="borrar()"><svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>Eliminar mensaje</button></div>

<div class="toast" id="tst"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const {createClient}=supabase;
const db=createClient('https://hfmsyrmkewscnvwynzfq.supabase.co','sb_publishable_d1oLsq70a6ZV33vW3XkRgw_nYcN2Z9v');
const Q=id=>document.getElementById(id);

let uid='',me={},chatAct=null,todos=[],msgsArr=[],canal=null,menuId=null,prodActual=null;
const QS=new URLSearchParams(location.search);
let carrito=JSON.parse(localStorage.getItem('carrito_proveed')||'[]');

function badge(){
  const n=carrito.reduce((s,i)=>s+(i.cantidad||1),0);
  ['cBadge','cBadge2'].forEach(id=>{const b=Q(id);if(b){if(n>0){b.style.display='flex';b.textContent=n>9?'9+':n;}else b.style.display='none';}});
}
badge();

function mostrarBannerProd(){
  if(!prodActual)return;
  Q('banProd').style.display='flex';
  Q('bpImg').innerHTML=prodActual.imagen?`<img src="${prodActual.imagen}" style="width:100%;height:100%;object-fit:cover;border-radius:8px;">`:'';
  Q('bpNom').textContent=prodActual.nombre||'Producto';
  Q('bpPre').textContent=prodActual.precio?`$${Number(prodActual.precio).toFixed(2)}`:'';
  Q('cSub').textContent=prodActual.nombre||'—';
}

(async()=>{
  const {data:{session}}=await db.auth.getSession();
  if(!session){location.href='login.html';return;}
  uid=session.user.id;
  const {data:u}=await db.from('usuarios').select('*').eq('id',uid).single();
  if(u)me=u;
  await cargarChats();

  const pId=QS.get('proveedor_id');
  const prodId=QS.get('prod_id');
  const prodNom=decodeURIComponent(QS.get('prod_nombre')||'');
  const prodPre=QS.get('prod_precio')||'';
  const prodImg=decodeURIComponent(QS.get('prod_img')||'');

  if(pId){
    let chat=todos.find(c=>c.proveedor_id===pId);
    if(!chat){
      const {data:prov}=await db.from('usuarios').select('nombre,empresa').eq('id',pId).single();
      const {data:ch}=await db.from('chats').insert({
        emprendedor_id:uid,emprendedor_nombre:me.nombre||'Emprendedor',
        proveedor_id:pId,proveedor_nombre:prov?.empresa||prov?.nombre||'Proveedor',
        ultimo_mensaje:'Chat iniciado',no_leido_emp:0,no_leido_prov:0
      }).select().single();
      chat=ch;if(chat)todos.unshift(chat);
    }
    if(chat){
      await abrirChat(chat);
      if(prodId&&prodNom){
        prodActual={id:prodId,nombre:prodNom,precio:prodPre,imagen:prodImg,proveedor_id:pId};
        mostrarBannerProd();
        // Mensaje inicial automático
        Q('ta').value=`Hola, me interesa el producto "${prodNom}" — precio $${Number(prodPre||0).toFixed(2)}. ¿Podría hacerme una oferta?`;
        crecer(Q('ta'));Q('ta').focus();
      }
    }
  }
})();

async function cargarChats(){
  const {data,error}=await db.from('chats').select('*').eq('emprendedor_id',uid);
  if(error){Q('lista').innerHTML=`<div class="vacio">Error: ${error.message}</div>`;return;}
  todos=(data||[]).sort((a,b)=>new Date(b.created_at||0)-new Date(a.created_at||0));
  pintarLista(todos);
}

function pintarLista(arr){
  const c=Q('lista');
  if(!arr.length){c.innerHTML='<div class="vacio">Sin conversaciones.<br>Entra a un producto y toca "Chat con proveedor".</div>';return;}
  c.innerHTML='';
  arr.forEach(ch=>{
    const nom=ch.proveedor_nombre||'Proveedor';
    const hora=ch.created_at?new Date(ch.created_at).toLocaleTimeString('es-EC',{hour:'2-digit',minute:'2-digit'}):'';
    const d=document.createElement('div');
    d.className='chatItem'+((ch.no_leido_emp||0)>0?' new':'');
    d.innerHTML=`<div class="ciAv" style="background:${pal(nom)};">${nom[0].toUpperCase()}<div class="ciDot"></div></div>
      <div class="ciInf"><div class="ciNom">${nom}</div><div class="ciMsg">${ch.ultimo_mensaje||'Nueva conversación'}</div></div>
      <div class="ciR"><div class="ciHora">${hora}</div>${(ch.no_leido_emp||0)>0?`<div class="ciUnread">${ch.no_leido_emp}</div>`:''}</div>`;
    d.onclick=()=>abrirChat(ch);
    c.appendChild(d);
  });
}

window.filtrar=q=>{const ql=q.toLowerCase();pintarLista(todos.filter(c=>(c.proveedor_nombre||'').toLowerCase().includes(ql)||(c.ultimo_mensaje||'').toLowerCase().includes(ql)));};

async function abrirChat(chat){
  chatAct=chat;msgsArr=[];prodActual=null;
  Q('banProd').style.display='none';
  Q('pLista').style.display='none';Q('pChat').style.display='flex';
  Q('msgs').innerHTML='<div style="text-align:center;padding:40px;color:#bbb;font-size:.82rem;">Cargando...</div>';
  const nom=chat.proveedor_nombre||'Proveedor';
  Q('cAv').textContent=nom[0].toUpperCase();Q('cAv').style.background=pal(nom);
  Q('cNom').textContent=nom;Q('cSub').textContent=nom;
  await db.from('chats').update({no_leido_emp:0}).eq('id',chat.id);
  await cargarMsgs();
  suscribir();
}

async function cargarMsgs(){
  const {data,error}=await db.from('mensajes').select('*').eq('chat_id',chatAct.id).order('created_at',{ascending:true});
  if(error){console.error(error);return;}
  msgsArr=data||[];

  // Detectar producto desde mensajes
  if(!prodActual){
    for(let i=msgsArr.length-1;i>=0;i--){
      const m=msgsArr[i];
      if(m.data?.producto_nombre){
        prodActual={id:m.data.producto_id,nombre:m.data.producto_nombre,precio:m.data.producto_precio,imagen:m.data.producto_imagen||''};
        mostrarBannerProd();break;
      }
    }
  }
  pintarMsgs();
}

function pintarMsgs(){
  const w=Q('msgs');
  if(!msgsArr.length){w.innerHTML='<div style="text-align:center;padding:50px 20px;color:#bbb;font-size:.84rem;">Escríbele al proveedor para comenzar 💬</div>';return;}
  w.innerHTML='';
  msgsArr.forEach(m=>w.appendChild(mkBurbuja(m)));
  setTimeout(()=>w.scrollTop=w.scrollHeight,60);
}

function mkBurbuja(m){
  const yo=m.autor_id===uid;
  const hr=new Date(m.created_at).toLocaleTimeString('es-EC',{hour:'2-digit',minute:'2-digit'});
  if(m.tipo==='negociacion')return mkOferta(m,yo,hr);
  if(m.tipo==='carrito')return mkCarrito(m,yo,hr);

  const d=document.createElement('div');d.className=`msg ${yo?'yo':'el'}`;
  const b=document.createElement('div');b.className='bub';b.textContent=m.texto||'';
  if(yo){
    let pt;
    b.addEventListener('touchstart',e=>{pt=setTimeout(()=>showMenu(m.id,e.touches[0].clientX,e.touches[0].clientY),600);},{passive:true});
    b.addEventListener('touchend',()=>clearTimeout(pt),{passive:true});
    b.addEventListener('touchmove',()=>clearTimeout(pt),{passive:true});
    b.addEventListener('contextmenu',e=>{e.preventDefault();showMenu(m.id,e.clientX,e.clientY);});
  }
  const h=document.createElement('div');h.className='mHora';h.textContent=hr+(yo?' ✓✓':'');
  d.appendChild(b);d.appendChild(h);return d;
}

function mkOferta(m,yo,hr){
  const dat=m.data||{},est=dat.estado||'pendiente';
  // Emprendedor SOLO puede aceptar o rechazar — solo si es oferta del proveedor (no yo)
  const puedeResp=!yo&&est==='pendiente';
  let items='';
  (dat.items||[]).forEach(it=>{
    items+=`<div class="ofertaItem">
      <div class="ofertaImg">${it.imagen?`<img src="${it.imagen}">`:'📦'}</div>
      <div style="flex:1;min-width:0;">
        <div class="ofertaNom">${it.nombre}</div>
        <div class="ofertaCant">Cantidad: ${it.cantidad||1}</div>
      </div>
      <div class="ofertaPrecios">
        <div class="ofertaOrig">$${Number(it.precioOriginal||0).toFixed(2)}</div>
        <div class="ofertaNuevo">$${Number(it.precioOfertado||0).toFixed(2)}</div>
      </div>
    </div>`;
  });
  const tO=Number(dat.totalOriginal||0),tN=Number(dat.totalOfertado||0),ahorro=tO-tN;

  const w=document.createElement('div');w.className='esp';
  const c=document.createElement('div');c.className='ofertaC';
  c.innerHTML=`
    <div class="ofertaH">
      <svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
      ${yo?'Oferta enviada por ti':'💰 Oferta del proveedor'}
    </div>
    ${items?`<div style="margin-bottom:4px;">${items}</div>`:''}
    <div class="ofertaTot">
      <span class="ofertaTotL">Total oferta</span>
      <span class="ofertaTotV">$${tN.toFixed(2)}</span>
    </div>
    ${ahorro>0?`<div class="ofertaAhorro">🎉 Ahorras $${ahorro.toFixed(2)} vs precio original</div>`:''}
    ${dat.mensaje?`<div class="ofertaNota">"${esc(dat.mensaje)}"</div>`:''}
    ${puedeResp
      ?`<div class="ofertaBts">
          <button class="ofBt aceptar" onclick="aceptarOferta('${m.id}')">
            <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
            Aceptar oferta
          </button>
          <button class="ofBt rechazar" onclick="rechazarOferta('${m.id}')">
            <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
            Rechazar
          </button>
        </div>`
      :`<div class="ofertaSt ${est}">${
          est==='aceptado'?'✅ Aceptaste esta oferta — carrito actualizado':
          est==='rechazado'?'❌ Rechazaste esta oferta':
          yo?'⏳ Esperando respuesta del emprendedor...':'⏳ Esperando tu respuesta...'
        }</div>`
    }
    <div class="ofertaHr">${hr}</div>`;
  w.appendChild(c);return w;
}

function mkCarrito(m,yo,hr){
  const dat=m.data||{};let rows='';
  (dat.items||[]).forEach(it=>{
    rows+=`<div class="cartRow">
      <div class="cartImg">${it.imagen?`<img src="${it.imagen}">`:'📦'}</div>
      <div style="flex:1;min-width:0;"><div class="cartNom">${it.nombre}</div><div class="cartCant">×${it.cantidad||1}</div></div>
      <div class="cartPre">$${Number(it.precio||0).toFixed(2)}</div>
    </div>`;
  });
  const w=document.createElement('div');w.className='esp';
  const c=document.createElement('div');c.className='cartC';
  c.innerHTML=`<div class="cartH">📦 ${yo?'Carrito enviado al proveedor':'Carrito del emprendedor'}</div>
    ${rows}
    <div class="cartTot"><span style="font-size:.72rem;color:#aaa;">Total</span><span style="font-size:.9rem;font-weight:900;color:var(--G2);">$${Number(dat.total||0).toFixed(2)}</span></div>
    <div style="font-size:.58rem;color:#bbb;text-align:right;margin-top:4px;">${hr}</div>`;
  w.appendChild(c);return w;
}

// ACEPTAR OFERTA — actualiza carrito y genera pedido
window.aceptarOferta=async function(msgId){
  const m=msgsArr.find(x=>x.id===msgId);if(!m)return;
  await db.from('mensajes').update({data:{...m.data,estado:'aceptado'}}).eq('id',msgId);

  // Agregar al carrito con precio acordado
  if(m.data?.items){
    m.data.items.forEach(it=>{
      const i=carrito.findIndex(x=>x.id===it.id);
      if(i>=0){carrito[i].precio=it.precioOfertado;carrito[i].cantidad=it.cantidad||1;}
      else carrito.push({id:it.id,nombre:it.nombre,precio:it.precioOfertado,imagen:it.imagen||'',cantidad:it.cantidad||1,proveedor_id:chatAct.proveedor_id});
    });
    localStorage.setItem('carrito_proveed',JSON.stringify(carrito));badge();
  }

  // Crear pedido automáticamente
  const items=(m.data?.items||[]).map(it=>({id:it.id,nombre:it.nombre,precio:it.precioOfertado,imagen:it.imagen||'',cantidad:it.cantidad||1}));
  const total=items.reduce((s,i)=>s+i.precio*i.cantidad,0);
  await db.from('pedidos').insert({
    emprendedor_id:uid,emprendedor_nombre:me.nombre||'',
    proveedor_id:chatAct.proveedor_id,nombre_proveedor:chatAct.proveedor_nombre||'',
    items,total,estado:'confirmado',origen:'chat_oferta',metodo_pago:'a_coordinar'
  });

  // Mensaje confirmación
  await db.from('mensajes').insert({
    chat_id:chatAct.id,autor_id:uid,autor_nombre:me.nombre||'Emprendedor',
    texto:`✅ ¡Acepté la oferta! Precio total: $${total.toFixed(2)}. Pedido generado — coordinaremos el pago.`,
    tipo:'texto',created_at:new Date().toISOString()
  });
  await db.from('chats').update({ultimo_mensaje:'✅ Oferta aceptada — pedido generado',no_leido_prov:(chatAct.no_leido_prov||0)+1}).eq('id',chatAct.id);
  await cargarMsgs();
  toast('✅ Oferta aceptada — pedido creado. Ve a tu carrito para pagar.');
};

// RECHAZAR OFERTA
window.rechazarOferta=async function(msgId){
  const m=msgsArr.find(x=>x.id===msgId);if(!m)return;
  await db.from('mensajes').update({data:{...m.data,estado:'rechazado'}}).eq('id',msgId);
  await db.from('mensajes').insert({
    chat_id:chatAct.id,autor_id:uid,autor_nombre:me.nombre||'Emprendedor',
    texto:'❌ Rechacé la oferta. Podemos seguir conversando para llegar a un acuerdo.',
    tipo:'texto',created_at:new Date().toISOString()
  });
  await db.from('chats').update({ultimo_mensaje:'❌ Oferta rechazada',no_leido_prov:(chatAct.no_leido_prov||0)+1}).eq('id',chatAct.id);
  await cargarMsgs();
  toast('Oferta rechazada');
};

// ENVIAR MENSAJE — solo texto, sin negociación
window.enviar=async function(){
  const ta=Q('ta');const txt=ta.value.trim();
  if(!txt||!chatAct)return;ta.value='';crecer(ta);ta.focus();
  await db.from('mensajes').insert({
    chat_id:chatAct.id,autor_id:uid,autor_nombre:me.nombre||'Emprendedor',
    texto:txt,tipo:'texto',created_at:new Date().toISOString()
  });
  await db.from('chats').update({ultimo_mensaje:txt.slice(0,60),no_leido_prov:(chatAct.no_leido_prov||0)+1}).eq('id',chatAct.id);
  await cargarMsgs();
};
window.tecla=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();enviar();}};
window.crecer=el=>{el.style.height='auto';el.style.height=Math.min(el.scrollHeight,120)+'px';};

function showMenu(id,x,y){menuId=id;const m=Q('mMenu');m.style.left=Math.min(x,window.innerWidth-170)+'px';m.style.top=Math.min(y,window.innerHeight-80)+'px';m.classList.add('on');Q('mOv').classList.add('on');}
window.cerrarMenu=()=>{Q('mMenu').classList.remove('on');Q('mOv').classList.remove('on');menuId=null;};
window.borrar=async()=>{if(!menuId)return;cerrarMenu();await db.from('mensajes').delete().eq('id',menuId);await cargarMsgs();toast('Mensaje eliminado');};

function suscribir(){
  if(canal)db.removeChannel(canal);
  canal=db.channel('chat-emp-'+chatAct.id)
    .on('postgres_changes',{event:'INSERT',schema:'public',table:'mensajes',filter:`chat_id=eq.${chatAct.id}`},async()=>{await cargarMsgs();})
    .on('postgres_changes',{event:'DELETE',schema:'public',table:'mensajes',filter:`chat_id=eq.${chatAct.id}`},async()=>{await cargarMsgs();})
    .subscribe();
}

function volver(){
  if(canal)db.removeChannel(canal);
  chatAct=null;prodActual=null;msgsArr=[];
  Q('pChat').style.display='none';Q('pLista').style.display='flex';
  cargarChats();
}

const pal=n=>{const c=['#FF8C00','#007AFF','#A8E63D','#A855F7','#FF4D4D','#F59E0B'];return c[Math.abs((n||'').charCodeAt(0)||0)%c.length];};
const esc=t=>(t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function toast(m){const t=Q('tst');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),3000);}
</script>
</body>
