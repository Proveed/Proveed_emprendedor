<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>PROVEED — Chat</title>
<meta name="theme-color" content="#ffffff">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
:root{--G:#A8E63D;--G2:#7BC234;--O:#FF8C00;--R:#FF4D4D;--F:#F5F6F2;}
html,body{height:100%;overflow:hidden;}
body{font-family:'Inter',sans-serif;background:#fff;color:#111;}

#pLista{height:100%;display:flex;flex-direction:column;}
#pChat{height:100%;display:none;flex-direction:column;}

/* HEADER LISTA */
.hLista{background:#fff;padding:44px 16px 12px;border-bottom:2.5px solid var(--G);flex-shrink:0;}
.hTop{display:flex;align-items:center;gap:8px;margin-bottom:10px;}
.hTit{font-size:1rem;font-weight:900;color:#111;}
.hTit b{color:var(--G2);}
.sBus{display:flex;align-items:center;gap:8px;background:var(--F);border-radius:24px;padding:10px 14px;border:1.5px solid #eee;}
.sBus svg{width:14px;height:14px;stroke:#bbb;fill:none;stroke-width:2.5;flex-shrink:0;}
.sBus input{flex:1;background:transparent;border:none;outline:none;font-family:'Inter',sans-serif;font-size:.86rem;color:#111;}
.sBus input::placeholder{color:#ccc;}

/* LISTA */
.listaScroll{flex:1;overflow-y:auto;padding-bottom:80px;}
.chatItem{display:flex;align-items:center;gap:12px;padding:14px 16px;background:#fff;border-bottom:1px solid #f0f0f0;cursor:pointer;}
.chatItem:active{background:var(--F);}
.chatItem.new{border-left:3px solid var(--G);}
.ciAv{width:46px;height:46px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:1.1rem;font-weight:800;color:#fff;flex-shrink:0;position:relative;}
.ciDot{position:absolute;bottom:1px;right:1px;width:9px;height:9px;background:var(--G);border-radius:50%;border:2px solid #fff;}
.ciInf{flex:1;min-width:0;}
.ciNom{font-size:.88rem;font-weight:700;color:#111;margin-bottom:2px;}
.ciMsg{font-size:.74rem;color:#aaa;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ciR{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex-shrink:0;}
.ciHora{font-size:.6rem;color:#ccc;}
.ciUnread{width:18px;height:18px;background:var(--G);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.58rem;font-weight:800;color:#111;}
.vacio{text-align:center;padding:60px 20px;color:#bbb;font-size:.82rem;line-height:1.7;}

/* CHAT HEADER */
.cHead{background:#fff;padding:44px 12px 12px;border-bottom:2.5px solid var(--G);display:flex;align-items:center;gap:10px;flex-shrink:0;}
.cBack{width:36px;height:36px;background:rgba(168,230,61,.1);border-radius:11px;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.cBack svg{width:18px;height:18px;stroke:var(--G2);fill:none;stroke-width:2.5;}
.cAv{width:40px;height:40px;border-radius:12px;font-size:.9rem;font-weight:800;color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.cInf{flex:1;min-width:0;}
.cNom{font-size:.9rem;font-weight:800;color:#111;}
.cSub{font-size:.68rem;color:var(--O);font-weight:600;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

/* REGLAMENTO */
.reglamento-card{margin:10px 14px;border-radius:16px;padding:14px;background:#fff8f0;border:1.5px solid rgba(255,140,0,.3);flex-shrink:0;}
.reg-tit{font-size:.78rem;font-weight:800;color:#111;margin-bottom:6px;display:flex;align-items:center;gap:6px;}
.reg-sub{font-size:.68rem;color:#888;line-height:1.6;margin-bottom:10px;}
.reg-item{font-size:.68rem;color:#666;display:flex;align-items:flex-start;gap:6px;margin-bottom:4px;}
.reg-item span{color:var(--R);font-weight:800;flex-shrink:0;}
.reg-btn{width:100%;padding:9px;background:var(--G);color:#111;border:none;border-radius:10px;font-family:'Inter',sans-serif;font-size:.78rem;font-weight:800;cursor:pointer;margin-top:8px;}

/* MSGS */
.msgsArea{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:10px 14px;background:var(--F);display:flex;flex-direction:column;gap:5px;}
.msg{display:flex;flex-direction:column;}
.msg.yo{align-items:flex-end;}
.msg.el{align-items:flex-start;}
.bub{padding:10px 14px;border-radius:18px;font-size:.88rem;line-height:1.5;max-width:80%;word-break:break-word;cursor:pointer;}
.msg.yo .bub{background:var(--G);color:#111;border-bottom-right-radius:4px;font-weight:600;}
.msg.el .bub{background:#fff;color:#111;border-bottom-left-radius:4px;box-shadow:0 1px 4px rgba(0,0,0,.08);}
.mHora{font-size:.58rem;color:#bbb;margin-top:3px;padding:0 4px;}
.mAutor{font-size:.6rem;color:#aaa;margin-bottom:2px;padding:0 4px;}

/* IMAGEN EN CHAT */
.msg-img-wrap{max-width:220px;border-radius:14px;overflow:hidden;cursor:pointer;position:relative;}
.msg-img-wrap img{width:100%;display:block;border-radius:14px;}
.msg-img-del{position:absolute;top:6px;right:6px;width:24px;height:24px;background:rgba(255,77,77,.85);border-radius:50%;display:flex;align-items:center;justify-content:center;border:none;cursor:pointer;}
.msg-img-del svg{width:11px;height:11px;stroke:#fff;fill:none;stroke-width:2.5;}

/* OFERTA */
.esp{display:flex;justify-content:center;width:100%;padding:4px 0;}
.ofertaC{background:#fff;border:2px solid var(--G);border-radius:20px;padding:16px;width:94%;max-width:340px;box-shadow:0 4px 16px rgba(168,230,61,.08);}
.ofertaH{font-size:.62rem;font-weight:800;color:var(--G);text-transform:uppercase;letter-spacing:.5px;margin-bottom:12px;}
.ofertaItem{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #eee;}
.ofertaItem:last-of-type{border:none;}
.ofertaImg{width:38px;height:38px;border-radius:9px;background:#f5f5f5;overflow:hidden;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:1.2rem;}
.ofertaImg img{width:100%;height:100%;object-fit:cover;}
.ofertaNom{font-size:.78rem;font-weight:600;color:#111;}
.ofertaCant{font-size:.64rem;color:#aaa;}
.ofertaOrig{font-size:.68rem;color:#bbb;text-decoration:line-through;}
.ofertaNuevo{font-size:.92rem;font-weight:900;color:var(--G);}
.ofertaTot{display:flex;justify-content:space-between;align-items:center;margin:10px 0;padding:10px;background:rgba(168,230,61,.06);border-radius:12px;}
.ofertaTotL{font-size:.8rem;font-weight:700;color:#111;}
.ofertaTotV{font-size:1.1rem;font-weight:900;color:var(--G);}
.ofertaNota{font-size:.76rem;color:#888;font-style:italic;padding:8px 10px;background:#f5f5f5;border-radius:10px;margin-bottom:12px;line-height:1.5;}
.ofertaSt{text-align:center;font-size:.74rem;font-weight:700;padding:8px;border-radius:12px;margin-top:4px;}
.ofertaSt.pendiente{background:rgba(255,140,0,.08);color:var(--O);}
.ofertaBtns{display:flex;gap:8px;margin-top:10px;}
.ofertaBtns button{flex:1;padding:10px;border:none;border-radius:12px;font-family:'Inter',sans-serif;font-size:.82rem;font-weight:800;cursor:pointer;}
.btn-aceptar{background:var(--G);color:#111;}
.btn-rechazar{background:rgba(255,77,77,.1);color:var(--R);}
.ofertaSt.aceptado{background:rgba(168,230,61,.1);color:var(--G2);}
.ofertaSt.rechazado{background:rgba(255,77,77,.06);color:var(--R);}
.ofertaHr{font-size:.58rem;color:#bbb;text-align:right;margin-top:8px;}

/* PROD INTERES */
.prodIntC{background:#fff;border:2px solid rgba(255,140,0,.3);border-radius:18px;padding:14px;width:92%;max-width:340px;}

/* INPUT */
.inputArea{background:#fff;border-top:1px solid #eee;padding:8px 12px;padding-bottom:max(10px,env(safe-area-inset-bottom));flex-shrink:0;}
.iRow{display:flex;align-items:flex-end;gap:8px;}
.img-btn{width:36px;height:36px;background:var(--F);border-radius:11px;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.img-btn svg{width:18px;height:18px;stroke:#999;fill:none;stroke-width:2;}
.iBox{flex:1;background:var(--F);border-radius:22px;padding:10px 14px;border:1.5px solid #eee;display:flex;align-items:flex-end;}
textarea#ta{flex:1;background:transparent;border:none;outline:none;font-family:'Inter',sans-serif;font-size:.9rem;color:#111!important;-webkit-text-fill-color:#111!important;resize:none;line-height:1.4;min-height:22px;max-height:120px;width:100%;caret-color:var(--G);}
textarea#ta::placeholder{color:#ccc;}
.sBtn{width:42px;height:42px;background:var(--G);border-radius:50%;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.sBtn svg{width:17px;height:17px;stroke:#111;fill:none;stroke-width:2.5;}

/* MENU BORRAR */
.mOv{position:fixed;inset:0;z-index:699;display:none;}
.mOv.on{display:block;}
.mMenu{position:fixed;background:#fff;border-radius:12px;box-shadow:0 6px 24px rgba(0,0,0,.15);padding:4px;z-index:700;border:1px solid #eee;display:none;}
.mMenu.on{display:block;}
.mMenu button{display:flex;align-items:center;gap:8px;width:100%;padding:10px 16px;background:transparent;border:none;font-family:'Inter',sans-serif;font-size:.84rem;font-weight:600;color:var(--R);cursor:pointer;border-radius:8px;white-space:nowrap;}
.mMenu button svg{width:14px;height:14px;stroke:var(--R);fill:none;stroke-width:2.2;}

.tab-bar{background:#fff;border-top:1px solid #eee;display:flex;padding:8px 0;padding-bottom:max(8px,env(safe-area-inset-bottom));flex-shrink:0;}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;text-decoration:none;padding:4px 0;}
.tab svg{width:22px;height:22px;stroke:#ccc;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.tab span{font-size:.55rem;font-weight:700;color:#ccc;text-transform:uppercase;}
.tab.on svg{stroke:var(--G2);}
.tab.on span{color:var(--G2);}
.tab-rel{position:relative;}
.tab-badge{position:absolute;top:-2px;right:6px;background:var(--R);color:#fff;font-size:.5rem;font-weight:800;width:14px;height:14px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:1.5px solid #fff;}

.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%) translateY(20px);background:#111;color:#fff;padding:10px 20px;border-radius:24px;font-size:.8rem;font-weight:600;opacity:0;transition:.3s;pointer-events:none;z-index:2000;white-space:nowrap;}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0);}

.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.95);z-index:1000;display:none;align-items:center;justify-content:center;}
.lightbox.on{display:flex;}
.lightbox img{max-width:100vw;max-height:85vh;object-fit:contain;}
.lb-close{position:absolute;top:44px;right:16px;width:36px;height:36px;background:rgba(255,255,255,.15);border-radius:50%;display:flex;align-items:center;justify-content:center;border:none;cursor:pointer;}
.lb-close svg{width:16px;height:16px;stroke:white;fill:none;stroke-width:2.5;}
</style>
</head>
<body>

<!-- LISTA -->
<div id="pLista">
  <div class="hLista">
    <div class="hTop">
      <svg width="24" height="24" viewBox="0 0 28 28" fill="none"><polygon points="14,1.5 25,7.5 25,20.5 14,26.5 3,20.5 3,7.5" fill="#A8E63D"/><polyline points="8,14 12,18 20,10" stroke="#111" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span class="hTit">PRO<b>VEED</b> · Chats</span>
    </div>
    <div class="sBus">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>

    <a class="tab tab-rel" href="carrito.html"><svg viewBox="0 0 24 24"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg><span>Carrito</span><div class="tab-badge" id="carrito-badge" style="display:none;"></div></a>
    <a class="tab" href="perfil-emprendedor.html"><svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg><span>Perfil</span></a>

<!-- CHAT -->
<div id="pChat">
  <div class="cHead">
    <button class="cBack" onclick="volver()"><svg viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg></button>

    <div class="cInf"><div class="cNom" id="cNom">—</div><div class="cSub" id="cSub">—</div></div>

    <div class="iRow">

        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
      </button>
      <div class="iBox">
        <textarea id="ta" placeholder="Escribe un mensaje..." rows="1" onkeydown="tecla(event)" oninput="crecer(this)"></textarea>
      </div>
      <button class="sBtn" onclick="enviar()">
        <svg viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
      </button>
    </div>
  </div>
  <nav class="tab-bar">
    <a class="tab" href="dashboard.html"><svg viewBox="0 0 24 24"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg><span>Inicio</span></a>
    <a class="tab" href="explorar.html"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg><span>Explorar</span></a>
    <a class="tab on"><svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg><span>Chat</span></a>
    <a class="tab tab-rel" href="carrito.html"><svg viewBox="0 0 24 24"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg><span>Carrito</span><div class="tab-badge" id="carrito-badge2" style="display:none;"></div></a>

<div class="mOv" id="mOv" onclick="cerrarMenu()"></div>
<div class="mMenu" id="mMenu"><button onclick="borrar()"><svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>Eliminar mensaje</button></div>

<div class="lightbox" id="lightbox" onclick="cerrarLightbox()">
  <button class="lb-close"><svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
  <img id="lb-img" src="" alt="">
</div>

<input type="file" id="inp-img-emp" accept="image/*" style="display:none;" onchange="enviarImagen(this)">
<div class="toast" id="tst"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const {createClient}=supabase;
const db=createClient('https://hfmsyrmkewscnvwynzfq.supabase.co','sb_publishable_d1oLsq70a6ZV33vW3XkRgw_nYcN2Z9v');
const Q=id=>document.getElementById(id);
let uid='',me={},chatAct=null,todos=[],msgsArr=[],canal=null,menuId=null;
const QS=new URLSearchParams(location.search);
const REGLAMENTO_KEY='proveed_reglamento_emp_visto';

// Badge carrito
const carrito=JSON.parse(localStorage.getItem('carrito_proveed')||'[]');
const cntC=carrito.reduce((s,i)=>s+(i.cantidad||1),0);
if(cntC>0){['carrito-badge','carrito-badge2'].forEach(id=>{const b=Q(id);if(b){b.style.display='flex';b.textContent=cntC>9?'9+':cntC;}});}

// PATRONES PROHIBIDOS
const PROHIBIDO=[
  /\b\d{7,}\b/g,
  /https?:\/\/[^\s]+/gi,
  /wa\.me|whatsapp/gi,
  /instagram\.com|instagram/gi,
  /facebook\.com|facebook|fb\.com/gi,
  /t\.me|telegram/gi,
  /paypal|payphone|transfer|transferencia/gi,
];
function textoProhibido(txt){return PROHIBIDO.some(r=>r.test(txt));}

(async()=>{
  const {data:{session}}=await db.auth.getSession();
  if(!session){location.href='login.html';return;}
  uid=session.user.id;
  const {data:u}=await db.from('usuarios').select('*').eq('id',uid).single();
  if(u)me=u;
  await cargarChats();
  const provId=QS.get('proveedor_id');
  const prodId=QS.get('prod_id');
  const prodNom=QS.get('prod_nombre');
  const prodPre=QS.get('prod_precio');
  const prodImg=QS.get('prod_img');
  if(provId){
    let chat=todos.find(c=>c.proveedor_id===provId);
    if(!chat){
      const {data:prov}=await db.from('usuarios').select('nombre,empresa').eq('id',provId).single();
      const nomProv=prov?.empresa||prov?.nombre||'Proveedor';
      const {data:nuevo}=await db.from('chats').insert({emprendedor_id:uid,emprendedor_nombre:me.nombre||'Emprendedor',proveedor_id:provId,proveedor_nombre:nomProv,producto_id:prodId||null,producto_nombre:prodNom?decodeURIComponent(prodNom):null,ultimo_mensaje:'Nueva conversación',created_at:new Date().toISOString()}).select().single();
      if(nuevo)chat=nuevo;
    }
    if(chat){
      await abrirChat(chat);
      if(prodId&&prodNom){
        const yaEnviado=msgsArr.some(m=>m.tipo==='producto_interes'&&m.data?.producto_id===prodId);
        if(!yaEnviado){
          await db.from('mensajes').insert({chat_id:chat.id,autor_id:uid,autor_nombre:me.nombre||'Emprendedor',texto:`Hola, me interesa el producto "${decodeURIComponent(prodNom)}"`,tipo:'producto_interes',data:{producto_id:prodId,producto_nombre:decodeURIComponent(prodNom),producto_precio:parseFloat(prodPre||0),producto_imagen:prodImg?decodeURIComponent(prodImg):''},created_at:new Date().toISOString()});
          await db.from('chats').update({ultimo_mensaje:`Interés: ${decodeURIComponent(prodNom)}`,no_leido_prov:(chat.no_leido_prov||0)+1}).eq('id',chat.id);
          await cargarMsgs();
        }
      }
    }
  }
})();

async function cargarChats(){
  const {data, error} = await db.from('chats')
    .select('*')
    .or(`emprendedor_id.eq.${uid},proveedor_id.eq.${uid}`)
    .order('created_at', {ascending: false});

  if(error){
    console.error('Error cargando chats:', error);
    Q('lista').innerHTML = '<div class="vacio">Error al cargar. Recarga la página.</div>';
    return;
  }

  todos = data || [];
  pintarLista(todos);
}
function pintarLista(arr){
  const c=Q('lista');
  if(!arr.length){c.innerHTML='<div class="vacio">Sin conversaciones aún.<br>Entra a un producto y toca "Chatear".</div>';return;}
  c.innerHTML='';
  arr.forEach(ch=>{
    const nom=ch.proveedor_nombre||'Proveedor';
    const hora=ch.created_at?new Date(ch.created_at).toLocaleTimeString('es-EC',{hour:'2-digit',minute:'2-digit'}):'';
    const d=document.createElement('div');
    d.className='chatItem'+((ch.no_leido_emp||0)>0?' new':'');
    d.innerHTML=`<div class="ciAv" style="background:${pal(nom)};">${nom[0].toUpperCase()}<div class="ciDot"></div></div>
      <div class="ciInf"><div class="ciNom">${nom}</div>${ch.producto_nombre?`<div style="font-size:.64rem;color:var(--O);font-weight:600;margin-bottom:2px;">📦 ${ch.producto_nombre}</div>`:''}<div class="ciMsg">${ch.ultimo_mensaje||'Nueva conversación'}</div></div>
      <div class="ciR"><div class="ciHora">${hora}</div>${(ch.no_leido_emp||0)>0?`<div class="ciUnread">${ch.no_leido_emp}</div>`:''}</div>`;
    d.onclick=()=>abrirChat(ch);c.appendChild(d);
  });
}

window.filtrar=q=>{const ql=q.toLowerCase();pintarLista(todos.filter(c=>(c.proveedor_nombre||'').toLowerCase().includes(ql)||(c.ultimo_mensaje||'').toLowerCase().includes(ql)));};

async function abrirChat(chat){
  chatAct=chat;msgsArr=[];
  Q('pLista').style.display='none';Q('pChat').style.display='flex';
  Q('msgs').innerHTML='<div style="text-align:center;padding:40px;color:#bbb;font-size:.82rem;">Cargando...</div>';
  const nom=chat.proveedor_nombre||'Proveedor';
  Q('cAv').textContent=nom[0].toUpperCase();Q('cAv').style.background=pal(nom);
  Q('cNom').textContent=nom;
  Q('cSub').textContent=chat.producto_nombre?`📦 ${chat.producto_nombre}`:nom;
  await db.from('chats').update({no_leido_emp:0}).eq('id',chat.id);
  await cargarMsgs();
  mostrarReglamentoSiPrimera();
  suscribir();
}

function mostrarReglamentoSiPrimera(){
  if(localStorage.getItem(REGLAMENTO_KEY))return;
  const card=document.createElement('div');
  card.className='reglamento-card';card.id='reg-card';
  card.innerHTML=`
    <div class="reg-tit">🔒 Política de seguridad PROVEED</div>
    <div class="reg-sub">Por la seguridad de todos los usuarios y para prevenir extorsiones, fraudes y pérdidas comerciales, en PROVEED está prohibido compartir:</div>
    <div class="reg-item"><span>✕</span>Números de teléfono o celular</div>
    <div class="reg-item"><span>✕</span>Links de WhatsApp, Instagram o Facebook</div>
    <div class="reg-item"><span>✕</span>Links de pago externos (PayPal, Payphone, etc.)</div>
    <div class="reg-item"><span>✕</span>Cualquier enlace que saque la negociación fuera de PROVEED</div>
    <div class="reg-sub" style="margin-top:8px;">Los mensajes con esta información serán bloqueados automáticamente.</div>
    <button class="reg-btn" onclick="cerrarReglamento()">✓ Entendido, continuar</button>`;
  Q('msgs').prepend(card);
}
window.cerrarReglamento=function(){localStorage.setItem(REGLAMENTO_KEY,'1');const c=Q('reg-card');if(c)c.remove();};

async function cargarMsgs(){
  const {data}=await db.from('mensajes').select('*').eq('chat_id',chatAct.id).order('created_at',{ascending:true});
  msgsArr=data||[];pintarMsgs();
}

function pintarMsgs(){
  const w=Q('msgs');
  w.innerHTML='';
  if(!msgsArr.length){w.innerHTML='<div style="text-align:center;padding:50px 20px;color:#bbb;font-size:.84rem;">Inicia la conversación 💬</div>';}
  else{msgsArr.forEach(m=>w.appendChild(mkBurbuja(m)));}
  setTimeout(()=>w.scrollTop=w.scrollHeight,60);
}

function mkBurbuja(m){
  const yo=m.autor_id===uid;
  const hr=new Date(m.created_at).toLocaleTimeString('es-EC',{hour:'2-digit',minute:'2-digit'});
  if(m.tipo==='negociacion')return mkOfertaBub(m,yo,hr);
  if(m.tipo==='producto_interes')return mkProdInteresBub(m,yo,hr);

  if(m.tipo==='imagen'){
    const d=document.createElement('div');d.className=`msg ${yo?'yo':'el'}`;
    const wrap=document.createElement('div');wrap.className='msg-img-wrap';
    wrap.innerHTML=`<img src="${m.url||''}" loading="lazy" onclick="verImg('${m.url||''}')">`;
    if(yo){const btn=document.createElement('button');btn.className='msg-img-del';btn.innerHTML=`<svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>`;btn.onclick=()=>borrarMsgId(m.id);wrap.appendChild(btn);}
    const h=document.createElement('div');h.className='mHora';h.textContent=hr+(yo?' ✓✓':'');
    d.appendChild(wrap);d.appendChild(h);return d;
  }

  const d=document.createElement('div');d.className=`msg ${yo?'yo':'el'}`;
  if(!yo)d.innerHTML=`<div class="mAutor">${m.autor_nombre||'Proveedor'}</div>`;
  const b=document.createElement('div');b.className='bub';b.textContent=m.texto||'';
  if(yo){
    let pt;
    b.addEventListener('touchstart',e=>{pt=setTimeout(()=>showMenu(m.id,e.touches[0].clientX,e.touches[0].clientY),600);},{passive:true});
    b.addEventListener('touchend',()=>clearTimeout(pt),{passive:true});
    b.addEventListener('touchmove',()=>clearTimeout(pt),{passive:true});
    b.addEventListener('contextmenu',e=>{e.preventDefault();showMenu(m.id,e.clientX,e.clientY);});
  }
  const h=document.createElement('div');h.className='mHora';h.textContent=hr+(yo?' ✓✓':'');
  d.appendChild(b);d.appendChild(h);return d;
}

function mkProdInteresBub(m,yo,hr){
  const dat=m.data||{};
  const w=document.createElement('div');w.className='esp';
  const c=document.createElement('div');c.className='prodIntC';
  c.innerHTML=`<div style="font-size:.62rem;font-weight:800;color:var(--O);text-transform:uppercase;margin-bottom:8px;">📌 Producto de interés</div>
    <div style="display:flex;align-items:center;gap:10px;">
      <div style="width:44px;height:44px;border-radius:10px;background:#f5f5f5;overflow:hidden;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:1.4rem;">${dat.producto_imagen?`<img src="${dat.producto_imagen}" style="width:100%;height:100%;object-fit:cover;">`:'📦'}</div>
      <div><div style="font-size:.84rem;font-weight:700;color:#111;">${dat.producto_nombre||'Producto'}</div><div style="font-size:.74rem;color:var(--O);font-weight:800;">$${Number(dat.producto_precio||0).toFixed(2)}</div></div>
    </div>
    <div style="font-size:.58rem;color:#bbb;text-align:right;margin-top:6px;">${hr}</div>`;
  w.appendChild(c);return w;
}

function mkOfertaBub(m,yo,hr){
  const dat=m.data||{},est=dat.estado||'pendiente';
  let items='';
  (dat.items||[]).forEach(it=>{
    items+=`<div class="ofertaItem"><div class="ofertaImg">${it.imagen?`<img src="${it.imagen}">`:'📦'}</div><div style="flex:1;min-width:0;"><div class="ofertaNom">${it.nombre}</div><div class="ofertaCant">×${it.cantidad||1}</div></div><div style="text-align:right;"><div class="ofertaOrig">$${Number(it.precioOriginal||0).toFixed(2)}</div><div class="ofertaNuevo">$${Number(it.precioOfertado||0).toFixed(2)}</div></div></div>`;
  });
  const tN=Number(dat.totalOfertado||0);
  const w=document.createElement('div');w.className='esp';
  const c=document.createElement('div');c.className='ofertaC';
  let btns='';
  if(est==='pendiente'&&!yo){
    btns=`<div class="ofertaBtns"><button class="btn-aceptar" onclick="responderOferta('${m.id}','aceptado',${JSON.stringify(dat).replace(/'/g,'\\'')})">✅ Aceptar</button><button class="btn-rechazar" onclick="responderOferta('${m.id}','rechazado',null)">❌ Rechazar</button></div>`;
  }
  c.innerHTML=`<div class="ofertaH">💰 ${yo?'Oferta recibida del proveedor':'Tu respuesta a la oferta'}</div>
    ${items?`<div style="margin-bottom:4px;">${items}</div>`:''}
    <div class="ofertaTot"><span class="ofertaTotL">Total oferta</span><span class="ofertaTotV">$${tN.toFixed(2)}</span></div>
    ${dat.mensaje?`<div class="ofertaNota">"${dat.mensaje}"</div>`:''}
    ${est==='pendiente'&&!yo?btns:`<div class="ofertaSt ${est}">${est==='aceptado'?'✅ Aceptaste esta oferta':est==='rechazado'?'❌ Rechazaste esta oferta':'⏳ Esperando tu respuesta...'}</div>`}
    <div class="ofertaHr">${hr}</div>`;
  w.appendChild(c);return w;
}

window.responderOferta=async function(msgId,resp,dat){
  await db.from('mensajes').update({data:{...(dat||{}),estado:resp}}).eq('id',msgId);
  if(resp==='aceptado'&&dat){
    const items=(dat.items||[]).map(i=>({id:i.id,nombre:i.nombre,precio:i.precioOfertado,imagen:i.imagen,cantidad:i.cantidad,proveedor_id:chatAct.proveedor_id}));
    const carrito=JSON.parse(localStorage.getItem('carrito_proveed')||'[]');
    items.forEach(it=>{const idx=carrito.findIndex(c=>c.id===it.id);if(idx>=0)carrito[idx]=it;else carrito.push(it);});
    localStorage.setItem('carrito_proveed',JSON.stringify(carrito));
    await db.from('pedidos').insert({emprendedor_id:uid,emprendedor_nombre:me.nombre||'Emprendedor',proveedor_id:chatAct.proveedor_id,nombre_proveedor:chatAct.proveedor_nombre,items,total:dat.totalOfertado,estado:'confirmado',origen:'negociacion',created_at:new Date().toISOString()});
    toast('✅ Oferta aceptada — pedido generado');
  } else {toast('Oferta rechazada');}
  await cargarMsgs();
};

window.enviarImagen=async function(input){
  const file=input.files[0];if(!file)return;input.value='';toast('Subiendo imagen...');
  const reader=new FileReader();
  reader.onload=async e=>{
    await db.from('mensajes').insert({chat_id:chatAct.id,autor_id:uid,autor_nombre:me.nombre||'Emprendedor',texto:'',tipo:'imagen',url:e.target.result,created_at:new Date().toISOString()});
    await db.from('chats').update({ultimo_mensaje:'📷 Imagen',no_leido_prov:(chatAct.no_leido_prov||0)+1}).eq('id',chatAct.id);
    await cargarMsgs();toast('✓ Imagen enviada');
  };
  reader.readAsDataURL(file);
};

window.verImg=url=>{Q('lb-img').src=url;Q('lightbox').classList.add('on');};
window.cerrarLightbox=()=>Q('lightbox').classList.remove('on');

window.enviar=async function(){
  const ta=Q('ta');const txt=ta.value.trim();if(!txt||!chatAct)return;
  if(textoProhibido(txt)){toast('🚫 Mensaje bloqueado: no se permite compartir datos de contacto, links o pagos externos');return;}
  ta.value='';crecer(ta);ta.focus();
  await db.from('mensajes').insert({chat_id:chatAct.id,autor_id:uid,autor_nombre:me.nombre||'Emprendedor',texto:txt,tipo:'texto',created_at:new Date().toISOString()});
  await db.from('chats').update({ultimo_mensaje:txt.slice(0,60),no_leido_prov:(chatAct.no_leido_prov||0)+1}).eq('id',chatAct.id);
  await cargarMsgs();
};
window.tecla=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();enviar();}};
window.crecer=el=>{el.style.height='auto';el.style.height=Math.min(el.scrollHeight,120)+'px';};

function showMenu(id,x,y){
  const m=msgsArr.find(m=>m.id===id);
  if(m?.tipo==='negociacion'){toast('Las negociaciones no se pueden eliminar');return;}
  menuId=id;const mn=Q('mMenu');mn.style.left=Math.min(x,window.innerWidth-170)+'px';mn.style.top=Math.min(y,window.innerHeight-80)+'px';mn.classList.add('on');Q('mOv').classList.add('on');
}
window.cerrarMenu=()=>{Q('mMenu').classList.remove('on');Q('mOv').classList.remove('on');menuId=null;};
window.borrar=async()=>{if(!menuId)return;cerrarMenu();await borrarMsgId(menuId);};
async function borrarMsgId(id){
  const m=msgsArr.find(m=>m.id===id);
  if(m?.tipo==='negociacion'){toast('Las negociaciones no se pueden eliminar');return;}
  await db.from('mensajes').delete().eq('id',id);await cargarMsgs();toast('Mensaje eliminado');
}

function suscribir(){
  if(canal)db.removeChannel(canal);
  canal=db.channel('chat-emp-'+chatAct.id)
    .on('postgres_changes',{event:'INSERT',schema:'public',table:'mensajes',filter:`chat_id=eq.${chatAct.id}`},async()=>{await cargarMsgs();})
    .on('postgres_changes',{event:'DELETE',schema:'public',table:'mensajes',filter:`chat_id=eq.${chatAct.id}`},async()=>{await cargarMsgs();})
    .on('postgres_changes',{event:'UPDATE',schema:'public',table:'mensajes',filter:`chat_id=eq.${chatAct.id}`},async()=>{await cargarMsgs();})
    .subscribe();
}

function volver(){
  if(canal)db.removeChannel(canal);chatAct=null;msgsArr=[];
  Q('pChat').style.display='none';Q('pLista').style.display='flex';
  cargarChats();
}

const pal=n=>{const c=['#FF8C00','#007AFF','#A8E63D','#A855F7','#FF4D4D','#F59E0B'];return c[Math.abs((n||'').charCodeAt(0)||0)%c.length];};
const esc=t=>(t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function toast(m){const t=Q('tst');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),3000);}
</script>
</body>
</html>
