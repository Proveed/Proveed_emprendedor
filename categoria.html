<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>PROVEED — Categoría</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
:root{--G:#A8E63D;--G2:#7BC234;--F:#F5F6F2;--O:#FF8C00;--R:#FF4D4D;}
body{background:var(--F);font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;padding-bottom:80px;}

.header{background:#fff;padding:44px 14px 10px;position:sticky;top:0;z-index:100;border-bottom:1px solid #eee;}
.hRow{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.back-btn{width:36px;height:36px;background:var(--F);border-radius:11px;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.back-btn svg{width:18px;height:18px;stroke:#555;fill:none;stroke-width:2.5;}
.search-box{flex:1;display:flex;align-items:center;gap:8px;background:var(--F);border-radius:24px;padding:10px 14px;border:1.5px solid #eee;}
.search-box svg{width:14px;height:14px;stroke:#bbb;fill:none;stroke-width:2.5;flex-shrink:0;}
.search-box input{flex:1;background:transparent;border:none;outline:none;font-family:'Inter',sans-serif;font-size:0.86rem;color:#111;}
.search-box input::placeholder{color:#ccc;}
.cat-tit{font-size:1rem;font-weight:900;color:#111;}
.cat-count{font-size:0.7rem;color:#aaa;font-weight:600;margin-top:1px;}

/* SUBCATEGORÍAS CHIPS */
.subcats-scroll{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;}
.subcats-scroll::-webkit-scrollbar{display:none;}
.subcat-chip{padding:7px 14px;border-radius:20px;border:1.5px solid #eee;background:#fff;font-family:'Inter',sans-serif;font-size:0.74rem;font-weight:700;color:#666;cursor:pointer;white-space:nowrap;flex-shrink:0;}
.subcat-chip.active{border-color:var(--G);color:var(--G2);background:rgba(168,230,61,0.08);}

/* FILTROS RÁPIDOS */
.filtros-row{display:flex;gap:7px;padding:10px 14px;overflow-x:auto;scrollbar-width:none;background:#fff;border-bottom:1px solid #eee;}
.filtros-row::-webkit-scrollbar{display:none;}
.filtro-chip{padding:6px 13px;border-radius:20px;border:1.5px solid #eee;background:var(--F);font-family:'Inter',sans-serif;font-size:0.7rem;font-weight:700;color:#666;cursor:pointer;white-space:nowrap;flex-shrink:0;display:flex;align-items:center;gap:4px;}
.filtro-chip.active{border-color:var(--O);color:var(--O);background:rgba(255,140,0,0.06);}

/* GRID PRODUCTOS — 2 columnas estilo catálogo */
.content{padding:10px 12px;}
.prods-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.prod-card{background:#fff;border-radius:14px;overflow:hidden;border:1px solid #eee;box-shadow:0 1px 6px rgba(0,0,0,0.04);cursor:pointer;}
.prod-card:active{transform:scale(0.97);}
.prod-img{width:100%;height:140px;background:var(--F);display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative;}
.prod-img img{width:100%;height:100%;object-fit:cover;}
.prod-img-ico{font-size:2.2rem;}
.prod-badge{position:absolute;top:6px;left:6px;font-size:0.5rem;font-weight:800;padding:2px 6px;border-radius:20px;color:#fff;text-transform:uppercase;}
.prod-verif{position:absolute;top:6px;right:6px;background:rgba(0,122,255,0.9);color:#fff;font-size:0.5rem;font-weight:800;padding:2px 6px;border-radius:20px;display:flex;align-items:center;gap:2px;}
.prod-body{padding:10px;}
.prod-nombre{font-size:0.76rem;font-weight:600;color:#111;margin-bottom:6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.3;min-height:2.6em;}
.prod-precio-row{display:flex;align-items:baseline;gap:4px;margin-bottom:3px;}
.prod-precio{font-size:0.96rem;font-weight:900;color:var(--O);}
.prod-min{font-size:0.62rem;color:#aaa;margin-bottom:6px;}
.prod-prov-row{display:flex;align-items:center;gap:4px;margin-bottom:6px;}
.prod-prov{font-size:0.62rem;color:#888;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;}
.prod-footer{display:flex;align-items:center;justify-content:space-between;}
.prod-vendidos{font-size:0.6rem;color:#bbb;}
.prod-add{width:24px;height:24px;background:var(--G);border-radius:8px;display:flex;align-items:center;justify-content:center;border:none;cursor:pointer;flex-shrink:0;}
.prod-add svg{width:11px;height:11px;stroke:#111;fill:none;stroke-width:2.5;}

.empty-cat{text-align:center;padding:60px 20px;color:#bbb;}
.empty-cat p{font-size:0.82rem;font-weight:600;}

.load-more{width:100%;padding:13px;background:#fff;border:1.5px solid #eee;border-radius:14px;font-family:'Inter',sans-serif;font-size:0.84rem;font-weight:700;color:#666;cursor:pointer;margin-top:6px;}
.load-more:disabled{opacity:0.5;}

.tab-bar{position:fixed;bottom:0;width:100%;background:#fff;border-top:1px solid #eee;display:flex;padding:8px 0;padding-bottom:max(8px,env(safe-area-inset-bottom));z-index:200;}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;text-decoration:none;padding:4px 0;}
.tab svg{width:22px;height:22px;stroke:#ccc;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.tab span{font-size:.55rem;font-weight:700;color:#ccc;text-transform:uppercase;}
.tab.active svg{stroke:var(--G2);}
.tab.active span{color:var(--G2);}
.tab-rel{position:relative;}
.tab-badge{position:absolute;top:-2px;right:6px;background:var(--R);color:#fff;font-size:.5rem;font-weight:800;width:14px;height:14px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:1.5px solid #fff;}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%) translateY(20px);background:#111;color:#fff;padding:10px 20px;border-radius:24px;font-size:.8rem;font-weight:600;opacity:0;transition:.3s;pointer-events:none;z-index:2000;white-space:nowrap;}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>

<div class="header">
  <div class="hRow">
    <button class="back-btn" onclick="history.back()"><svg viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg></button>
    <div style="flex:1;">
      <div class="cat-tit" id="cat-tit">Cargando...</div>
      <div class="cat-count" id="cat-count">—</div>
    </div>
  </div>
  <div class="search-box">
    <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
    <input type="text" id="search-input" placeholder="Buscar en esta categoría..." oninput="filtrarBusqueda(this.value)">
  </div>
</div>

<div class="subcats-scroll" id="subcats-wrap" style="background:#fff;padding:10px 14px;border-bottom:1px solid #eee;"></div>

<div class="filtros-row">
  <div class="filtro-chip" id="f-precio" onclick="toggleFiltro('precio',this)">💲 Precio</div>
  <div class="filtro-chip" id="f-nuevo" onclick="toggleFiltro('nuevo',this)">✨ Más recientes</div>
  <div class="filtro-chip" id="f-vendidos" onclick="toggleFiltro('vendidos',this)">🔥 Más vendidos</div>
</div>

<div class="content">
  <div class="prods-grid" id="prods-grid">
    <div style="grid-column:1/-1;text-align:center;padding:40px;color:#bbb;font-size:0.82rem;">Cargando productos...</div>
  </div>
  <button class="load-more" id="btn-mas" onclick="cargarMas()" style="display:none;">Ver más productos</button>
</div>

<nav class="tab-bar">
  <a class="tab" href="dashboard.html"><svg viewBox="0 0 24 24"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg><span>Inicio</span></a>
  <a class="tab active"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg><span>Explorar</span></a>
  <a class="tab" href="chat.html"><svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg><span>Chat</span></a>
  <a class="tab tab-rel" href="carrito.html"><svg viewBox="0 0 24 24"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg><span>Carrito</span><div class="tab-badge" id="carrito-badge" style="display:none;">0</div></a>
  <a class="tab" href="perfil-emprendedor.html"><svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg><span>Perfil</span></a>
</nav>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const {createClient}=supabase;
const sb=createClient('https://hfmsyrmkewscnvwynzfq.supabase.co','sb_publishable_d1oLsq70a6ZV33vW3XkRgw_nYcN2Z9v');
const QS=new URLSearchParams(location.search);

const catNombre=decodeURIComponent(QS.get('cat')||'');
const subcatInicial=decodeURIComponent(QS.get('subcat')||'');

let todosProductos=[],filtrados=[],subcatActiva='Todas',mostrarHasta=12,filtroActivo=null;

const colorCat=c=>{const m={'Ropa':'#FF8C00','Tecnolog':'#007AFF','Alimento':'#22C55E','Belleza':'#FF69B4','Deporte':'#A855F7','Hogar':'#F59E0B'};for(const k in m){if((c||'').includes(k))return m[k];}return '#888';};
const emojiCat=c=>{const m={'Ropa':'👗','Tecnolog':'📱','Alimento':'🛒','Belleza':'💄','Deporte':'⚽','Hogar':'🏠','Joya':'💍'};for(const k in m){if((c||'').includes(k))return m[k];}return '📦';};

// Badge carrito
const carrito=JSON.parse(localStorage.getItem('carrito_proveed')||'[]');
const cnt=carrito.reduce((s,i)=>s+(i.cantidad||1),0);
if(cnt>0){const b=document.getElementById('carrito-badge');b.style.display='flex';b.textContent=cnt>9?'9+':cnt;}

(async()=>{
  if(!catNombre){
    document.getElementById('cat-tit').textContent='Categoría no especificada';
    return;
  }
  document.getElementById('cat-tit').textContent=catNombre;

  // Traer TODOS los productos activos de esta categoría
  const {data,error}=await sb.from('productos').select('*').eq('activo',true).eq('categoria',catNombre).order('created_at',{ascending:false});

  if(error){
    document.getElementById('prods-grid').innerHTML=`<div style="grid-column:1/-1;text-align:center;padding:40px;color:#bbb;">Error: ${error.message}</div>`;
    return;
  }

  todosProductos=data||[];
  document.getElementById('cat-count').textContent=`${todosProductos.length} producto${todosProductos.length!==1?'s':''} disponible${todosProductos.length!==1?'s':''}`;

  renderSubcats();
  if(subcatInicial){
    seleccionarSubcat(subcatInicial);
  } else {
    aplicarFiltros();
  }
})();

function renderSubcats(){
  const subSet=new Set();
  todosProductos.forEach(p=>{if(p.subcategoria&&p.subcategoria.trim())subSet.add(p.subcategoria.trim());});
  const subs=['Todas',...Array.from(subSet).sort()];
  const w=document.getElementById('subcats-wrap');
  w.innerHTML='';
  subs.forEach(s=>{
    const chip=document.createElement('div');
    chip.className='subcat-chip'+(s===subcatActiva?' active':'');
    chip.dataset.sub=s;
    chip.textContent=s;
    chip.onclick=()=>seleccionarSubcat(s);
    w.appendChild(chip);
  });
}

function seleccionarSubcat(sub){
  subcatActiva=sub;
  document.querySelectorAll('.subcat-chip').forEach(c=>c.classList.toggle('active',c.dataset.sub===sub));
  mostrarHasta=12;
  aplicarFiltros();
}

window.toggleFiltro=function(tipo,el){
  if(filtroActivo===tipo){
    filtroActivo=null;
    el.classList.remove('active');
  } else {
    document.querySelectorAll('.filtro-chip').forEach(c=>c.classList.remove('active'));
    filtroActivo=tipo;
    el.classList.add('active');
  }
  mostrarHasta=12;
  aplicarFiltros();
};

function aplicarFiltros(){
  let lista=subcatActiva==='Todas'?[...todosProductos]:todosProductos.filter(p=>(p.subcategoria||'').trim()===subcatActiva);

  if(filtroActivo==='precio'){
    lista.sort((a,b)=>(a.precio||0)-(b.precio||0));
  } else if(filtroActivo==='nuevo'){
    lista.sort((a,b)=>new Date(b.created_at||0)-new Date(a.created_at||0));
  } else if(filtroActivo==='vendidos'){
    lista.sort((a,b)=>(b.vendidos||0)-(a.vendidos||0));
  }

  filtrados=lista;
  renderGrid();
}

window.filtrarBusqueda=function(q){
  if(!q.trim()){aplicarFiltros();return;}
  const ql=q.toLowerCase();
  filtrados=todosProductos.filter(p=>(p.nombre||'').toLowerCase().includes(ql)||(p.subcategoria||'').toLowerCase().includes(ql)||(p.nombre_proveedor||'').toLowerCase().includes(ql));
  mostrarHasta=12;
  renderGrid();
};

function renderGrid(){
  const grid=document.getElementById('prods-grid');
  const btnMas=document.getElementById('btn-mas');

  if(!filtrados.length){
    grid.innerHTML=`<div class="empty-cat" style="grid-column:1/-1;"><p>Sin productos en esta categoría</p></div>`;
    btnMas.style.display='none';
    return;
  }

  const visibles=filtrados.slice(0,mostrarHasta);
  grid.innerHTML='';
  const color=colorCat(catNombre);

  visibles.forEach(p=>{
    const img=p.imagenes?.[0]||p.imagen||'';
    const d=document.createElement('div');
    d.className='prod-card';
    d.onclick=()=>irProducto(p.id);
    d.innerHTML=`
      <div class="prod-img" style="background:${color}10;">
        ${img?`<img src="${img}" loading="lazy">`:`<div class="prod-img-ico">${emojiCat(p.subcategoria||catNombre)}</div>`}
        <div class="prod-badge" style="background:${color};">${(p.subcategoria||p.categoria||'General').slice(0,10).toUpperCase()}</div>
        ${p.verificado?`<div class="prod-verif">✓ Verif.</div>`:''}
      </div>
      <div class="prod-body">
        <div class="prod-nombre">${p.nombre||'Producto'}</div>
        <div class="prod-precio-row"><span class="prod-precio">$${Number(p.precio||0).toFixed(2)}</span></div>
        <div class="prod-min">Pedido mín: ${p.minimo||1} ${p.unidad||'unidad'}</div>
        <div class="prod-prov-row"><span class="prod-prov">${p.nombre_proveedor||'Proveedor'}</span></div>
        <div class="prod-footer">
          <span class="prod-vendidos">${p.vendidos?p.vendidos+' vendidos':'Nuevo'}</span>
          <button class="prod-add" onclick="addCarrito(event,'${p.id}','${(p.nombre||'').replace(/'/g,'')}',${p.precio||0},'${img}','${p.proveedor_id||''}')">
            <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          </button>
        </div>
      </div>`;
    grid.appendChild(d);
  });

  btnMas.style.display=mostrarHasta<filtrados.length?'block':'none';
}

window.cargarMas=function(){
  mostrarHasta+=12;
  renderGrid();
};

// Solo aquí, al tocar un producto específico, se abre producto.html
function irProducto(id){
  location.href=`producto.html?id=${id}`;
}

window.addCarrito=function(e,id,nombre,precio,imagen,provId){
  e.stopPropagation();
  const c=JSON.parse(localStorage.getItem('carrito_proveed')||'[]');
  const idx=c.findIndex(i=>i.id===id);
  if(idx>=0)c[idx].cantidad=(c[idx].cantidad||1)+1;
  else c.push({id,nombre,precio,imagen,cantidad:1,proveedor_id:provId});
  localStorage.setItem('carrito_proveed',JSON.stringify(c));
  const n=c.reduce((s,i)=>s+(i.cantidad||1),0);
  const b=document.getElementById('carrito-badge');
  b.style.display='flex';b.textContent=n>9?'9+':n;
  showToast('✓ Agregado al carrito');
};

function showToast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),2200);}
</script>
</body>
</html>
