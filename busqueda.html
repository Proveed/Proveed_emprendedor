<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<link rel="manifest" href="/manifest.json">

<meta name="mobile-web-app-capable" content="yes">

<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
:root{--acc:#FF8C00;--verde:#A8E63D;--negro:#0F0F0F;--gris:#F5F5F5;}
body{background:var(--gris);font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;padding-bottom:80px;}

.search-top{background:white;padding:48px 14px 14px;border-bottom:1px solid #eee;}
.search-box{display:flex;align-items:center;gap:10px;background:#F0F0F0;border-radius:28px;padding:10px 16px;}
.search-box svg{width:18px;height:18px;stroke:#999;fill:none;stroke-width:2.5;flex-shrink:0;}
.search-box input{flex:1;background:transparent;border:none;outline:none;font-family:'Inter',sans-serif;font-size:0.92rem;color:#111;}
.search-box input::placeholder{color:#aaa;}
.cam-btn{width:36px;height:36px;background:#111;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;border:none;cursor:pointer;position:relative;overflow:hidden;}
.cam-btn svg{width:17px;height:17px;stroke:white;fill:none;stroke-width:2;}
.cam-btn input{position:absolute;inset:0;opacity:0;cursor:pointer;}

/* IMAGEN BUSCADA */
.img-preview-wrap{display:none;background:white;border-bottom:1px solid #eee;padding:12px 14px;}
.img-preview-wrap.show{display:flex;gap:12px;align-items:flex-start;}
.img-preview-thumb{width:70px;height:70px;border-radius:14px;object-fit:cover;flex-shrink:0;border:2px solid var(--acc);}
.img-preview-info{flex:1;}
.img-preview-titulo{font-size:0.82rem;font-weight:700;color:#111;margin-bottom:4px;}
.img-preview-sub{font-size:0.72rem;color:#aaa;}
.img-preview-tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px;}
.img-tag{font-size:0.62rem;font-weight:700;padding:2px 8px;border-radius:10px;background:#F0F0F0;color:#555;}
.img-tag.acc{background:rgba(255,140,0,0.12);color:var(--acc);}
.btn-limpiar{padding:5px 12px;border-radius:20px;border:1px solid #eee;background:transparent;font-family:'Inter',sans-serif;font-size:0.7rem;font-weight:700;cursor:pointer;color:#aaa;}

/* TABS */
.tabs-row{display:flex;gap:0;background:white;border-bottom:1px solid #eee;overflow-x:auto;scrollbar-width:none;padding:0 14px;}
.tabs-row::-webkit-scrollbar{display:none;}
.tab-btn{padding:12px 16px;border:none;background:transparent;font-family:'Inter',sans-serif;font-size:0.76rem;font-weight:700;color:#aaa;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;}
.tab-btn.active{color:#111;border-bottom-color:var(--acc);}

/* FILTROS */
.filtros-row{display:flex;gap:8px;padding:12px 14px 8px;overflow-x:auto;scrollbar-width:none;background:white;}
.filtros-row::-webkit-scrollbar{display:none;}
.filt{padding:7px 14px;border-radius:20px;border:1.5px solid #eee;background:white;font-family:'Inter',sans-serif;font-size:0.72rem;font-weight:600;color:#555;cursor:pointer;white-space:nowrap;}
.filt.on{border-color:var(--acc);color:var(--acc);background:rgba(255,140,0,0.06);}

/* LOADING IA */
.ia-loading{display:none;text-align:center;padding:30px;background:white;margin:12px;border-radius:20px;border:1px solid #eee;}
.ia-loading.show{display:block;}
.ia-spinner{width:44px;height:44px;border-radius:50%;border:3px solid #eee;border-top-color:var(--acc);animation:spin 0.7s linear infinite;margin:0 auto 12px;}
@keyframes spin{to{transform:rotate(360deg);}}
.ia-txt{font-size:0.82rem;font-weight:700;color:#333;}
.ia-sub{font-size:0.7rem;color:#bbb;margin-top:4px;}

/* PRODS COUNT */
.prods-meta{padding:10px 14px 6px;display:flex;align-items:center;justify-content:space-between;}
.prods-count-txt{font-size:0.72rem;color:#aaa;font-weight:600;}
.orden-select{padding:6px 12px;border-radius:20px;border:1.5px solid #eee;background:white;font-family:'Inter',sans-serif;font-size:0.72rem;font-weight:600;color:#555;outline:none;-webkit-appearance:none;}

/* PRODS GRID */
.prods-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:4px 14px 14px;}
.prod-card{background:white;border-radius:16px;overflow:hidden;cursor:pointer;border:1px solid #eee;transition:0.15s;}
.prod-card:active{transform:scale(0.97);}
.prod-card.similar{border-color:rgba(168,230,61,0.4);box-shadow:0 0 0 2px rgba(168,230,61,0.15);}
.prod-img{width:100%;height:145px;object-fit:cover;background:#f5f5f5;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;}
.prod-img img{width:100%;height:100%;object-fit:cover;}
.prod-img-emoji{font-size:3rem;}
.prod-cat-badge{position:absolute;top:7px;left:7px;font-size:0.56rem;font-weight:800;padding:3px 7px;border-radius:20px;text-transform:uppercase;color:white;}
.prod-similar-badge{position:absolute;top:7px;right:7px;font-size:0.56rem;font-weight:800;padding:3px 7px;border-radius:20px;background:var(--verde);color:#111;}
.prod-play{position:absolute;top:7px;right:7px;width:24px;height:24px;background:rgba(0,0,0,0.5);border-radius:50%;display:flex;align-items:center;justify-content:center;}
.prod-play svg{width:10px;height:10px;fill:white;}
.prod-body{padding:10px;}
.prod-id{font-size:0.55rem;color:#ccc;font-family:monospace;margin-bottom:2px;}
.prod-nombre{font-size:0.82rem;font-weight:700;color:#111;margin-bottom:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.3;}
.prod-proveedor{font-size:0.64rem;color:#aaa;margin-bottom:5px;}
.prod-row{display:flex;align-items:center;justify-content:space-between;}
.prod-precio{font-size:0.98rem;font-weight:900;color:var(--acc);}
.prod-min{font-size:0.6rem;color:#bbb;}
.prod-add-btn{width:28px;height:28px;background:#111;border-radius:8px;display:flex;align-items:center;justify-content:center;border:none;cursor:pointer;flex-shrink:0;}
.prod-add-btn svg{width:13px;height:13px;stroke:white;fill:none;stroke-width:2.5;}

/* EMPTY */
.empty-state{text-align:center;padding:50px 20px;}
.empty-state .e-ico{font-size:3rem;margin-bottom:12px;}
.empty-state p{font-size:0.82rem;color:#bbb;font-weight:600;}

/* TAB BAR */
.tab-bar{position:fixed;bottom:0;width:100%;background:white;border-top:1px solid #eee;display:flex;padding:8px 0 18px;z-index:200;}
.nav-tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;border:none;background:transparent;cursor:pointer;text-decoration:none;font-family:'Inter',sans-serif;}
.nav-tab svg{width:22px;height:22px;stroke:#bbb;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.nav-tab span{font-size:0.58rem;font-weight:700;color:#bbb;text-transform:uppercase;}
.nav-tab.active svg{stroke:#111;}
.nav-tab.active span{color:#111;}

.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%) translateY(20px);background:#111;color:white;padding:10px 20px;border-radius:24px;font-size:0.8rem;font-weight:600;opacity:0;transition:0.3s;pointer-events:none;z-index:2000;white-space:nowrap;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>

<!-- SEARCH TOP -->
<div class="search-top">
  <div class="search-box">
    <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
    <input type="text" id="txt-search" placeholder="Buscar productos..." oninput="buscarTexto(this.value)">
    <button class="cam-btn" title="Buscar por imagen">
      <svg viewBox="0 0 24 24"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 0 2-2l2-3h10l2 3a2 2 0 0 0 2 2z"/><circle cx="12" cy="13" r="4"/></svg>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const { createClient } = supabase;
const sb = createClient('https://hfmsyrmkewscnvwynzfq.supabase.co','sb_publishable_d1oLsq70a6ZV33vW3XkRgw_nYcN2Z9v');

let productos=[], productosFiltrados=[], tabActiva='todos', ordenActivo='recientes', busqImg=null, tagsDetectados=[];

const CAT_COLORS={'Ropa':'#FF8C00','Textil':'#FF8C00','Vestido':'#FF8C00','Tecnolog':'#007AFF','Electr':'#007AFF','Alimento':'#22C55E','Comida':'#22C55E','Belleza':'#FF69B4','Cosmé':'#FF69B4','Deporte':'#A855F7','Hogar':'#F59E0B','Joyería':'#EF4444','Bolsa':'#EC4899','Mascota':'#14B8A6','Juguete':'#8B5CF6'};
const CAT_EMOJIS={'Ropa':'👗','Vestido':'👗','Camiseta':'👕','Calzado':'👟','Joya':'💍','Tecnolog':'📱','Alimento':'🛒','Belleza':'💄','Deporte':'⚽','Hogar':'🏠','Mueble':'🛋️','Juguete':'🧸','Mascota':'🐾'};

function colorCat(cat){ for(const k in CAT_COLORS){ if((cat||'').includes(k)) return CAT_COLORS[k]; } return '#888'; }
function emojiCat(cat){ for(const k in CAT_EMOJIS){ if((cat||'').includes(k)) return CAT_EMOJIS[k]; } return '📦'; }

(async()=>{
  const { data } = await sb.from('productos').select('*').eq('activo',true).order('created_at',{ascending:false}).limit(200);
  productos=data||[];
  aplicarFiltros();
})();

function aplicarFiltros(){
  let lista=[...productos];
  if(tabActiva!=='todos') lista=lista.filter(p=>(p.categoria||'').toLowerCase().includes(tabActiva.toLowerCase()));
  const txt=document.getElementById('txt-search').value.trim().toLowerCase();
  if(txt) lista=lista.filter(p=>(p.nombre||'').toLowerCase().includes(txt)||(p.categoria||'').toLowerCase().includes(txt)||(p.descripcion||'').toLowerCase().includes(txt)||(p.nombre_proveedor||'').toLowerCase().includes(txt));
  if(busqImg&&tagsDetectados.length){
    const similares=lista.filter(p=>tagsDetectados.some(t=>(p.nombre||'').toLowerCase().includes(t.toLowerCase())||(p.categoria||'').toLowerCase().includes(t.toLowerCase())||(p.tags||[]).some(tag=>tag.toLowerCase().includes(t.toLowerCase()))));
    const noSimilares=lista.filter(p=>!similares.includes(p));
    lista=[...similares.map(p=>({...p,_similar:true})),...noSimilares];
  }
  if(ordenActivo==='menor') lista=[...lista].sort((a,b)=>(a.precio||0)-(b.precio||0));
  else if(ordenActivo==='mayor') lista=[...lista].sort((a,b)=>(b.precio||0)-(a.precio||0));
  productosFiltrados=lista;
  renderGrid();
}

function renderGrid(){
  const grid=document.getElementById('prods-grid');
  const count=document.getElementById('prods-count');
  count.textContent=`${productosFiltrados.length} producto${productosFiltrados.length!==1?'s':''} encontrado${productosFiltrados.length!==1?'s':''}`;
  grid.innerHTML='';
  if(!productosFiltrados.length){
    grid.innerHTML=`<div class="empty-state" style="grid-column:1/-1;"><div class="e-ico">🔍</div><p>Sin resultados<br>Intenta con otra búsqueda o imagen</p></div>`;
    return;
  }
  productosFiltrados.forEach(p=>{
    const card=document.createElement('div');
    card.className='prod-card'+(p._similar?' similar':'');
    card.onclick=()=>window.location.href=`producto.html?id=${p.id}`;
    const img=p.imagenes?.[0]||p.imagen||'';
    const color=colorCat(p.categoria||'');
    const shortId=p.id?.slice(-6)?.toUpperCase()||'------';
    card.innerHTML=`
      <div class="prod-img" style="background:${color}15;">
        ${img?`<img src="${img}" alt="${p.nombre||''}" loading="lazy">`:`<span class="prod-img-emoji">${emojiCat(p.categoria||'')}</span>`}
        <div class="prod-cat-badge" style="background:${color};">${(p.categoria||'General').toUpperCase().slice(0,10)}</div>
        ${p._similar?`<div class="prod-similar-badge">✓ Similar</div>`:''}
        ${p.video_url?`<div class="prod-play"><svg viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3" fill="white"/></svg></div>`:''}
      </div>
      <div class="prod-body">
        <div class="prod-id">ID-${shortId}</div>
        <div class="prod-nombre">${p.nombre||'Producto'}</div>
        <div class="prod-proveedor">${p.nombre_proveedor||p.proveedor||'Proveedor'}</div>
        <div class="prod-row">
          <div>
            <div class="prod-precio">$${Number(p.precio||0).toFixed(2)}</div>
            <div class="prod-min">Mín: ${p.minimo||1} ${p.unidad||'und'}</div>
          </div>
          <button class="prod-add-btn" onclick="agregarCarrito(event,'${p.id}','${(p.nombre||'').replace(/'/g,'')}',${p.precio||0})">
            <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          </button>
        </div>
      </div>`;
    grid.appendChild(card);
  });
}

// =============================================
// BÚSQUEDA POR IMAGEN CON IA
// =============================================
async function buscarPorImagen(input){
  const file=input.files[0]; if(!file) return;
  busqImg=file;
  const reader=new FileReader();
  reader.onload=async(e)=>{
    const base64=e.target.result;
    // Mostrar preview
    document.getElementById('img-thumb').src=base64;
    document.getElementById('img-titulo').textContent='Analizando imagen con IA...';
    document.getElementById('img-sub').textContent='Identificando producto, color y categoría';
    document.getElementById('img-tags').innerHTML='';
    document.getElementById('img-preview-wrap').classList.add('show');
    document.getElementById('ia-loading').classList.add('show');

    try{
      // Llamar a Claude API para analizar la imagen
      const response=await fetch('https://api.anthropic.com/v1/messages',{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({
          model:'claude-sonnet-4-20250514',
          max_tokens:400,
          messages:[{
            role:'user',
            content:[
              {
                type:'image',
                source:{type:'base64',media_type:file.type||'image/jpeg',data:base64.split(',')[1]}
              },
              {
                type:'text',
                text:`Analiza esta imagen de producto para una plataforma mayorista latinoamericana. Responde SOLO en JSON sin backticks ni texto adicional con esta estructura exacta: {"nombre":"nombre del producto en español","categoria":"una de: Ropa de mujer|Ropa de hombre|Calzado|Joyería y accesorios|Tecnología|Alimentos|Belleza|Hogar|Deporte|Juguetes|Mascotas|Bolsas|Moda infantil|Herramientas|Automotriz|Electrodomésticos|Otro","subcategoria":"subcategoría específica","tags":["tag1","tag2","tag3","tag4","tag5"],"color":"color principal","material":"material si se puede identificar","descripcion":"descripción breve para búsqueda"}`
              }
            ]
          }]
        })
      });
      const data=await response.json();
      const txt=data.content?.[0]?.text||'{}';
      let info={};
      try{ info=JSON.parse(txt); } catch(e){ info={nombre:'Producto',categoria:'Otro',tags:[]}; }

      tagsDetectados=[
        info.nombre||'',
        info.categoria||'',
        info.subcategoria||'',
        info.color||'',
        info.material||'',
        ...(info.tags||[])
      ].filter(Boolean);

      document.getElementById('img-titulo').textContent=info.nombre||'Producto identificado';
      document.getElementById('img-sub').textContent=`${info.categoria||'—'} · ${info.color||''} · ${info.material||''}`;

      const tagsEl=document.getElementById('img-tags');
      tagsEl.innerHTML='';
      tagsDetectados.slice(0,6).forEach(t=>{
        if(!t) return;
        const span=document.createElement('span');
        span.className='img-tag acc';
        span.textContent=t;
        tagsEl.appendChild(span);
      });

      // Guardar imagen en banco para futuras búsquedas
      guardarImagenBusqueda(base64,info);

    } catch(err){
      document.getElementById('img-titulo').textContent='Imagen cargada';
      document.getElementById('img-sub').textContent='Mostrando productos disponibles';
      tagsDetectados=[];
    }

    document.getElementById('ia-loading').classList.remove('show');
    aplicarFiltros();
  };
  reader.readAsDataURL(file);
}

async function guardarImagenBusqueda(base64,info){
  try{
      // Subir imagen al storage
    const { data:{session} } = await sb.auth.getSession();
    if(!session) return;
    const path=`busquedas/${session.user.id}/${Date.now()}.jpg`;
    const blob=await fetch(base64).then(r=>r.blob());
    const { data:up } = await sb.storage.from('proveed-media').upload(path,blob,{upsert:true});
    if(up){
      const { data:urlData } = sb.storage.from('proveed-media').getPublicUrl(path);
      // Guardar en historial (tabla opcional)
    }
  } catch(e){}
}

function buscarTexto(q){
  busqImg=null; tagsDetectados=[];
  document.getElementById('img-preview-wrap').classList.remove('show');
  aplicarFiltros();
}

function limpiarBusqueda(){
  busqImg=null; tagsDetectados=[];
  document.getElementById('img-preview-wrap').classList.remove('show');
  document.getElementById('txt-search').value='';
  aplicarFiltros();
}

function cambiarTab(tab,el){
  tabActiva=tab;
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  el.classList.add('active');
  aplicarFiltros();
}

function ordenar(tipo,el){
  ordenActivo=tipo;
  document.querySelectorAll('.filt').forEach(b=>b.classList.remove('on'));
  el.classList.add('on');
  aplicarFiltros();
}

function agregarCarrito(e,id,nombre,precio){
  e.stopPropagation();
  const carrito=JSON.parse(localStorage.getItem('carrito_proveed')||'[]');
  const idx=carrito.findIndex(i=>i.id===id);
  if(idx>=0) carrito[idx].cantidad=(carrito[idx].cantidad||1)+1;
  else carrito.push({id,nombre,precio,cantidad:1});
  localStorage.setItem('carrito_proveed',JSON.stringify(carrito));
  const btn=e.currentTarget;
  btn.style.background='var(--verde)'; btn.style.transition='0.3s';
  setTimeout(()=>btn.style.background='#111',500);
  showToast('✓ Agregado al carrito');
}

function showToast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2000); }
</script>
</body>
</html>
