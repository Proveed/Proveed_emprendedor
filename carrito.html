<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>PROVEED — Carrito</title>
<meta name="theme-color" content="#ffffff">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
:root{--G:#A8E63D;--G2:#7BC234;--F:#F5F6F2;--O:#FF8C00;--R:#FF4D4D;}
body{background:var(--F);font-family:'Inter',sans-serif;padding-bottom:100px;}

.topbar{background:#fff;padding:44px 16px 14px;border-bottom:2.5px solid var(--G);position:sticky;top:0;z-index:100;}
.topbar-tit{font-size:1rem;font-weight:900;color:#111;}
.topbar-tit b{color:var(--G2);}
.topbar-sub{font-size:0.7rem;color:#aaa;margin-top:2px;}

/* DIRECCIÓN */
.dir-card{background:#fff;border-radius:16px;padding:14px 16px;margin:14px 16px;border:1px solid #eee;display:flex;align-items:center;gap:12px;cursor:pointer;}
.dir-card:active{background:var(--F);}
.dir-ico{width:36px;height:36px;border-radius:10px;background:rgba(168,230,61,.1);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.dir-ico svg{width:16px;height:16px;stroke:var(--G2);fill:none;stroke-width:2;}
.dir-info{flex:1;min-width:0;}
.dir-lbl{font-size:0.6rem;font-weight:700;color:#aaa;text-transform:uppercase;margin-bottom:3px;}
.dir-val{font-size:0.84rem;font-weight:600;color:#111;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.dir-sub{font-size:0.66rem;color:#aaa;margin-top:2px;}
.dir-edit{font-size:0.68rem;font-weight:700;color:var(--G2);flex-shrink:0;}
.dir-temporal-badge{display:inline-block;background:rgba(255,140,0,.1);color:var(--O);font-size:0.58rem;font-weight:700;padding:2px 7px;border-radius:20px;margin-top:3px;}

/* ITEMS */
.sec-tit{font-size:0.65rem;font-weight:800;color:#aaa;text-transform:uppercase;letter-spacing:1px;padding:0 16px;margin-bottom:10px;}
.item-card{background:#fff;border-radius:16px;padding:12px 14px;margin:0 16px 8px;border:1px solid #eee;display:flex;align-items:center;gap:12px;}
.item-img{width:56px;height:56px;border-radius:12px;background:var(--F);overflow:hidden;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:1.4rem;}
.item-img img{width:100%;height:100%;object-fit:cover;}
.item-info{flex:1;min-width:0;}
.item-nom{font-size:0.82rem;font-weight:700;color:#111;margin-bottom:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.3;}
.item-prov{font-size:0.62rem;color:#aaa;margin-bottom:6px;}
.item-footer{display:flex;align-items:center;justify-content:space-between;}
.item-precio{font-size:0.88rem;font-weight:900;color:var(--O);}
.cant-row{display:flex;align-items:center;gap:8px;}
.cant-btn{width:26px;height:26px;border-radius:8px;background:var(--F);border:1px solid #eee;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:0.9rem;font-weight:700;color:#111;}
.cant-num{font-size:0.84rem;font-weight:800;color:#111;min-width:20px;text-align:center;}
.item-del{width:28px;height:28px;background:rgba(255,77,77,.06);border-radius:8px;display:flex;align-items:center;justify-content:center;border:none;cursor:pointer;flex-shrink:0;}
.item-del svg{width:13px;height:13px;stroke:var(--R);fill:none;stroke-width:2.5;}

/* RESUMEN */
.resumen-card{background:#fff;border-radius:16px;margin:14px 16px;border:1px solid #eee;overflow:hidden;}
.res-row{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid #f5f5f5;}
.res-row:last-child{border:none;}
.res-lbl{font-size:0.8rem;color:#666;}
.res-val{font-size:0.88rem;font-weight:700;color:#111;}
.res-total{font-size:1rem;font-weight:900;color:var(--O);}

.empty-cart{text-align:center;padding:60px 20px;}
.empty-cart p{font-size:0.9rem;color:#bbb;margin-bottom:16px;line-height:1.7;}
.empty-cart a{padding:12px 24px;background:var(--G);color:#111;border-radius:24px;font-family:'Inter',sans-serif;font-size:0.84rem;font-weight:700;text-decoration:none;display:inline-block;}

/* BOTTOM */
.bottom-bar{position:fixed;bottom:0;width:100%;background:#fff;border-top:1px solid #eee;padding:12px 16px;padding-bottom:max(12px,env(safe-area-inset-bottom));z-index:200;}
.btn-pagar{width:100%;padding:15px;background:var(--G);color:#111;border:none;border-radius:14px;font-family:'Inter',sans-serif;font-size:0.96rem;font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;}
.btn-pagar:disabled{background:#e0e0e0;color:#aaa;cursor:not-allowed;}

/* MODAL DIRECCIÓN */
.modOv{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:flex-end;z-index:500;}
.modOv.on{display:flex;}
.modSh{background:#fff;width:100%;border-radius:24px 24px 0 0;transform:translateY(100%);transition:.4s cubic-bezier(.16,1,.3,1);max-height:92vh;display:flex;flex-direction:column;overflow:hidden;}
.modOv.on .modSh{transform:translateY(0);}
.drag{width:36px;height:4px;background:#e0e0e0;border-radius:4px;margin:14px auto 0;flex-shrink:0;}
.modH{padding:12px 16px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #eee;flex-shrink:0;}
.modT{font-size:0.95rem;font-weight:800;color:#111;}
.modX{width:28px;height:28px;background:var(--F);border-radius:8px;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.modX svg{width:13px;height:13px;stroke:#555;fill:none;stroke-width:2.5;}
.modB{overflow-y:auto;padding:16px;flex:1;}
.inp-wrap{margin-bottom:12px;}
.inp-wrap label{display:block;font-size:0.62rem;font-weight:700;color:#aaa;text-transform:uppercase;margin-bottom:5px;}
.inp-wrap input{width:100%;padding:12px 14px;background:var(--F);border:1.5px solid #eee;border-radius:12px;font-family:'Inter',sans-serif;font-size:0.9rem;color:#111;outline:none;}
.inp-wrap input:focus{border-color:var(--G);}
.inp-wrap input[readonly]{color:#aaa;background:#f9f9f9;}
.dir-nota{background:rgba(0,122,255,.06);border:1px solid rgba(0,122,255,.15);border-radius:12px;padding:10px 14px;font-size:0.72rem;color:#007AFF;font-weight:600;margin-bottom:12px;line-height:1.5;}
.btn-mod{width:100%;padding:13px;background:var(--G);color:#111;border:none;border-radius:13px;font-family:'Inter',sans-serif;font-size:0.9rem;font-weight:800;cursor:pointer;margin-top:6px;}
.btn-mod.rojo{background:rgba(255,77,77,.1);color:var(--R);margin-top:8px;}

.tab-bar{position:fixed;bottom:0;width:100%;background:#fff;border-top:1px solid #eee;display:flex;padding:8px 0;padding-bottom:max(8px,env(safe-area-inset-bottom));z-index:200;}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;text-decoration:none;padding:4px 0;}
.tab svg{width:22px;height:22px;stroke:#ccc;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.tab span{font-size:.55rem;font-weight:700;color:#ccc;text-transform:uppercase;}
.tab.active svg{stroke:var(--G2);}
.tab.active span{color:var(--G2);}
.tab-rel{position:relative;}
.tab-badge{position:absolute;top:-2px;right:6px;background:var(--R);color:#fff;font-size:.5rem;font-weight:800;width:14px;height:14px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:1.5px solid #fff;}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%) translateY(20px);background:#111;color:#fff;padding:10px 20px;border-radius:24px;font-size:.8rem;font-weight:600;opacity:0;transition:.3s;pointer-events:none;z-index:2000;white-space:nowrap;}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-tit">PRO<b>VEED</b> · Carrito</div>
  <div class="topbar-sub" id="topbar-sub">0 productos</div>
</div>

<!-- DIRECCIÓN DE ENTREGA -->
<div class="dir-card" onclick="abrirDirModal()">
  <div class="dir-ico"><svg viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg></div>
  <div class="dir-info">
    <div class="dir-lbl">Dirección de entrega</div>
    <div class="dir-val" id="dir-display">Cargando...</div>
    <div id="dir-temp-badge" style="display:none;"><span class="dir-temporal-badge">📍 Dirección temporal</span></div>
    <div class="dir-sub" id="dir-destinatario-show"></div>
  </div>
  <span class="dir-edit">Cambiar →</span>
</div>

<div class="sec-tit" style="margin-top:6px;">Productos en el carrito</div>
<div id="items-wrap"></div>

<div id="resumen-wrap"></div>

<!-- MODAL DIRECCIÓN -->
<div class="modOv" id="modDir" onclick="cmodal(event)">
  <div class="modSh"><div class="drag"></div>
    <div class="modH"><span class="modT">📍 Dirección de entrega</span><button class="modX" onclick="cerrarDirModal()"><svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button></div>
    <div class="modB">
      <div class="dir-nota">ℹ️ Tu dirección principal no se modifica. Esta dirección solo aplica para este pedido.</div>
      <div class="inp-wrap"><label>Dirección principal guardada</label><input type="text" id="dir-principal-show" readonly></div>
      <div class="inp-wrap"><label>Dirección para esta entrega</label><input type="text" id="dir-temp-inp" placeholder="Calle, número, sector, referencias..."></div>
      <div class="inp-wrap"><label>Nombre del destinatario (si es otra persona)</label><input type="text" id="dir-dest-inp" placeholder="Nombre completo"></div>
      <div class="inp-wrap"><label>Teléfono de contacto</label><input type="tel" id="dir-tel-inp" placeholder="0987654321"></div>
      <button class="btn-mod" onclick="guardarDirTemporal()">✓ Usar esta dirección</button>
      <button class="btn-mod rojo" onclick="usarDirPrincipal()">↩ Volver a mi dirección principal</button>
    </div>
  </div>
</div>

<nav class="tab-bar">
  <a class="tab" href="dashboard.html"><svg viewBox="0 0 24 24"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg><span>Inicio</span></a>
  <a class="tab" href="explorar.html"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg><span>Explorar</span></a>
  <a class="tab" href="chat.html"><svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg><span>Chat</span></a>
  <a class="tab tab-rel active"><svg viewBox="0 0 24 24"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg><span>Carrito</span></a>
  <a class="tab" href="perfil-emprendedor.html"><svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg><span>Perfil</span></a>
</nav>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const {createClient}=supabase;
const db=createClient('https://hfmsyrmkewscnvwynzfq.supabase.co','sb_publishable_d1oLsq70a6ZV33vW3XkRgw_nYcN2Z9v');
const Q=id=>document.getElementById(id);

let carrito=JSON.parse(localStorage.getItem('carrito_proveed')||'[]');
let uid='',me={},dirTemporal=null;

(async()=>{
  const {data:{session}}=await db.auth.getSession();
  if(session){
    uid=session.user.id;
    const {data:u}=await db.from('usuarios').select('nombre,direccion,telefono,facturacion').eq('id',uid).single();
    if(u)me=u;
  }
  // Cargar dirección temporal guardada
  dirTemporal=JSON.parse(localStorage.getItem('dir_temporal_proveed')||'null');
  mostrarDireccion();
  renderCarrito();
})();

function mostrarDireccion(){
  const dirPrincipal=me.direccion||'Sin dirección guardada en tu perfil';
  Q('dir-principal-show').value=dirPrincipal;

  if(dirTemporal?.direccion){
    // Usar dirección temporal
    Q('dir-display').textContent=dirTemporal.direccion;
    Q('dir-temp-badge').style.display='block';
    Q('dir-destinatario-show').textContent=dirTemporal.destinatario?`Para: ${dirTemporal.destinatario}`:'';
  } else {
    // Usar dirección principal
    Q('dir-display').textContent=dirPrincipal;
    Q('dir-temp-badge').style.display='none';
    Q('dir-destinatario-show').textContent='';
  }
}

function renderCarrito(){
  const w=Q('items-wrap');
  const total=carrito.reduce((s,i)=>s+(i.precio||0)*(i.cantidad||1),0);
  const count=carrito.reduce((s,i)=>s+(i.cantidad||1),0);
  Q('topbar-sub').textContent=`${count} producto${count!==1?'s':''}`;

  if(!carrito.length){
    w.innerHTML='<div class="empty-cart"><p>Tu carrito está vacío.<br>Agrega productos desde el explorador.</p><a href="explorar.html">Explorar productos →</a></div>';
    Q('resumen-wrap').innerHTML='';
    return;
  }

  w.innerHTML='';
  carrito.forEach((item,i)=>{
    const d=document.createElement('div');d.className='item-card';
    d.innerHTML=`
      <div class="item-img">${item.imagen?`<img src="${item.imagen}">`:'📦'}</div>
      <div class="item-info">
        <div class="item-nom">${item.nombre||'Producto'}</div>
        <div class="item-prov">${item.proveedor||''}</div>
        <div class="item-footer">
          <span class="item-precio">$${((item.precio||0)*(item.cantidad||1)).toFixed(2)}</span>
          <div class="cant-row">
            <button class="cant-btn" onclick="cambiarCant(${i},-1)">−</button>
            <span class="cant-num">${item.cantidad||1}</span>
            <button class="cant-btn" onclick="cambiarCant(${i},1)">+</button>
          </div>
        </div>
      </div>
      <button class="item-del" onclick="eliminarItem(${i})"><svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg></button>`;
    w.appendChild(d);
  });

  Q('resumen-wrap').innerHTML=`
    <div class="resumen-card">
      <div class="res-row"><span class="res-lbl">Subtotal (${count} productos)</span><span class="res-val">$${total.toFixed(2)}</span></div>
      <div class="res-row"><span class="res-lbl">Envío</span><span class="res-val" style="color:var(--G2);">A coordinar</span></div>
      <div class="res-row"><span class="res-lbl" style="font-weight:800;">Total</span><span class="res-total">$${total.toFixed(2)}</span></div>
    </div>
    <div style="padding:0 16px;">
      <button class="btn-pagar" onclick="procederPago()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="2.5"><rect x="1" y="4" width="22" height="16" rx="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg>
        Confirmar pedido · $${total.toFixed(2)}
      </button>
    </div>`;
}

window.cambiarCant=function(i,d){
  if(!carrito[i])return;
  carrito[i].cantidad=Math.max(1,(carrito[i].cantidad||1)+d);
  guardar();renderCarrito();
};
window.eliminarItem=function(i){
  carrito.splice(i,1);guardar();renderCarrito();toast('Producto eliminado');
};
function guardar(){localStorage.setItem('carrito_proveed',JSON.stringify(carrito));}

// MODAL DIRECCIÓN
window.abrirDirModal=function(){
  const dirPrincipal=me.direccion||'Sin dirección guardada en tu perfil';
  Q('dir-principal-show').value=dirPrincipal;
  Q('dir-temp-inp').value=dirTemporal?.direccion||'';
  Q('dir-dest-inp').value=dirTemporal?.destinatario||'';
  Q('dir-tel-inp').value=dirTemporal?.telefono||'';
  Q('modDir').classList.add('on');
};
window.cerrarDirModal=()=>Q('modDir').classList.remove('on');
window.cmodal=e=>{if(e.target===Q('modDir'))cerrarDirModal();};

window.guardarDirTemporal=function(){
  const dir=Q('dir-temp-inp').value.trim();
  if(!dir){toast('Escribe una dirección de entrega');return;}
  dirTemporal={direccion:dir,destinatario:Q('dir-dest-inp').value.trim(),telefono:Q('dir-tel-inp').value.trim()};
  localStorage.setItem('dir_temporal_proveed',JSON.stringify(dirTemporal));
  mostrarDireccion();
  cerrarDirModal();
  toast('✓ Dirección de entrega actualizada');
};

window.usarDirPrincipal=function(){
  dirTemporal=null;
  localStorage.removeItem('dir_temporal_proveed');
  mostrarDireccion();
  cerrarDirModal();
  toast('Usando tu dirección principal');
};

window.procederPago=async function(){
  const dirEntrega=dirTemporal?.direccion||me.direccion||'';
  if(!dirEntrega){
    toast('Agrega una dirección de entrega primero');
    abrirDirModal();
    return;
  }
  if(!carrito.length){toast('Tu carrito está vacío');return;}
  toast('✅ Pedido confirmado. El proveedor te contactará pronto.');
  // Aquí conectarías con tu pasarela de pago
};

function toast(m){const t=Q('toast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),2500);}
</script>
</body>
</html>
