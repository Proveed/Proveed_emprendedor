<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>PROVEED — Explorar</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#A8E63D">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
:root{--acc:#A8E63D;--acc2:#7BC234;--gris:#F5F6F2;--naranja:#FF8C00;--rojo:#FF4D4D;--azul:#007AFF;}
body{background:var(--gris);font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;padding-bottom:80px;}

/* HEADER */
.header{background:white;padding:48px 14px 10px;position:sticky;top:0;z-index:100;border-bottom:1px solid #eee;}
.search-box{display:flex;align-items:center;gap:9px;background:var(--gris);border-radius:28px;padding:11px 14px;border:1px solid #eee;margin-bottom:0;}
.search-box svg{width:16px;height:16px;stroke:#bbb;fill:none;stroke-width:2.5;flex-shrink:0;}
.search-box input{flex:1;background:transparent;border:none;outline:none;font-family:'Inter',sans-serif;font-size:0.88rem;color:#111;}
.search-box input::placeholder{color:#ccc;}
.search-cams{display:flex;gap:6px;flex-shrink:0;}
.cam-btn{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:none;cursor:pointer;flex-shrink:0;}
.cam-btn.galeria{background:#111;}
.cam-btn.camara{background:var(--acc);}
.cam-btn svg{width:15px;height:15px;fill:none;stroke-width:2;}
.cam-btn.galeria svg{stroke:white;}
.cam-btn.camara svg{stroke:#111;}

/* PROMO STRIP */
.promo-strip{background:rgba(255,140,0,0.06);padding:8px 14px;display:flex;align-items:center;gap:10px;border-bottom:1px solid #eee;}
.promo-item{display:flex;align-items:center;gap:5px;}
.promo-item svg{width:13px;height:13px;stroke:var(--naranja);fill:none;stroke-width:2.5;}
.promo-txt{font-size:0.68rem;font-weight:600;color:var(--naranja);}
.promo-sep{color:#ddd;font-size:0.8rem;}
.promo-strip-arrow{margin-left:auto;}
.promo-strip-arrow svg{width:13px;height:13px;stroke:#ccc;fill:none;stroke-width:2;}

/* LAYOUT */
.main-layout{display:flex;height:calc(100vh - 148px);position:sticky;top:148px;}

/* SIDEBAR */
.sidebar{width:115px;background:white;overflow-y:auto;flex-shrink:0;scrollbar-width:none;border-right:1px solid #eee;}
.sidebar::-webkit-scrollbar{display:none;}
.cat-menu-item{padding:14px 12px;cursor:pointer;border-bottom:1px solid #f5f5f5;transition:0.15s;display:flex;align-items:center;gap:8px;}
.cat-menu-item:active{background:var(--gris);}
.cat-menu-item.active{background:rgba(168,230,61,0.08);border-right:3px solid var(--acc2);}
.cat-menu-icon{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.cat-menu-icon svg{width:16px;height:16px;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
.cat-menu-txt{font-size:0.72rem;font-weight:600;color:#555;line-height:1.3;}
.cat-menu-item.active .cat-menu-txt{color:var(--acc2);font-weight:700;}

/* CONTENT */
.content{flex:1;overflow-y:auto;padding:12px;scrollbar-width:none;}
.content::-webkit-scrollbar{display:none;}
.cat-titulo{font-size:1rem;font-weight:900;color:#111;margin-bottom:12px;letter-spacing:-0.3px;}

/* SUBCATEGORÍAS CHIPS */
.subcats{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;margin-bottom:14px;padding-bottom:2px;}
.subcats::-webkit-scrollbar{display:none;}
.subcat-chip{padding:6px 12px;border-radius:20px;background:white;border:1.5px solid #eee;font-family:'Inter',sans-serif;font-size:0.7rem;font-weight:600;color:#555;cursor:pointer;white-space:nowrap;flex-shrink:0;transition:0.15s;}
.subcat-chip.active{border-color:var(--acc2);color:var(--acc2);background:rgba(168,230,61,0.06);}

/* SUBCATS CARDS (para Destacado) */
.subcat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px;}
.subcat-card{background:white;border-radius:14px;padding:14px 8px;text-align:center;cursor:pointer;border:1px solid #eee;transition:0.15s;box-shadow:0 1px 4px rgba(0,0,0,0.04);}
.subcat-card:active{transform:scale(0.96);}
.subcat-card-badge{display:inline-block;font-size:0.56rem;font-weight:800;padding:2px 7px;border-radius:20px;color:white;margin-bottom:8px;text-transform:uppercase;}
.subcat-card-icon{width:40px;height:40px;border-radius:12px;margin:0 auto 8px;display:flex;align-items:center;justify-content:center;}
.subcat-card-icon svg{width:22px;height:22px;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.subcat-card-lbl{font-size:0.72rem;font-weight:700;color:#111;}

/* PRODUCTOS */
.prods-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;}
.prod-card{background:white;border-radius:14px;overflow:hidden;border:1px solid #eee;box-shadow:0 1px 6px rgba(0,0,0,0.04);cursor:pointer;transition:0.15s;}
.prod-card:active{transform:scale(0.97);}
.prod-img{width:100%;height:120px;background:var(--gris);display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative;}
.prod-img img{width:100%;height:100%;object-fit:cover;}
.prod-img-icon{width:48px;height:48px;display:flex;align-items:center;justify-content:center;}
.prod-img-icon svg{width:36px;height:36px;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;}
.prod-cat-badge{position:absolute;top:6px;left:6px;font-size:0.52rem;font-weight:800;padding:2px 6px;border-radius:20px;color:white;text-transform:uppercase;}
.prod-body{padding:9px;}
.prod-nombre{font-size:0.76rem;font-weight:700;color:#111;margin-bottom:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.3;}
.prod-prov{font-size:0.62rem;color:#bbb;margin-bottom:5px;}
.prod-footer{display:flex;align-items:center;justify-content:space-between;}
.prod-precio{font-size:0.9rem;font-weight:900;color:var(--naranja);}
.prod-add{width:26px;height:26px;background:var(--acc);border-radius:8px;display:flex;align-items:center;justify-content:center;border:none;cursor:pointer;}
.prod-add svg{width:12px;height:12px;stroke:#111;fill:none;stroke-width:2.5;}

.empty-cat{text-align:center;padding:40px 20px;color:#bbb;}
.empty-cat svg{width:48px;height:48px;stroke:#ddd;fill:none;stroke-width:1.5;margin:0 auto 12px;display:block;}
.empty-cat p{font-size:0.82rem;font-weight:600;}

/* BÚSQUEDA RESULTADOS */
.search-results{display:none;}
.search-results.show{display:block;}
.search-header{font-size:0.8rem;font-weight:700;color:#aaa;margin-bottom:12px;}

/* MODAL CÁMARA */
.modal-cam{position:fixed;inset:0;background:black;z-index:2000;display:none;flex-direction:column;}
.modal-cam.show{display:flex;}
.cam-header{padding:44px 16px 12px;display:flex;align-items:center;gap:10px;flex-shrink:0;}
.cam-back{width:36px;height:36px;background:rgba(255,255,255,0.15);border-radius:10px;display:flex;align-items:center;justify-content:center;border:none;cursor:pointer;}
.cam-back svg{width:18px;height:18px;stroke:white;fill:none;stroke-width:2.5;}
.cam-titulo{font-size:0.95rem;font-weight:700;color:white;}
.cam-preview{flex:1;position:relative;overflow:hidden;}
#cam-video{width:100%;height:100%;object-fit:cover;}
.cam-overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;}
.cam-frame{width:240px;height:240px;border:2px solid var(--acc);border-radius:20px;}
.cam-footer{padding:20px;display:flex;align-items:center;justify-content:center;gap:24px;flex-shrink:0;}
.cam-capture{width:70px;height:70px;border-radius:50%;background:var(--acc);display:flex;align-items:center;justify-content:center;border:4px solid rgba(255,255,255,0.3);cursor:pointer;}
.cam-capture svg{width:28px;height:28px;stroke:#111;fill:none;stroke-width:2;}
.cam-flip{width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,0.15);display:flex;align-items:center;justify-content:center;border:none;cursor:pointer;}
.cam-flip svg{width:20px;height:20px;stroke:white;fill:none;stroke-width:2;}

/* INPUT HIDDEN */
.foto-hidden{display:none;}

/* LOADING */
.searching-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.5);display:none;align-items:center;justify-content:center;z-index:1000;}
.searching-overlay.show{display:flex;}
.searching-box{background:white;border-radius:20px;padding:28px 32px;text-align:center;}
.spinner{width:36px;height:36px;border:3px solid #eee;border-top-color:var(--acc);border-radius:50%;animation:spin 0.7s linear infinite;margin:0 auto 12px;}
@keyframes spin{to{transform:rotate(360deg);}}
.searching-box p{font-size:0.82rem;color:#555;font-weight:600;}

/* TAB BAR */
.tab-bar{position:fixed;bottom:0;width:100%;background:white;border-top:1px solid #eee;display:flex;padding:8px 0;padding-bottom:max(8px,env(safe-area-inset-bottom));z-index:200;box-shadow:0 -2px 12px rgba(0,0,0,0.05);}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;border:none;background:transparent;cursor:pointer;text-decoration:none;font-family:'Inter',sans-serif;padding:4px 0;}
.tab svg{width:22px;height:22px;stroke:#ccc;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:0.2s;}
.tab span{font-size:0.55rem;font-weight:700;color:#ccc;text-transform:uppercase;}
.tab.active svg{stroke:var(--acc2);}
.tab.active span{color:var(--acc2);}
.tab-rel{position:relative;}
.tab-badge{position:absolute;top:-2px;right:6px;background:var(--rojo);color:white;font-size:0.5rem;font-weight:800;width:14px;height:14px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:1.5px solid white;}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%) translateY(20px);background:#111;color:white;padding:10px 20px;border-radius:24px;font-size:0.8rem;font-weight:600;opacity:0;transition:0.3s;pointer-events:none;z-index:3000;white-space:nowrap;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>

<!-- HEADER -->
<div class="header">
  <div class="search-box">

</div>

<!-- MAIN LAYOUT -->
<div class="main-layout" id="main-layout">

  <div class="sidebar" id="sidebar"></div>

      <svg viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>

      <svg viewBox="0 0 24 24"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>

<!-- LOADING -->

// ── INIT ──
(async()=>{
  const{data}=await sb.from('productos').select('*').eq('activo',true).order('created_at',{ascending:false});
  todosProductos=data||[];
  renderSidebar();
  seleccionarCat('Destacado');
})();

// ── SIDEBAR ──
function renderSidebar(){
  const sb_el=document.getElementById('sidebar');
  sb_el.innerHTML='';
  CATEGORIAS.forEach(cat=>{
    const item=document.createElement('div');
    item.className='cat-menu-item'+(cat.nombre===catActiva?' active':'');
    item.dataset.cat=cat.nombre;
    item.innerHTML=`
      <div class="cat-menu-icon" style="background:${cat.color}15;">
        ${cat.icon}
      </div>
      <div class="cat-menu-txt">${cat.nombre}</div>`;
    item.onclick=()=>seleccionarCat(cat.nombre);
    sb_el.appendChild(item);
  });
}

function seleccionarCat(nombre){
  catActiva=nombre;
  subcatActiva='';
  // Ocultar búsqueda
  document.getElementById('search-results').classList.remove('show');
  document.getElementById('main-layout').style.display='flex';
  // Update sidebar activo
  document.querySelectorAll('.cat-menu-item').forEach(el=>{
    el.classList.toggle('active',el.dataset.cat===nombre);
  });
  // Scroll sidebar a activo
  const activeEl=document.querySelector('.cat-menu-item.active');
  if(activeEl) activeEl.scrollIntoView({block:'nearest',behavior:'smooth'});
  renderContent();
}

// ── CONTENIDO ──
function renderContent(){
  const cont=document.getElementById('content');
  const cat=CATEGORIAS.find(c=>c.nombre===catActiva);
  if(!cat){cont.innerHTML='';return;}

  let html=`<div class="cat-titulo">${cat.nombre}</div>`;

  // Subcategorías como chips o cards (Destacado usa cards)
  if(cat.nombre==='Destacado'){
    html+=`<div class="subcat-grid">`;
    cat.subs.forEach(sub=>{
      html+=`<div class="subcat-card" onclick="seleccionarSubcat('${sub.nombre}')">
        <div class="subcat-card-badge" style="background:${sub.badgeColor}">${sub.badge}</div>
        <div class="subcat-card-icon" style="background:${sub.bg}">${sub.icon}</div>
        <div class="subcat-card-lbl">${sub.nombre}</div>
      </div>`;
    });
    html+=`</div>`;
  } else if(cat.subs?.length){
    const subs=Array.isArray(cat.subs)&&typeof cat.subs[0]==='string'?cat.subs:cat.subs.map(s=>s.nombre);
    html+=`<div class="subcats" id="subcats-row">
      <div class="subcat-chip ${!subcatActiva?'active':''}" onclick="seleccionarSubcat('')">Todos</div>`;
    subs.forEach(s=>{
      html+=`<div class="subcat-chip ${subcatActiva===s?'active':''}" onclick="seleccionarSubcat('${s}')">${s}</div>`;
    });
    html+=`</div>`;
  }

  // Productos
  const prods=filtrarProductos(cat,subcatActiva);
  html+=renderProductos(prods,cat);

  cont.innerHTML=html;
}

function filtrarProductos(cat,subcat){
  if(cat.nombre==='Destacado'){
    if(!subcat) return todosProductos.slice(0,20);
    // Filtrar por subcategoría de destacado según tags o creados recientemente
    if(subcat==='Nuevos ingresos') return todosProductos.slice(0,12);
    if(subcat==='Más vendidos') return [...todosProductos].sort(()=>Math.random()-0.5).slice(0,12);
    if(subcat==='Ofertas del día'||subcat==='Liquidación') return todosProductos.filter(p=>p.descuento||p.oferta).slice(0,12);
    return todosProductos.slice(0,12);
  }
  return todosProductos.filter(p=>{
    const catMatch=(p.categoria||'').toLowerCase().includes(cat.nombre.toLowerCase())||
      cat.nombre.toLowerCase().includes((p.categoria||'').toLowerCase().split(' ')[0]);
    if(!catMatch) return false;
    if(subcat){
      const s=subcat.toLowerCase();
      return (p.subcategoria||'').toLowerCase().includes(s)||
        (p.nombre||'').toLowerCase().includes(s)||
        (p.tags||[]).some(t=>t.toLowerCase().includes(s));
    }
    return true;
  });
}

function renderProductos(prods,cat){
  if(!prods.length){
    return `<div class="empty-cat">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      <p>Aún no hay productos en esta categoría.<br><span style="font-size:0.72rem;color:#ccc;">Los proveedores están agregando productos</span></p>
    </div>`;
  }
  let html=`<div class="prods-grid">`;
  prods.forEach(p=>{
    const img=p.imagenes?.[0]||p.imagen||'';
    const color=cat?.color||getColorCat(p.categoria||'');
    html+=`<div class="prod-card" onclick="irProducto('${p.id}')">
      <div class="prod-img" style="background:${color}12;">
        ${img?`<img src="${img}" alt="" loading="lazy">`:`<div class="prod-img-icon" style="stroke:${color};">${cat?.icon||iconCat(p.categoria)}</div>`}
        <div class="prod-cat-badge" style="background:${color};">${(p.categoria||'General').slice(0,8).toUpperCase()}</div>
      </div>
      <div class="prod-body">
        <div class="prod-nombre">${p.nombre||'Producto'}</div>
        <div class="prod-prov">${p.nombre_proveedor||'Proveedor'}</div>
        <div class="prod-footer">
          <div class="prod-precio">$${Number(p.precio||0).toFixed(2)}</div>
          <button class="prod-add" onclick="addCarrito(event,'${p.id}','${(p.nombre||'').replace(/'/g,'')}',${p.precio||0},'${img}')">
            <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          </button>
        </div>
      </div>
    </div>`;
  });
  html+=`</div>`;
  return html;
}

function seleccionarSubcat(s){
  subcatActiva=s;
  renderContent();
}

function irProducto(id){window.location.href=`producto.html?id=${id}`;}

function addCarrito(e,id,nombre,precio,imagen){
  e.stopPropagation();
  const c=JSON.parse(localStorage.getItem('carrito_proveed')||'[]');
  const idx=c.findIndex(i=>i.id===id);
  if(idx>=0) c[idx].cantidad=(c[idx].cantidad||1)+1;
  else c.push({id,nombre,precio,imagen,cantidad:1});
  localStorage.setItem('carrito_proveed',JSON.stringify(c));
  const cnt=c.reduce((s,i)=>s+(i.cantidad||1),0);
  const b=document.getElementById('carrito-badge');
  b.style.display='flex';b.textContent=cnt>9?'9+':cnt;
  const btn=e.currentTarget;
  btn.style.background='var(--acc2)';setTimeout(()=>btn.style.background='var(--acc)',500);
  showToast('✓ Agregado al carrito');
}

// ── BÚSQUEDA TEXTO ──
let searchTimer;
window.buscarTexto=function(q){
  clearTimeout(searchTimer);
  if(!q.trim()){
    document.getElementById('search-results').classList.remove('show');
    document.getElementById('main-layout').style.display='flex';
    return;
  }
  searchTimer=setTimeout(()=>{
    const ql=q.toLowerCase();
    const res=todosProductos.filter(p=>
      (p.nombre||'').toLowerCase().includes(ql)||
      (p.categoria||'').toLowerCase().includes(ql)||
      (p.nombre_proveedor||'').toLowerCase().includes(ql)||
      (p.descripcion||'').toLowerCase().includes(ql)
    );
    document.getElementById('search-results').classList.add('show');
    document.getElementById('main-layout').style.display='none';
    document.getElementById('search-header').textContent=`${res.length} resultado${res.length!==1?'s':''} para "${q}"`;
    const grid=document.getElementById('search-grid');
    if(!res.length){grid.innerHTML=`<div style="grid-column:1/-1;text-align:center;padding:40px;color:#bbb;font-size:0.82rem;">Sin resultados para "${q}"</div>`;return;}
    grid.innerHTML='';
    res.forEach(p=>{
      const img=p.imagenes?.[0]||p.imagen||'';
      const color=getColorCat(p.categoria||'');
      const card=document.createElement('div');card.className='prod-card';
      card.onclick=()=>irProducto(p.id);
      card.innerHTML=`<div class="prod-img" style="background:${color}12;">${img?`<img src="${img}" alt="" loading="lazy">`:`<div class="prod-img-icon">${iconCat(p.categoria)}</div>`}<div class="prod-cat-badge" style="background:${color};">${(p.categoria||'General').slice(0,8).toUpperCase()}</div></div><div class="prod-body"><div class="prod-nombre">${p.nombre||'Producto'}</div><div class="prod-prov">${p.nombre_proveedor||'Proveedor'}</div><div class="prod-footer"><div class="prod-precio">$${Number(p.precio||0).toFixed(2)}</div><button class="prod-add" onclick="addCarrito(event,'${p.id}','${(p.nombre||'').replace(/'/g,'')}',${p.precio||0},'${img}')"><svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></button></div></div>`;
      grid.appendChild(card);
    });
  },300);
};

window.activarBusqueda=function(){
  if(!document.getElementById('search-input').value) return;
  buscarTexto(document.getElementById('search-input').value);
};

// ── BÚSQUEDA POR IMAGEN (GALERÍA) ──
window.buscarPorImagen=async function(input){
  const file=input.files[0];if(!file)return;
  procesarImagenBusqueda(file);
};

async function procesarImagenBusqueda(file){
  document.getElementById('searching-overlay').classList.add('show');
  document.getElementById('searching-txt').textContent='Analizando imagen con IA...';
  try{
    const b64=await fileToBase64(file);
    const mediaType=file.type||'image/jpeg';
    const res=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        model:'claude-sonnet-4-20250514',
        max_tokens:500,
        messages:[{role:'user',content:[
          {type:'image',source:{type:'base64',media_type:mediaType,data:b64}},
          {type:'text',text:'Analiza este producto. Responde SOLO en JSON con: {"nombre":"...","categoria":"...","color":"...","material":"...","tags":["...","...","..."]}. Máximo 5 tags relevantes para búsqueda en marketplace ecuatoriano.'}
        ]}]
      })
    });
    const data=await res.json();
    const txt=data.content?.[0]?.text||'{}';
    const clean=txt.replace(/```json|```/g,'').trim();
    const info=JSON.parse(clean);
    document.getElementById('searching-overlay').classList.remove('show');
    buscarPorTerminos(info);
  }catch(e){
    document.getElementById('searching-overlay').classList.remove('show');
    showToast('Error al analizar imagen');
  }
  document.getElementById('foto-galeria').value='';
}

function buscarPorTerminos(info){
  const terminos=[info.nombre,info.categoria,...(info.tags||[])].filter(Boolean).join(' ');
  document.getElementById('search-input').value=terminos;
  buscarTexto(terminos);
}

function fileToBase64(file){
  return new Promise((res,rej)=>{
    const r=new FileReader();
    r.onload=e=>res(e.target.result.split(',')[1]);
    r.onerror=()=>rej(new Error('Error leyendo archivo'));
    r.readAsDataURL(file);
  });
}

// ── CÁMARA EN TIEMPO REAL ──
window.abrirCamara=async function(){
  try{
    const constraints={video:{facingMode:camaraFrontal?'user':'environment',width:{ideal:1280},height:{ideal:720}}};
    streamCam=await navigator.mediaDevices.getUserMedia(constraints);
    document.getElementById('cam-video').srcObject=streamCam;
    document.getElementById('modal-cam').classList.add('show');
  }catch(e){
    showToast('No se pudo acceder a la cámara');
    // Fallback a galería
    document.getElementById('foto-galeria').click();
  }
};

window.cerrarCamara=function(){
  if(streamCam){streamCam.getTracks().forEach(t=>t.stop());streamCam=null;}
  document.getElementById('modal-cam').classList.remove('show');
};

window.flipCamara=async function(){
  camaraFrontal=!camaraFrontal;
  if(streamCam){streamCam.getTracks().forEach(t=>t.stop());}
  try{
    const constraints={video:{facingMode:camaraFrontal?'user':'environment'}};
    streamCam=await navigator.mediaDevices.getUserMedia(constraints);
    document.getElementById('cam-video').srcObject=streamCam;
  }catch(e){showToast('Error al cambiar cámara');}
};

window.capturarFoto=function(){
  const video=document.getElementById('cam-video');
  const canvas=document.getElementById('cam-canvas');
  canvas.width=video.videoWidth;
  canvas.height=video.videoHeight;
  canvas.getContext('2d').drawImage(video,0,0);
  canvas.toBlob(async blob=>{
    cerrarCamara();
    if(blob){
      const file=new File([blob],'foto.jpg',{type:'image/jpeg'});
      await procesarImagenBusqueda(file);
    }
  },'image/jpeg',0.85);
};

// ── HELPERS ──
function getColorCat(c){
  const cat=CATEGORIAS.find(x=>x.nombre.toLowerCase().includes((c||'').toLowerCase().split(' ')[0]));
  return cat?.color||'#888';
}

function iconCat(c){
  const cat=CATEGORIAS.find(x=>x.nombre.toLowerCase().includes((c||'').toLowerCase().split(' ')[0]));
  return cat?.icon||`<svg viewBox="0 0 24 24" stroke="#888"><rect x="2" y="2" width="20" height="20" rx="3"/></svg>`;
}

function showToast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500);}
</script>
