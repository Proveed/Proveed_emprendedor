<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>PROVEED — Explorar</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
:root{--acc:#A8E63D;--acc2:#7BC234;--gris:#F5F6F2;--naranja:#FF8C00;--rojo:#FF4D4D;}
body{background:var(--gris);font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;padding-bottom:80px;}

.header{background:white;padding:48px 14px 10px;position:sticky;top:0;z-index:100;border-bottom:1px solid #eee;}
.search-box{display:flex;align-items:center;gap:9px;background:var(--gris);border-radius:28px;padding:11px 14px;border:1px solid #eee;margin-bottom:0;}
.search-box svg{width:16px;height:16px;stroke:#bbb;fill:none;stroke-width:2.5;flex-shrink:0;}
.search-box input{flex:1;background:transparent;border:none;outline:none;font-family:'Inter',sans-serif;font-size:0.88rem;color:#111;}
.search-box input::placeholder{color:#ccc;}
.search-cams{display:flex;gap:6px;flex-shrink:0;}
.cam-btn{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:none;cursor:pointer;flex-shrink:0;}
.cam-btn.galeria{background:#111;}
.cam-btn.camara{background:var(--acc);}
.cam-btn svg{width:15px;height:15px;fill:none;stroke-width:2;}
.cam-btn.galeria svg{stroke:white;}
.cam-btn.camara svg{stroke:#111;}

.promo-strip{background:rgba(255,140,0,0.06);padding:8px 14px;display:flex;align-items:center;gap:10px;border-bottom:1px solid #eee;}
.promo-item{display:flex;align-items:center;gap:5px;}
.promo-item svg{width:13px;height:13px;stroke:var(--naranja);fill:none;stroke-width:2.5;}
.promo-txt{font-size:0.68rem;font-weight:600;color:var(--naranja);}
.promo-sep{color:#ddd;}

/* LAYOUT SIDEBAR + CONTENT */
.layout{display:flex;height:calc(100vh - 160px);overflow:hidden;position:relative;}

.sidebar{width:110px;background:white;overflow-y:auto;flex-shrink:0;border-right:1px solid #eee;height:100%;scrollbar-width:none;}
.sidebar::-webkit-scrollbar{display:none;}

.cat-item{padding:12px 8px;cursor:pointer;border-bottom:1px solid #f5f5f5;display:flex;flex-direction:column;align-items:center;gap:6px;transition:0.15s;}
.cat-item:active{background:var(--gris);}
.cat-item.active{background:rgba(168,230,61,0.08);border-right:3px solid var(--acc2);}
.cat-icon{width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.cat-icon svg{width:18px;height:18px;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
.cat-txt{font-size:0.65rem;font-weight:600;color:#555;text-align:center;line-height:1.3;}
.cat-item.active .cat-txt{color:var(--acc2);font-weight:700;}

.content{flex:1;overflow-y:auto;padding:12px;scrollbar-width:none;height:100%;}
.content::-webkit-scrollbar{display:none;}

.cat-titulo{font-size:1rem;font-weight:900;color:#111;margin-bottom:12px;}
.prods-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;}
.prod-card{background:white;border-radius:14px;overflow:hidden;border:1px solid #eee;box-shadow:0 1px 6px rgba(0,0,0,0.04);cursor:pointer;}
.prod-card:active{transform:scale(0.97);}
.prod-img{width:100%;height:120px;background:var(--gris);display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative;}
.prod-img img{width:100%;height:100%;object-fit:cover;}
.prod-img-ico{width:48px;height:48px;display:flex;align-items:center;justify-content:center;}
.prod-img-ico svg{width:32px;height:32px;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;}
.prod-badge{position:absolute;top:6px;left:6px;font-size:0.52rem;font-weight:800;padding:2px 6px;border-radius:20px;color:white;text-transform:uppercase;}
.prod-body{padding:9px;}
.prod-nombre{font-size:0.76rem;font-weight:700;color:#111;margin-bottom:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.3;}
.prod-prov{font-size:0.62rem;color:#bbb;margin-bottom:5px;}
.prod-footer{display:flex;align-items:center;justify-content:space-between;}
.prod-precio{font-size:0.9rem;font-weight:900;color:var(--naranja);}
.prod-add{width:26px;height:26px;background:var(--acc);border-radius:8px;display:flex;align-items:center;justify-content:center;border:none;cursor:pointer;}
.prod-add svg{width:12px;height:12px;stroke:#111;fill:none;stroke-width:2.5;}

.empty-cat{text-align:center;padding:40px 20px;color:#bbb;}
.empty-cat svg{width:48px;height:48px;stroke:#ddd;fill:none;stroke-width:1.5;margin:0 auto 12px;display:block;}
.empty-cat p{font-size:0.82rem;font-weight:600;}

/* BÚSQUEDA */
.search-results{display:none;padding:12px;}
.search-results.show{display:block;}
.search-hdr{font-size:0.8rem;font-weight:700;color:#aaa;margin-bottom:12px;}

/* MODAL CÁMARA */
.modal-cam{position:fixed;inset:0;background:black;z-index:2000;display:none;flex-direction:column;}
.modal-cam.show{display:flex;}
.cam-header{padding:44px 16px 12px;display:flex;align-items:center;gap:10px;flex-shrink:0;}
.cam-back{width:36px;height:36px;background:rgba(255,255,255,0.15);border-radius:10px;display:flex;align-items:center;justify-content:center;border:none;cursor:pointer;}
.cam-back svg{width:18px;height:18px;stroke:white;fill:none;stroke-width:2.5;}
.cam-titulo{font-size:0.95rem;font-weight:700;color:white;}
.cam-preview{flex:1;position:relative;overflow:hidden;}
#cam-video{width:100%;height:100%;object-fit:cover;}
.cam-frame{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:220px;height:220px;border:2px solid var(--acc);border-radius:20px;}
.cam-footer{padding:20px;display:flex;align-items:center;justify-content:center;gap:24px;flex-shrink:0;}
.cam-capture{width:70px;height:70px;border-radius:50%;background:var(--acc);display:flex;align-items:center;justify-content:center;border:4px solid rgba(255,255,255,0.3);cursor:pointer;}
.cam-capture svg{width:28px;height:28px;stroke:#111;fill:none;stroke-width:2;}
.cam-flip{width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,0.15);display:flex;align-items:center;justify-content:center;border:none;cursor:pointer;}
.cam-flip svg{width:20px;height:20px;stroke:white;fill:none;stroke-width:2;}

.foto-hidden{display:none;}

.loading-ov{position:fixed;inset:0;background:rgba(0,0,0,0.5);display:none;align-items:center;justify-content:center;z-index:1000;}
.loading-ov.show{display:flex;}
.loading-box{background:white;border-radius:20px;padding:28px 32px;text-align:center;}
.spinner{width:36px;height:36px;border:3px solid #eee;border-top-color:var(--acc);border-radius:50%;animation:spin 0.7s linear infinite;margin:0 auto 12px;}
@keyframes spin{to{transform:rotate(360deg);}}
.loading-box p{font-size:0.82rem;color:#555;font-weight:600;}

/* TAB BAR */
.tab-bar{position:fixed;bottom:0;width:100%;background:white;border-top:1px solid #eee;display:flex;padding:8px 0;padding-bottom:max(8px,env(safe-area-inset-bottom));z-index:200;box-shadow:0 -2px 12px rgba(0,0,0,0.05);}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;border:none;background:transparent;cursor:pointer;text-decoration:none;font-family:'Inter',sans-serif;padding:4px 0;}
.tab svg{width:22px;height:22px;stroke:#ccc;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.tab span{font-size:0.55rem;font-weight:700;color:#ccc;text-transform:uppercase;}
.tab.active svg{stroke:var(--acc2);}
.tab.active span{color:var(--acc2);}
.tab-rel{position:relative;}
.tab-badge{position:absolute;top:-2px;right:6px;background:var(--rojo);color:white;font-size:0.5rem;font-weight:800;width:14px;height:14px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:1.5px solid white;}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%) translateY(20px);background:#111;color:white;padding:10px 20px;border-radius:24px;font-size:0.8rem;font-weight:600;opacity:0;transition:0.3s;pointer-events:none;z-index:3000;white-space:nowrap;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>

<!-- HEADER -->

<!-- BÚSQUEDA RESULTADOS -->

<!-- LAYOUT PRINCIPAL -->
<div class="layout" id="main-layout">
  <div class="sidebar" id="sidebar"></div>
  <div class="content" id="content">
    <div style="text-align:center;padding:40px;color:#bbb;font-size:0.82rem;">Cargando categorías...</div>
  </div>
</div>

<!-- CÁMARA -->
<div class="modal-cam" id="modal-cam">
  <div class="cam-header">
    <button class="cam-back" onclick="cerrarCamara()">
      <svg viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>

  </div>
</div>

<!-- LOADING -->
<div class="loading-ov" id="loading-ov">
  <div class="loading-box">
    <div class="spinner"></div>
    <p id="loading-txt">Analizando imagen...</p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const {createClient} = supabase;
const sb = createClient('https://hfmsyrmkewscnvwynzfq.supabase.co','sb_publishable_d1oLsq70a6ZV33vW3XkRgw_nYcN2Z9v');

let todosProductos = [], catActiva = 'Destacado', streamCam = null, camaraFrontal = false;

// Badge carrito
const carrito = JSON.parse(localStorage.getItem('carrito_proveed')||'[]');
const cnt = carrito.reduce((s,i)=>s+(i.cantidad||1),0);
if(cnt>0){const b=document.getElementById('carrito-badge');b.style.display='flex';b.textContent=cnt>9?'9+':cnt;}

// CATEGORÍAS
const CATS = [
  {id:'destacado',nombre:'Destacado',color:'#FF8C00',
   icon:`<svg viewBox="0 0 24 24" stroke="#FF8C00"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>`},
  {id:'ropa-mujer',nombre:'Ropa mujer',color:'#FF69B4',
   icon:`<svg viewBox="0 0 24 24" stroke="#FF69B4"><path d="M20.38 3.46 16 2a4 4 0 0 1-8 0L3.62 3.46a2 2 0 0 0-1.34 2.23l.58 3.57a1 1 0 0 0 .99.84H6v10c0 1.1.9 2 2 2h8a2 2 0 0 0 2-2V10h2.15a1 1 0 0 0 .99-.84l.58-3.57a2 2 0 0 0-1.34-2.23z"/></svg>`},
  {id:'ropa-hombre',nombre:'Ropa hombre',color:'#2196F3',
   icon:`<svg viewBox="0 0 24 24" stroke="#2196F3"><path d="M20.38 3.46 16 2a4 4 0 0 1-8 0L3.62 3.46a2 2 0 0 0-1.34 2.23l.58 3.57a1 1 0 0 0 .99.84H6v10c0 1.1.9 2 2 2h8a2 2 0 0 0 2-2V10h2.15a1 1 0 0 0 .99-.84l.58-3.57a2 2 0 0 0-1.34-2.23z"/></svg>`},
  {id:'calzado',nombre:'Calzado',color:'#9C27B0',
   icon:`<svg viewBox="0 0 24 24" stroke="#9C27B0"><path d="M3 17H1v-2l.63-3.14A3 3 0 0 1 4.56 9.5L8 9l5-5 5 5-2 4 1 4H3z"/></svg>`},
  {id:'belleza',nombre:'Belleza',color:'#F06292',
   icon:`<svg viewBox="0 0 24 24" stroke="#F06292"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>`},
  {id:'hogar',nombre:'Hogar',color:'#26A69A',
   icon:`<svg viewBox="0 0 24 24" stroke="#26A69A"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>`},
  {id:'tecnologia',nombre:'Tecnología',color:'#3F51B5',
   icon:`<svg viewBox="0 0 24 24" stroke="#3F51B5"><rect x="5" y="2" width="14" height="20" rx="2"/><line x1="12" y1="18" x2="12.01" y2="18"/></svg>`},
  {id:'alimentos',nombre:'Alimentos',color:'#8BC34A',
   icon:`<svg viewBox="0 0 24 24" stroke="#8BC34A"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><circle cx="12" cy="13" r="4"/></svg>`},
  {id:'deporte',nombre:'Deporte',color:'#4CAF50',
   icon:`<svg viewBox="0 0 24 24" stroke="#4CAF50"><circle cx="12" cy="12" r="10"/><path d="M12 8v4l3 3"/></svg>`},
  {id:'juguetes',nombre:'Juguetes',color:'#FF9800',
   icon:`<svg viewBox="0 0 24 24" stroke="#FF9800"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/></svg>`},
  {id:'mascotas',nombre:'Mascotas',color:'#795548',
   icon:`<svg viewBox="0 0 24 24" stroke="#795548"><circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/></svg>`},
  {id:'bolsas',nombre:'Bolsas',color:'#8D6E63',
   icon:`<svg viewBox="0 0 24 24" stroke="#8D6E63"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>`},
  {id:'joyeria',nombre:'Joyería',color:'#FFC107',
   icon:`<svg viewBox="0 0 24 24" stroke="#FFC107"><circle cx="12" cy="8" r="6"/><path d="M15.477 12.89 17 22l-5-3-5 3 1.523-9.11"/></svg>`},
  {id:'muebles',nombre:'Muebles',color:'#6D4C41',
   icon:`<svg viewBox="0 0 24 24" stroke="#6D4C41"><path d="M20 9V7a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v2"/><path d="M2 11v5a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-5a2 2 0 0 0-4 0v2H6v-2a2 2 0 0 0-4 0z"/></svg>`},
  {id:'electrodomesticos',nombre:'Electrodom.',color:'#FF5722',
   icon:`<svg viewBox="0 0 24 24" stroke="#FF5722"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>`},
  {id:'oficina',nombre:'Oficina',color:'#009688',
   icon:`<svg viewBox="0 0 24 24" stroke="#009688"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>`},
  {id:'automotriz',nombre:'Automotriz',color:'#616161',
   icon:`<svg viewBox="0 0 24 24" stroke="#616161"><rect x="1" y="3" width="15" height="13" rx="2"/><polygon points="16 8 20 8 23 11 23 16 16 16 16 8"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></svg>`},
  {id:'herramientas',nombre:'Herramientas',color:'#F44336',
   icon:`<svg viewBox="0 0 24 24" stroke="#F44336"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>`},
  {id:'infantil',nombre:'Infantil',color:'#FF9800',
   icon:`<svg viewBox="0 0 24 24" stroke="#FF9800"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>`},
  {id:'otros',nombre:'Otros',color:'#888',
   icon:`<svg viewBox="0 0 24 24" stroke="#888"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>`},
];

// INIT
(async()=>{
  const {data} = await sb.from('productos').select('*').eq('activo',true).order('created_at',{ascending:false});
  todosProductos = data||[];
  renderSidebar();
  seleccionarCat('Destacado');
})();

function renderSidebar(){
  const sb_el = document.getElementById('sidebar');
  sb_el.innerHTML = '';
  CATS.forEach(cat=>{
    const d = document.createElement('div');
    d.className = 'cat-item' + (cat.nombre===catActiva?' active':'');
    d.dataset.cat = cat.nombre;
    d.innerHTML = `<div class="cat-icon" style="background:${cat.color}18;">${cat.icon}</div><div class="cat-txt">${cat.nombre}</div>`;
    d.onclick = ()=>seleccionarCat(cat.nombre);
    sb_el.appendChild(d);
  });
}

function seleccionarCat(nombre){
  catActiva = nombre;
  document.getElementById('search-results').classList.remove('show');
  document.getElementById('main-layout').style.display = 'flex';
  document.querySelectorAll('.cat-item').forEach(el=>{
    el.classList.toggle('active', el.dataset.cat===nombre);
  });
  const actEl = document.querySelector('.cat-item.active');
  if(actEl) actEl.scrollIntoView({block:'nearest',behavior:'smooth'});
  renderContent();
}

function renderContent(){
  const cont = document.getElementById('content');
  const cat = CATS.find(c=>c.nombre===catActiva);
  if(!cat){cont.innerHTML='';return;}

  let prods;
  if(cat.id==='destacado'){
    prods = todosProductos.slice(0,20);
  } else {
    prods = todosProductos.filter(p=>{
      const pc = (p.categoria||'').toLowerCase();
      const cn = cat.nombre.toLowerCase();
      const ci = cat.id.toLowerCase();
      return pc.includes(cn)||pc.includes(ci)||cn.includes(pc.split(' ')[0])||ci.includes(pc.split(' ')[0]);
    });
  }

  let html = `<div class="cat-titulo">${cat.nombre}</div>`;

  if(!prods.length){
    html += `<div class="empty-cat">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      <p>Aún no hay productos aquí.<br><span style="font-size:0.72rem;color:#ccc;">Los proveedores están agregando</span></p>
    </div>`;
  } else {
    html += `<div class="prods-grid">`;
    prods.forEach(p=>{
      const img = p.imagenes?.[0]||p.imagen||'';
      const color = cat.color||'#888';
      html += `<div class="prod-card" onclick="irProducto('${p.id}')">
        <div class="prod-img" style="background:${color}12;">
          ${img?`<img src="${img}" alt="" loading="lazy">`:`<div class="prod-img-ico">${cat.icon}</div>`}
          <div class="prod-badge" style="background:${color};">${(p.categoria||'General').slice(0,8).toUpperCase()}</div>
        </div>
        <div class="prod-body">
          <div class="prod-nombre">${p.nombre||'Producto'}</div>
          <div class="prod-prov">${p.nombre_proveedor||'Proveedor'}</div>
          <div class="prod-footer">
            <div class="prod-precio">$${Number(p.precio||0).toFixed(2)}</div>
            <button class="prod-add" onclick="addCarrito(event,'${p.id}','${(p.nombre||'').replace(/'/g,'')}',${p.precio||0},'${img}')">
              <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            </button>
          </div>
        </div>
      </div>`;
    });
    html += `</div>`;
  }
  cont.innerHTML = html;
}

function irProducto(id){ window.location.href=`producto.html?id=${id}`; }

function addCarrito(e,id,nombre,precio,imagen){
  e.stopPropagation();
  const c = JSON.parse(localStorage.getItem('carrito_proveed')||'[]');
  const idx = c.findIndex(i=>i.id===id);
  if(idx>=0) c[idx].cantidad=(c[idx].cantidad||1)+1;
  else c.push({id,nombre,precio,imagen,cantidad:1});
  localStorage.setItem('carrito_proveed',JSON.stringify(c));
  const n = c.reduce((s,i)=>s+(i.cantidad||1),0);
  const b = document.getElementById('carrito-badge');
  b.style.display='flex'; b.textContent=n>9?'9+':n;
  showToast('✓ Agregado al carrito');
}

// BÚSQUEDA TEXTO
let timer;
window.buscarTexto = function(q){
  clearTimeout(timer);
  if(!q.trim()){
    document.getElementById('search-results').classList.remove('show');
    document.getElementById('main-layout').style.display='flex';
    return;
  }
  timer = setTimeout(()=>{
    const ql = q.toLowerCase();
    const res = todosProductos.filter(p=>
      (p.nombre||'').toLowerCase().includes(ql)||
      (p.categoria||'').toLowerCase().includes(ql)||
      (p.nombre_proveedor||'').toLowerCase().includes(ql)
    );
    document.getElementById('search-results').classList.add('show');
    document.getElementById('main-layout').style.display='none';
    document.getElementById('search-hdr').textContent=`${res.length} resultado${res.length!==1?'s':''} para "${q}"`;
    const grid = document.getElementById('search-grid');
    if(!res.length){grid.innerHTML=`<div style="grid-column:1/-1;text-align:center;padding:40px;color:#bbb;font-size:0.82rem;">Sin resultados para "${q}"</div>`;return;}
    grid.innerHTML='';
    res.forEach(p=>{
      const img=p.imagenes?.[0]||p.imagen||'';
      const card=document.createElement('div');card.className='prod-card';
      card.onclick=()=>irProducto(p.id);
      card.innerHTML=`<div class="prod-img" style="background:#f5f5f5;">${img?`<img src="${img}" alt="" loading="lazy">`:'<div class="prod-img-ico"><svg viewBox="0 0 24 24" stroke="#ccc"><rect x="2" y="2" width="20" height="20" rx="3"/></svg></div>'}<div class="prod-badge" style="background:#888;">${(p.categoria||'General').slice(0,8).toUpperCase()}</div></div><div class="prod-body"><div class="prod-nombre">${p.nombre||'Producto'}</div><div class="prod-prov">${p.nombre_proveedor||'Proveedor'}</div><div class="prod-footer"><div class="prod-precio">$${Number(p.precio||0).toFixed(2)}</div><button class="prod-add" onclick="addCarrito(event,'${p.id}','${(p.nombre||'').replace(/'/g,'')}',${p.precio||0},'${img}')"><svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></button></div></div>`;
      grid.appendChild(card);
    });
  },300);
};

// BUSCAR POR IMAGEN
window.buscarPorImagen = async function(input){
  const file = input.files[0]; if(!file) return;
  await procesarImagen(file);
  input.value='';
};

async function procesarImagen(file){
  document.getElementById('loading-ov').classList.add('show');
  try{
    const b64 = await new Promise((res,rej)=>{
      const r=new FileReader();
      r.onload=e=>res(e.target.result.split(',')[1]);
      r.onerror=()=>rej(new Error('Error'));
      r.readAsDataURL(file);
    });
    const resp = await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        model:'claude-sonnet-4-20250514',
        max_tokens:300,
        messages:[{role:'user',content:[
          {type:'image',source:{type:'base64',media_type:file.type||'image/jpeg',data:b64}},
          {type:'text',text:'Qué producto es este? Responde solo en JSON: {"nombre":"...","categoria":"...","tags":["...","..."]}'}
        ]}]
      })
    });
    const data = await resp.json();
    const txt = data.content?.[0]?.text||'{}';
    const info = JSON.parse(txt.replace(/```json|```/g,'').trim());
    const termino = [info.nombre,info.categoria,...(info.tags||[])].filter(Boolean).join(' ');
    document.getElementById('search-input').value = termino;
    window.buscarTexto(termino);
  }catch(e){
    showToast('Error al analizar imagen');
  }
  document.getElementById('loading-ov').classList.remove('show');
}

// CÁMARA
window.abrirCamara = async function(){
  try{
    streamCam = await navigator.mediaDevices.getUserMedia({video:{facingMode:camaraFrontal?'user':'environment'}});
    document.getElementById('cam-video').srcObject = streamCam;
    document.getElementById('modal-cam').classList.add('show');
  }catch(e){
    showToast('No se pudo acceder a la cámara');
    document.getElementById('foto-galeria').click();
  }
};

window.cerrarCamara = function(){
  if(streamCam){streamCam.getTracks().forEach(t=>t.stop());streamCam=null;}
  document.getElementById('modal-cam').classList.remove('show');
};

window.flipCamara = async function(){
  camaraFrontal=!camaraFrontal;
  if(streamCam)streamCam.getTracks().forEach(t=>t.stop());
  try{
    streamCam = await navigator.mediaDevices.getUserMedia({video:{facingMode:camaraFrontal?'user':'environment'}});
    document.getElementById('cam-video').srcObject=streamCam;
  }catch(e){showToast('Error al cambiar cámara');}
};

window.capturarFoto = function(){
  const video=document.getElementById('cam-video');
  const canvas=document.getElementById('cam-canvas');
  canvas.width=video.videoWidth; canvas.height=video.videoHeight;
  canvas.getContext('2d').drawImage(video,0,0);
  canvas.toBlob(async blob=>{
    cerrarCamara();
    if(blob) await procesarImagen(new File([blob],'foto.jpg',{type:'image/jpeg'}));
  },'image/jpeg',0.85);
};

function showToast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500);}
</script>
