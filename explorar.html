*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
:root{--acc:#FF8C00;--verde:#A8E63D;--negro:#0F0F0F;--gris:#F5F5F5;--rojo:#FF4D4D;}
body{background:var(--gris);font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;padding-bottom:80px;}

/* SEARCH BAR */
.search-top{background:white;padding:48px 14px 12px;border-bottom:1px solid #eee;}
.search-box{display:flex;align-items:center;gap:10px;background:#F0F0F0;border-radius:28px;padding:11px 16px;}
.search-box svg{width:18px;height:18px;stroke:#999;fill:none;stroke-width:2.5;flex-shrink:0;}
.search-box input{flex:1;background:transparent;border:none;outline:none;font-family:'Inter',sans-serif;font-size:0.92rem;color:#111;}
.search-box input::placeholder{color:#aaa;}
.search-cam{width:34px;height:34px;background:#111;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;border:none;cursor:pointer;}
.search-cam svg{width:16px;height:16px;stroke:white;fill:none;stroke-width:2;}

/* PROMO BANNER */
.promo-banner{background:#FFF8F2;border-bottom:1px solid #FFE8CC;padding:10px 14px;display:flex;align-items:center;gap:12px;overflow:hidden;}
.promo-item{display:flex;align-items:center;gap:5px;white-space:nowrap;}
.promo-item svg{width:14px;height:14px;stroke:var(--acc);fill:none;stroke-width:2.5;}
.promo-txt{font-size:0.72rem;font-weight:600;color:var(--acc);}
.promo-div{color:#FFD0A0;font-size:0.9rem;}
.promo-arrow{margin-left:auto;flex-shrink:0;}
.promo-arrow svg{width:16px;height:16px;stroke:var(--acc);fill:none;stroke-width:2.5;}

/* LAYOUT PRINCIPAL */
.main-layout{display:flex;height:calc(100vh - 200px);overflow:hidden;}

/* SIDEBAR CATEGORÍAS */
.sidebar{width:115px;background:white;overflow-y:auto;flex-shrink:0;border-right:1px solid #f0f0f0;scrollbar-width:none;}
.sidebar::-webkit-scrollbar{display:none;}
.sidebar-item{padding:14px 12px;font-size:0.76rem;font-weight:500;color:#555;cursor:pointer;border-left:3px solid transparent;line-height:1.35;transition:0.15s;}
.sidebar-item.active{color:#111;font-weight:800;border-left-color:var(--acc);background:#FFF8F2;}
.sidebar-item:active{background:#f9f9f9;}

/* CONTENIDO DERECHO */
.content-right{flex:1;overflow-y:auto;scrollbar-width:none;background:#f5f5f5;}
.content-right::-webkit-scrollbar{display:none;}
.content-header{background:white;padding:12px 14px 10px;border-bottom:1px solid #f0f0f0;position:sticky;top:0;z-index:10;}
.content-title{font-size:0.92rem;font-weight:800;color:#111;margin-bottom:8px;}

/* SUBCATEGORÍAS */
.subcats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:12px;}
.subcat-card{background:white;border-radius:14px;overflow:hidden;cursor:pointer;transition:0.15s;border:1px solid #eee;}
.subcat-card:active{transform:scale(0.96);}
.subcat-img{width:100%;height:72px;object-fit:cover;background:#f0f0f0;display:flex;align-items:center;justify-content:center;font-size:1.8rem;position:relative;overflow:hidden;}
.subcat-img img{width:100%;height:100%;object-fit:cover;}
.subcat-badge{position:absolute;top:5px;left:5px;font-size:0.55rem;font-weight:800;padding:2px 6px;border-radius:20px;text-transform:uppercase;}
.badge-hot{background:#FF4D4D;color:white;}
.badge-new{background:var(--verde);color:#111;}
.badge-oferta{background:var(--acc);color:white;display:flex;align-items:center;gap:2px;}
.subcat-nombre{font-size:0.68rem;font-weight:600;color:#111;padding:6px 8px 8px;text-align:center;line-height:1.3;}

/* PRODUCTOS GRID */
.prods-header{display:flex;align-items:center;justify-content:space-between;padding:10px 12px 6px;font-size:0.72rem;color:#aaa;font-weight:600;}
.prods-count{color:#888;}
.prods-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 12px 12px;}
.prod-card{background:white;border-radius:16px;overflow:hidden;cursor:pointer;border:1px solid #eee;}
.prod-card:active{transform:scale(0.97);}
.prod-img{width:100%;height:140px;object-fit:cover;background:#f5f5f5;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;}
.prod-img img{width:100%;height:100%;object-fit:cover;}
.prod-cat-badge{position:absolute;top:8px;left:8px;font-size:0.58rem;font-weight:800;padding:3px 8px;border-radius:20px;text-transform:uppercase;color:white;}
.prod-play{position:absolute;top:8px;right:8px;width:26px;height:26px;background:rgba(0,0,0,0.5);border-radius:50%;display:flex;align-items:center;justify-content:center;}
.prod-play svg{width:12px;height:12px;fill:white;}
.prod-body{padding:10px;}
.prod-nombre{font-size:0.82rem;font-weight:700;color:#111;margin-bottom:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.35;}
.prod-proveedor{font-size:0.65rem;color:#aaa;margin-bottom:6px;}
.prod-precio{font-size:1rem;font-weight:900;color:var(--acc);}
.prod-min{font-size:0.6rem;color:#bbb;margin-top:1px;}
.prod-add{width:30px;height:30px;background:#111;border-radius:9px;display:flex;align-items:center;justify-content:center;border:none;cursor:pointer;float:right;margin-top:-32px;}
.prod-add svg{width:14px;height:14px;stroke:white;fill:none;stroke-width:2.5;}

/* FILTROS ORDEN */
.orden-row{display:flex;gap:8px;padding:8px 12px;overflow-x:auto;scrollbar-width:none;}
.orden-row::-webkit-scrollbar{display:none;}
.orden-btn{padding:7px 14px;border-radius:20px;border:1.5px solid #ddd;background:transparent;font-family:'Inter',sans-serif;font-size:0.72rem;font-weight:600;color:#555;cursor:pointer;white-space:nowrap;}
.orden-btn.active{border-color:var(--verde);color:#111;font-weight:800;}

/* TAB BAR */
.tab-bar{position:fixed;bottom:0;width:100%;background:white;border-top:1px solid #eee;display:flex;padding:8px 0 18px;z-index:200;}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;border:none;background:transparent;cursor:pointer;text-decoration:none;font-family:'Inter',sans-serif;}
.tab svg{width:22px;height:22px;stroke:#bbb;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.tab span{font-size:0.58rem;font-weight:700;color:#bbb;text-transform:uppercase;}
.tab.active svg{stroke:#111;}
.tab.active span{color:#111;}
.tab-dot{width:5px;height:5px;border-radius:50%;background:var(--verde);display:none;}
.tab.active .tab-dot{display:block;}
.carrito-badge{position:relative;}
.carrito-num{position:absolute;top:-4px;right:-8px;background:var(--acc);color:white;font-size:0.55rem;font-weight:800;width:16px;height:16px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:2px solid white;}
</style>

   id:'ropa-playa', nombre:'Ropa de playa', emoji:'🏖️',
    subs:[

// =============================================
// ESTADO
// =============================================
let categoriaActiva=null, subcatActiva=null, orden='recientes', busqActual='', productos=[], carritoCount=0;

// =============================================
// INIT
// =============================================
(async()=>{
  renderSidebar();
  activarCategoria(CATEGORIAS[0]);

  // Carrito count
  const carrito=JSON.parse(localStorage.getItem('carrito_proveed')||'[]');
  carritoCount=carrito.reduce((s,i)=>s+(i.cantidad||1),0);
  const cn=document.getElementById('carrito-num');
  if(cn) cn.textContent=carritoCount;

  // Cargar productos de supabase
  const {data}=await sb.from('productos').select('*').eq('activo',true).order('created_at',{ascending:false}).limit(100);
  productos=data||[];
})();

// =============================================
// SIDEBAR
// =============================================
function renderSidebar(){
  const sb_el=document.getElementById('sidebar');
  sb_el.innerHTML='';
  CATEGORIAS.forEach((cat,idx)=>{
    const div=document.createElement('div');
    div.className='sidebar-item'+(idx===0?' active':'');
    div.textContent=cat.nombre;
    div.onclick=()=>activarCategoria(cat,div);
    sb_el.appendChild(div);
  });
}

function activarCategoria(cat,el){
  categoriaActiva=cat;
  subcatActiva=null;
  document.querySelectorAll('.sidebar-item').forEach(b=>b.classList.remove('active'));
  if(el) el.classList.add('active');
  document.getElementById('content-title').textContent=cat.nombre;
  document.getElementById('orden-row').style.display='none';
  renderSubcats(cat.subs||[]);
}

// =============================================
// SUBCATEGORÍAS
// =============================================
function renderSubcats(subs){
  const body=document.getElementById('content-body');
  body.innerHTML='';
  if(!subs.length){ body.innerHTML='<div style="text-align:center;padding:30px;color:#bbb;">Sin subcategorías</div>'; return; }

  const grid=document.createElement('div');
  grid.className='subcats';
  subs.forEach(sub=>{
    const card=document.createElement('div');
    card.className='subcat-card';
    card.onclick=()=>abrirSubcat(sub);
    let badgeHTML='';
    if(sub.badge==='hot') badgeHTML=`<div class="subcat-badge badge-hot">🔥 HOT</div>`;
    else if(sub.badge==='new') badgeHTML=`<div class="subcat-badge badge-new">NEW</div>`;
    else if(sub.badge==='oferta') badgeHTML=`<div class="subcat-badge badge-oferta">⚡ OFERTA</div>`;
    card.innerHTML=`
      <div class="subcat-img" style="background:#f5f0eb;">
        <span style="font-size:2rem;">${sub.emoji||'📦'}</span>
        ${badgeHTML}
      </div>
      <div class="subcat-nombre">${sub.nombre}</div>`;
    grid.appendChild(card);
  });
  body.appendChild(grid);
}

// =============================================
// PRODUCTOS DE SUBCATEGORÍA
// =============================================
function abrirSubcat(sub){
  subcatActiva=sub;
  document.getElementById('content-title').textContent=sub.nombre;
  document.getElementById('orden-row').style.display='flex';
  renderProductos(sub.nombre);
}

function renderProductos(subcat){
  const body=document.getElementById('content-body');
  let lista=productos;

  // Filtrar por búsqueda o subcategoría
  if(busqActual){ lista=lista.filter(p=>(p.nombre||'').toLowerCase().includes(busqActual)||(p.categoria||'').toLowerCase().includes(busqActual)); }
  else if(subcat){ lista=lista.filter(p=>(p.categoria||'').toLowerCase().includes(subcat.toLowerCase().split(' ')[0]))||lista; }

  // Ordenar
  if(orden==='menor') lista=[...lista].sort((a,b)=>(a.precio||0)-(b.precio||0));
  else if(orden==='mayor') lista=[...lista].sort((a,b)=>(b.precio||0)-(a.precio||0));
  else lista=[...lista].sort((a,b)=>new Date(b.created_at)-new Date(a.created_at));

  body.innerHTML='';
  const header=document.createElement('div');
  header.className='prods-header';
  header.innerHTML=`<span class="prods-count">${lista.length} productos encontrados</span>`;
  body.appendChild(header);

  if(!lista.length){
    const em=document.createElement('div');
    em.style.cssText='text-align:center;padding:40px;color:#bbb;font-size:0.82rem;';
    em.innerHTML=`<div style="font-size:2.5rem;margin-bottom:10px;">📦</div>Sin productos en esta categoría`;
    body.appendChild(em);
    return;
  }

  const grid=document.createElement('div');
  grid.className='prods-grid';
  lista.forEach(p=>grid.appendChild(crearTarjetaProducto(p)));
  body.appendChild(grid);
}

function crearTarjetaProducto(p){
  const card=document.createElement('div');
  card.className='prod-card';
  const img=p.imagenes?.[0]||p.imagen||'';
  const catColor=colorCategoria(p.categoria||'');
  const tieneVideo=p.video_url?true:false;

  card.onclick=()=>window.location.href=`producto.html?id=${p.id}`;
  card.innerHTML=`
    <div class="prod-img" style="background:${catColor}18;">
      ${img?`<img src="${img}" alt="${p.nombre||''}">`:
        `<span style="font-size:3rem;">${emojiCategoria(p.categoria||'')}</span>`}
      <div class="prod-cat-badge" style="background:${catColor};">${(p.categoria||'General').toUpperCase()}</div>
      ${tieneVideo?`<div class="prod-play"><svg viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3" fill="white"/></svg></div>`:''}
    </div>
    <div class="prod-body">
      <div class="prod-nombre">${p.nombre||'Producto'}</div>
      <div class="prod-proveedor">${p.nombre_proveedor||p.proveedor||'Proveedor'}</div>
      <div class="prod-precio">$${Number(p.precio||0).toFixed(2)}</div>
      <div class="prod-min">Min: ${p.minimo||1}</div>
      <button class="prod-add" onclick="agregarCarrito(event,'${p.id}','${(p.nombre||'').replace(/'/g,'')}',${p.precio||0})">
        <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      </button>
    </div>`;
  return card;
}

function colorCategoria(cat){
  const map={
    'Ropa':'#FF8C00','Textil':'#FF8C00','Vestido':'#FF8C00',
    'Tecnolog':'#007AFF','Electr':'#007AFF','Celular':'#007AFF',
    'Alimento':'#22C55E','Comida':'#22C55E','Abarrote':'#22C55E',
    'Belleza':'#FF69B4','Cosmé':'#FF69B4','Maquill':'#FF69B4',
    'Deporte':'#A855F7','Gym':'#A855F7',
    'Hogar':'#F59E0B','Mueble':'#F59E0B',
    'Joyería':'#EF4444','Acceso':'#EF4444',
  };
  for(const k in map){ if(cat.includes(k)) return map[k]; }
  return '#888';
}

function emojiCategoria(cat){
  const map={'Ropa':'👗','Vestido':'👗','Camiseta':'👕','Pantalon':'👖','Calzado':'👟','Joya':'💍','Tecnolog':'📱','Celular':'📱','Alimento':'🛒','Belleza':'💄','Deporte':'⚽','Hogar':'🏠','Mueble':'🛋️','Juguete':'🧸','Mascota':'🐾','Herramienta':'🔧'};
  for(const k in map){ if(cat.includes(k)) return map[k]; }
  return '📦';
}

// =============================================
// BÚSQUEDA
// =============================================
function buscar(q){
  busqActual=q.toLowerCase();
  if(!q){ if(categoriaActiva) activarCategoria(categoriaActiva); return; }
  document.getElementById('content-title').textContent=`Resultados: "${q}"`;
  document.getElementById('orden-row').style.display='flex';
  renderProductos(null);
}

// =============================================
// ORDENAR
// =============================================
function ordenar(tipo,el){
  orden=tipo;
  document.querySelectorAll('.orden-btn').forEach(b=>b.classList.remove('active'));
  el.classList.add('active');
  renderProductos(subcatActiva?.nombre||null);
}

// =============================================
// CARRITO
// =============================================
function agregarCarrito(e,id,nombre,precio){
  e.stopPropagation();
  const carrito=JSON.parse(localStorage.getItem('carrito_proveed')||'[]');
  const idx=carrito.findIndex(i=>i.id===id);
  if(idx>=0){ carrito[idx].cantidad=(carrito[idx].cantidad||1)+1; }
  else { carrito.push({id,nombre,precio,cantidad:1}); }
  localStorage.setItem('carrito_proveed',JSON.stringify(carrito));
  carritoCount=carrito.reduce((s,i)=>s+(i.cantidad||1),0);
  const cn=document.getElementById('carrito-num');
  if(cn) cn.textContent=carritoCount;

  // Animación rápida
  const btn=e.currentTarget;
  btn.style.background='var(--verde)';
  setTimeout(()=>{ btn.style.background='#111'; },400);
}
</script>
