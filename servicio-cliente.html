<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>PROVEED — Servicio al Cliente</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
:root{--G:#A8E63D;--G2:#7BC234;--F:#F5F6F2;--O:#FF8C00;--R:#FF4D4D;}
body{background:var(--F);font-family:'Inter',sans-serif;padding-bottom:80px;}

.topbar{background:#fff;padding:44px 16px 14px;border-bottom:2.5px solid var(--G);display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:100;}
.back-btn{width:36px;height:36px;background:rgba(168,230,61,.1);border-radius:11px;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.back-btn svg{width:18px;height:18px;stroke:var(--G2);fill:none;stroke-width:2.5;}
.topbar-inf{flex:1;}
.topbar-tit{font-size:1rem;font-weight:900;color:#111;}
.topbar-tit b{color:var(--G2);}
.topbar-sub{font-size:0.68rem;color:#aaa;margin-top:1px;}

/* HERO */
.hero-sc{background:linear-gradient(135deg,#111,#1a1a1a);padding:20px 16px;margin-bottom:14px;display:flex;align-items:center;gap:14px;}
.hero-sc-ico{width:56px;height:56px;border-radius:18px;background:rgba(168,230,61,.15);display:flex;align-items:center;justify-content:center;font-size:1.8rem;flex-shrink:0;}
.hero-sc-info{flex:1;}
.hero-sc-tit{font-size:1rem;font-weight:800;color:#fff;margin-bottom:4px;}
.hero-sc-sub{font-size:0.72rem;color:#555;line-height:1.5;}

/* SECCIÓN */
.sec{padding:0 16px;margin-bottom:6px;}
.sec-tit{font-size:0.65rem;font-weight:800;color:#aaa;text-transform:uppercase;letter-spacing:1px;margin-bottom:10px;}

/* LISTA PROVEEDORES */
.prov-card{background:#fff;border-radius:14px;padding:12px 14px;border:1px solid #eee;margin-bottom:8px;display:flex;align-items:center;gap:12px;cursor:pointer;}
.prov-card:active{background:var(--F);}
.prov-av{width:44px;height:44px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:1.1rem;font-weight:800;color:#fff;flex-shrink:0;}
.prov-info{flex:1;min-width:0;}
.prov-nom{font-size:0.88rem;font-weight:700;color:#111;}
.prov-sub{font-size:0.68rem;color:#aaa;margin-top:2px;}
.prov-arr{width:24px;height:24px;background:var(--F);border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.prov-arr svg{width:12px;height:12px;stroke:#aaa;fill:none;stroke-width:2.5;}
.empty{text-align:center;padding:40px 20px;color:#bbb;font-size:0.82rem;line-height:1.8;}

/* MODAL FORMULARIO */
.modOv{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;z-index:500;}
.modOv.on{display:flex;}
.modSh{background:#fff;width:100%;border-radius:24px 24px 0 0;transform:translateY(100%);transition:.4s cubic-bezier(.16,1,.3,1);max-height:94vh;display:flex;flex-direction:column;overflow:hidden;}
.modOv.on .modSh{transform:translateY(0);}
.drag{width:36px;height:4px;background:#e0e0e0;border-radius:4px;margin:14px auto 0;flex-shrink:0;}
.modH{padding:12px 16px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #eee;flex-shrink:0;}
.modT{font-size:0.95rem;font-weight:800;color:#111;}
.modX{width:28px;height:28px;background:var(--F);border-radius:8px;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.modX svg{width:13px;height:13px;stroke:#555;fill:none;stroke-width:2.5;}
.modB{overflow-y:auto;padding:16px;flex:1;}

/* PROV SELECCIONADO */
.prov-sel-card{background:var(--F);border-radius:14px;padding:12px 14px;display:flex;align-items:center;gap:10px;margin-bottom:18px;}
.prov-sel-av{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:1rem;font-weight:800;color:#fff;flex-shrink:0;}
.prov-sel-nom{font-size:0.88rem;font-weight:700;color:#111;}
.prov-sel-sub{font-size:0.64rem;color:#aaa;margin-top:1px;}

/* OPCIONES DE PROBLEMA */
.prob-tit{font-size:0.72rem;font-weight:800;color:#111;margin-bottom:10px;text-transform:uppercase;letter-spacing:.5px;}
.prob-opt{display:flex;align-items:center;gap:10px;padding:11px 14px;background:var(--F);border-radius:12px;margin-bottom:7px;cursor:pointer;border:2px solid transparent;transition:.15s;}
.prob-opt:active{background:#eee;}
.prob-opt.selected{border-color:var(--G);background:rgba(168,230,61,.08);}
.prob-opt.asesor{border-color:var(--G2);background:rgba(168,230,61,.06);}
.prob-opt.asesor .prob-ico{background:var(--G);}
.prob-ico{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:1rem;flex-shrink:0;background:#fff;}
.prob-nom{font-size:0.82rem;font-weight:700;color:#111;}
.prob-sub{font-size:0.62rem;color:#aaa;margin-top:1px;}
.prob-check{width:20px;height:20px;border-radius:50%;border:2px solid #ddd;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-left:auto;}
.prob-opt.selected .prob-check{background:var(--G);border-color:var(--G);}
.prob-opt.selected .prob-check::after{content:'✓';font-size:.7rem;color:#111;font-weight:800;}

/* GRAVEDAD */
.grav-tit{font-size:0.72rem;font-weight:800;color:#111;margin:16px 0 10px;text-transform:uppercase;letter-spacing:.5px;}
.grav-opts{display:flex;gap:8px;margin-bottom:16px;}
.grav-btn{flex:1;padding:12px 8px;border-radius:14px;border:2px solid #eee;background:#fff;cursor:pointer;text-align:center;transition:.15s;}
.grav-btn:active{transform:scale(0.97);}
.grav-btn.sel{border-color:currentColor;}
.grav-btn.rojo{color:var(--R);}
.grav-btn.rojo.sel{background:rgba(255,77,77,.08);}
.grav-btn.naranja{color:var(--O);}
.grav-btn.naranja.sel{background:rgba(255,140,0,.08);}
.grav-btn.amarillo{color:#F59E0B;}
.grav-btn.amarillo.sel{background:rgba(245,158,11,.08);}
.grav-ico{font-size:1.4rem;margin-bottom:4px;}
.grav-lbl{font-size:0.66rem;font-weight:700;}
.grav-desc{font-size:0.58rem;color:#aaa;margin-top:2px;}

/* DESCRIPCIÓN */
.desc-tit{font-size:0.72rem;font-weight:800;color:#111;margin-bottom:8px;text-transform:uppercase;letter-spacing:.5px;}
.desc-inp{width:100%;padding:12px 14px;background:var(--F);border:1.5px solid #eee;border-radius:12px;font-family:'Inter',sans-serif;font-size:0.88rem;color:#111;outline:none;resize:none;height:80px;margin-bottom:16px;}
.desc-inp:focus{border-color:var(--G);}

/* BOTÓN ENVIAR */
.btn-enviar{width:100%;padding:14px;background:var(--G);color:#111;border:none;border-radius:14px;font-family:'Inter',sans-serif;font-size:0.92rem;font-weight:800;cursor:pointer;margin-bottom:8px;}
.btn-enviar:disabled{background:#e0e0e0;color:#aaa;cursor:not-allowed;}

/* CONFIRMACIÓN */
.confirm-wrap{text-align:center;padding:20px 0;}
.confirm-ico{font-size:3rem;margin-bottom:14px;}
.confirm-tit{font-size:1.1rem;font-weight:900;color:#111;margin-bottom:8px;}
.confirm-sub{font-size:0.82rem;color:#aaa;line-height:1.6;margin-bottom:20px;}
.confirm-ticket{background:var(--F);border-radius:14px;padding:14px;margin-bottom:20px;text-align:left;}
.ct-row{display:flex;justify-content:space-between;font-size:0.78rem;padding:5px 0;border-bottom:1px solid #eee;}
.ct-row:last-child{border:none;}
.ct-lbl{color:#aaa;}
.ct-val{font-weight:700;color:#111;}

.tab-bar{position:fixed;bottom:0;width:100%;background:#fff;border-top:1px solid #eee;display:flex;padding:8px 0;padding-bottom:max(8px,env(safe-area-inset-bottom));z-index:200;}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;text-decoration:none;padding:4px 0;}
.tab svg{width:22px;height:22px;stroke:#ccc;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.tab span{font-size:.55rem;font-weight:700;color:#ccc;text-transform:uppercase;}
.tab.active svg{stroke:var(--G2);}
.tab.active span{color:var(--G2);}
.tab-rel{position:relative;}
.tab-badge{position:absolute;top:-2px;right:6px;background:var(--R);color:#fff;font-size:.5rem;font-weight:800;width:14px;height:14px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:1.5px solid #fff;}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%) translateY(20px);background:#111;color:#fff;padding:10px 20px;border-radius:24px;font-size:.8rem;font-weight:600;opacity:0;transition:.3s;pointer-events:none;z-index:2000;white-space:nowrap;}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>

<div class="topbar">
  <button class="back-btn" onclick="history.back()"><svg viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg></button>
  <div class="topbar-inf">
    <div class="topbar-tit">PRO<b>VEED</b> · Soporte</div>
    <div class="topbar-sub">Servicio al cliente</div>
  </div>
</div>

<div class="hero-sc">
  <div class="hero-sc-ico">🎧</div>
  <div class="hero-sc-info">
    <div class="hero-sc-tit">¿Tuviste un problema?</div>
    <div class="hero-sc-sub">Selecciona el proveedor con quien tuviste inconvenientes y te ayudamos a resolverlo.</div>
  </div>
</div>

<div class="sec">
  <div class="sec-tit">Proveedores con los que has comprado</div>
  <div id="provs-wrap"><div class="empty">Cargando tus compras...</div></div>
</div>

<!-- MODAL FORMULARIO -->
<div class="modOv" id="modForm" onclick="cmod(event)">
  <div class="modSh"><div class="drag"></div>
    <div class="modH">
      <span class="modT">📋 Reportar problema</span>
      <button class="modX" onclick="cerrarMod()"><svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    </div>
    <div class="modB" id="modContenido"></div>
  </div>
</div>

<nav class="tab-bar">
  <a class="tab" href="dashboard.html"><svg viewBox="0 0 24 24"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg><span>Inicio</span></a>
  <a class="tab" href="explorar.html"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg><span>Explorar</span></a>
  <a class="tab" href="chat.html"><svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg><span>Chat</span></a>
  <a class="tab tab-rel" href="carrito.html"><svg viewBox="0 0 24 24"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg><span>Carrito</span><div class="tab-badge" id="carrito-badge" style="display:none;">0</div></a>
  <a class="tab" href="perfil-emprendedor.html"><svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg><span>Perfil</span></a>
</nav>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const {createClient}=supabase;
const db=createClient('https://hfmsyrmkewscnvwynzfq.supabase.co','sb_publishable_d1oLsq70a6ZV33vW3XkRgw_nYcN2Z9v');
const Q=id=>document.getElementById(id);

let uid='',me={},provSel=null,probSel=null,gravSel=null;

const carrito=JSON.parse(localStorage.getItem('carrito_proveed')||'[]');
const cntC=carrito.reduce((s,i)=>s+(i.cantidad||1),0);
if(cntC>0){const b=Q('carrito-badge');b.style.display='flex';b.textContent=cntC>9?'9+':cntC;}

const PROBLEMAS=[
  {id:'asesor',ico:'🎧',nom:'Quiero contactar a un asesor',sub:'Hablar directamente con soporte PROVEED',destacado:true},
  {id:'mal_estado',ico:'📦',nom:'Producto en mal estado',sub:'Llegó dañado, roto o con defectos'},
  {id:'no_corresponde',ico:'❌',nom:'No es lo que pedí',sub:'El producto no coincide con la descripción'},
  {id:'no_responde',ico:'🔇',nom:'Proveedor no responde',sub:'Llevo tiempo sin recibir respuesta'},
  {id:'no_llego',ico:'🚚',nom:'Producto no llegó',sub:'Pasó el tiempo acordado y no recibí nada'},
  {id:'precio',ico:'💰',nom:'Problema con el precio o cobro',sub:'Se cobró diferente a lo acordado'},
  {id:'devolucion',ico:'↩️',nom:'Quiero hacer una devolución',sub:'El producto no cumple lo prometido'},
  {id:'demora',ico:'⏰',nom:'Demora en la entrega',sub:'El pedido está tardando más de lo acordado'},
  {id:'otro',ico:'💬',nom:'Otro problema',sub:'Describe tu situación en el formulario'},
];

const GRAVEDADES=[
  {id:'rojo',cls:'rojo',ico:'🔴',lbl:'Muy grave',desc:'Urgente, necesito solución ya'},
  {id:'naranja',cls:'naranja',ico:'🟠',lbl:'Moderado',desc:'Importante pero puedo esperar'},
  {id:'amarillo',cls:'amarillo',ico:'🟡',lbl:'Leve',desc:'Tiene relevancia pero no es urgente'},
];

const pal=n=>{const c=['#FF8C00','#007AFF','#A8E63D','#A855F7','#FF4D4D','#F59E0B'];return c[Math.abs((n||'').charCodeAt(0)||0)%c.length];};

(async()=>{
  const {data:{session}}=await db.auth.getSession();
  if(!session){location.href='login.html';return;}
  uid=session.user.id;
  const {data:u}=await db.from('usuarios').select('*').eq('id',uid).single();
  if(u)me=u;

  // Traer proveedores únicos de los pedidos del emprendedor
  const {data:peds}=await db.from('pedidos').select('proveedor_id,nombre_proveedor,created_at,total').eq('emprendedor_id',uid);
  const w=Q('provs-wrap');

  if(!peds?.length){
    w.innerHTML=`<div class="empty">Aún no has realizado compras.<br>Cuando compres a un proveedor aparecerá aquí.</div>`;
    return;
  }

  // Agrupar por proveedor
  const map={};
  peds.forEach(p=>{
    if(!map[p.proveedor_id]){
      map[p.proveedor_id]={id:p.proveedor_id,nombre:p.nombre_proveedor||'Proveedor',pedidos:0,total:0,ultima:p.created_at};
    }
    map[p.proveedor_id].pedidos++;
    map[p.proveedor_id].total+=(p.total||0);
    if(new Date(p.created_at)>new Date(map[p.proveedor_id].ultima))map[p.proveedor_id].ultima=p.created_at;
  });

  w.innerHTML='';
  Object.values(map).forEach(prov=>{
    const fecha=new Date(prov.ultima).toLocaleDateString('es-EC',{day:'2-digit',month:'short',year:'numeric'});
    const d=document.createElement('div');d.className='prov-card';
    d.innerHTML=`<div class="prov-av" style="background:${pal(prov.nombre)};">${prov.nombre[0].toUpperCase()}</div>
      <div class="prov-info">
        <div class="prov-nom">${prov.nombre}</div>
        <div class="prov-sub">${prov.pedidos} pedido${prov.pedidos!==1?'s':''} · Último: ${fecha}</div>
      </div>
      <div class="prov-arr"><svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg></div>`;
    d.onclick=()=>abrirFormulario(prov);
    w.appendChild(d);
  });
})();

function abrirFormulario(prov){
  provSel=prov;probSel=null;gravSel=null;
  pintarFormulario();
  Q('modForm').classList.add('on');
}

function pintarFormulario(){
  const c=Q('modContenido');
  c.innerHTML=`
    <!-- PROVEEDOR SELECCIONADO -->
    <div class="prov-sel-card">
      <div class="prov-sel-av" style="background:${pal(provSel.nombre)};">${provSel.nombre[0].toUpperCase()}</div>
      <div><div class="prov-sel-nom">${provSel.nombre}</div><div class="prov-sel-sub">${provSel.pedidos} pedido${provSel.pedidos!==1?'s':''} realizados</div></div>
    </div>

    <!-- TIPO DE PROBLEMA -->
    <div class="prob-tit">¿Cuál es el problema?</div>
    ${PROBLEMAS.map(p=>`
      <div class="prob-opt${p.destacado?' asesor':''}" id="prob-${p.id}" onclick="selProb('${p.id}')">
        <div class="prob-ico">${p.ico}</div>
        <div style="flex:1;min-width:0;">
          <div class="prob-nom">${p.nom}</div>
          <div class="prob-sub">${p.sub}</div>
        </div>
        <div class="prob-check" id="chk-${p.id}"></div>
      </div>`).join('')}

    <!-- GRAVEDAD -->
    <div class="grav-tit">¿Qué tan grave es?</div>
    <div class="grav-opts">
      ${GRAVEDADES.map(g=>`
        <div class="grav-btn ${g.cls}" id="grav-${g.id}" onclick="selGrav('${g.id}')">
          <div class="grav-ico">${g.ico}</div>
          <div class="grav-lbl">${g.lbl}</div>
          <div class="grav-desc">${g.desc}</div>
        </div>`).join('')}
    </div>

    <!-- DESCRIPCIÓN -->
    <div class="desc-tit">Describe el problema</div>
    <textarea class="desc-inp" id="desc-inp" placeholder="Cuéntanos qué pasó con más detalle..."></textarea>

    <button class="btn-enviar" id="btn-enviar" onclick="enviarReporte()">📤 Enviar reporte</button>
  `;
}

window.selProb=function(id){
  probSel=id;
  PROBLEMAS.forEach(p=>{
    const el=Q(`prob-${p.id}`);const chk=Q(`chk-${p.id}`);
    if(el){el.classList.toggle('selected',p.id===id);}
    if(chk){chk.style.cssText=p.id===id?'background:var(--G);border-color:var(--G);':'border:2px solid #ddd;';}
  });
};

window.selGrav=function(id){
  gravSel=id;
  GRAVEDADES.forEach(g=>{
    const el=Q(`grav-${g.id}`);
    if(el)el.classList.toggle('sel',g.id===id);
  });
};

window.enviarReporte=async function(){
  if(!probSel){toast('Selecciona el tipo de problema');return;}
  if(!gravSel){toast('Selecciona la gravedad del problema');return;}
  const desc=Q('desc-inp').value.trim();
  const btn=Q('btn-enviar');
  btn.disabled=true;btn.textContent='Enviando...';

  const prob=PROBLEMAS.find(p=>p.id===probSel);
  const grav=GRAVEDADES.find(g=>g.id===gravSel);
  const ticket='TKT-'+Date.now().toString(36).toUpperCase();

  // Guardar en Supabase
  const {error}=await db.from('soporte_tickets').insert({
    emprendedor_id:uid,
    emprendedor_nombre:me.nombre||'Emprendedor',
    proveedor_id:provSel.id,
    proveedor_nombre:provSel.nombre,
    tipo_problema:probSel,
    descripcion_problema:prob.nom,
    gravedad:gravSel,
    descripcion_adicional:desc,
    estado:'abierto',
    ticket_id:ticket,
    created_at:new Date().toISOString()
  });

  // Si la tabla no existe aún, igual mostrar confirmación
  const c=Q('modContenido');
  c.innerHTML=`
    <div class="confirm-wrap">
      <div class="confirm-ico">${probSel==='asesor'?'🎧':'✅'}</div>
      <div class="confirm-tit">${probSel==='asesor'?'¡Un asesor te contactará pronto!':'¡Reporte enviado!'}</div>
      <div class="confirm-sub">${probSel==='asesor'
        ?'Hemos registrado tu solicitud. Un asesor de PROVEED se comunicará contigo en menos de 24 horas.'
        :'Hemos recibido tu reporte. Nuestro equipo lo revisará y te contactará para ayudarte a resolverlo.'
      }</div>
      <div class="confirm-ticket">
        <div class="ct-row"><span class="ct-lbl">Número de ticket</span><span class="ct-val">${ticket}</span></div>
        <div class="ct-row"><span class="ct-lbl">Proveedor</span><span class="ct-val">${provSel.nombre}</span></div>
        <div class="ct-row"><span class="ct-lbl">Problema</span><span class="ct-val">${prob.ico} ${prob.nom}</span></div>
        <div class="ct-row"><span class="ct-lbl">Gravedad</span><span class="ct-val">${grav.ico} ${grav.lbl}</span></div>
        <div class="ct-row"><span class="ct-lbl">Estado</span><span class="ct-val" style="color:var(--G2);">● Abierto</span></div>
      </div>
      <button class="btn-enviar" onclick="cerrarMod()">✓ Entendido</button>
    </div>
  `;
};

window.cerrarMod=()=>{Q('modForm').classList.remove('on');probSel=null;gravSel=null;};
window.cmod=e=>{if(e.target===Q('modForm'))cerrarMod();};
function toast(m){const t=Q('toast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),2500);}
</script>
</body>
</html>
